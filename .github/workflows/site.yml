name: Site

# Deploys barca.sh (site/, a Cloudflare Worker with static assets; see site/wrangler.jsonc).
#
# - Push to main (a merge-queue commit that changed the site): `wrangler deploy`, so barca.sh
#   serves main within a few minutes of the merge. A release PR changes CHANGELOG.md, so it
#   redeploys the Release Notes page too.
# - Pull request from a branch of this repository: `wrangler versions upload --preview-alias`,
#   a version of the Worker that production does not serve, at
#   https://<branch>-barca.<account subdomain>.workers.dev. A comment on the PR links it and is
#   updated on each push. PRs from forks get no preview: their runs have no secrets.
# - workflow_dispatch: deploys the chosen branch to production (main) or as a preview (any
#   other branch), e.g. to retry a failed deploy.
#
# Both need the repository secrets CLOUDFLARE_API_TOKEN (an "Edit Cloudflare Workers" token)
# and CLOUDFLARE_ACCOUNT_ID. With either missing the job warns, naming it, and stays green.

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per PR, or for main, at a time; a newer push supersedes the older run.
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        run: |
          present=true
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::The repository secret $name is not set, so the site was not deployed. Add it under Settings > Secrets and variables > Actions and rerun this job, or deploy by hand: cd site && npm ci && npm run deploy"
              present=false
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          # astro needs Node >= 22.22; 24 matches the UI build.
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        if: steps.secrets.outputs.present == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Deploy barca.sh
        if: steps.secrets.outputs.present == 'true' && github.ref == 'refs/heads/main'
        working-directory: site
        run: npx wrangler deploy --message "main ${GITHUB_SHA::12}"
      - name: Upload a preview version
        id: preview
        if: steps.secrets.outputs.present == 'true' && github.ref != 'refs/heads/main'
        working-directory: site
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A preview alias is a DNS label prefix: lowercase letters, digits and dashes,
          # starting with a letter, and short enough that "<alias>-barca" fits in 63 chars.
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//')
          case "$alias" in [a-z]*) ;; *) alias="b-$alias" ;; esac
          alias=$(printf '%s' "${alias:0:48}" | sed -E 's/-+$//')
          npx wrangler versions upload --preview-alias "$alias" --message "$BRANCH ${SHA::12}" | tee upload.log
          url=$(grep -oE "https://$alias-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a preview URL for alias $alias"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Link the preview from the PR
        if: steps.preview.outputs.url && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- barca-site-preview -->'
          body="$marker
          **Site preview:** $URL (built from ${SHA::12}; updated on each push)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
