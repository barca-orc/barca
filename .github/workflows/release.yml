name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run the build jobs (no release/publish: those are gated to tags below)
  # when this workflow changes, or on demand to pre-warm the build cache.
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/smoke-release-package.py", "scripts/wait-pypi-wheel.py", "scripts/changelog-section.py"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The web UI is embedded in every wheel's barca binary (crates/barca-server/src/ui.rs embeds
  # ui/dist at compile time) and shipped prebuilt in the sdist so building from source does
  # not need Node. Each build job restores ui/dist from the cache CI's `build` job fills,
  # keyed on a hash of ui/ (Depot Cache is shared across refs, so a tag finds the entry the
  # release PR's merge group wrote), or builds it; no job waits on a separate UI build. The
  # UI's own tests ran in CI's full tier on the release PR.

  # CHANGELOG.md is the source of release notes: the release body is the version's
  # `## <version> (<date>)` section plus an install line. This runs first and the GitHub
  # release and the PyPI upload both need it, so a version without notes publishes nothing.
  # On a pull request or manual run it checks the version in pyproject.toml.
  release-notes:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          python3 scripts/changelog-section.py "$VERSION" --install > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
            name: linux-x86_64
          - os: depot-ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin-target: aarch64
            name: linux-arm64
          - os: depot-ubuntu-24.04
            target: x86_64-unknown-linux-musl
            maturin-target: x86_64-unknown-linux-musl
            name: linux-musl-x86_64
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
            compatibility: musllinux_1_2
            runtime: python:3.13-alpine
          - os: depot-ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            maturin-target: aarch64-unknown-linux-musl
            name: linux-musl-arm64
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
            compatibility: musllinux_1_2
            runtime: python:3.13-alpine
          - os: depot-macos-15
            target: aarch64-apple-darwin
            maturin-target: aarch64
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the web UI build
        id: ui-dist
        uses: actions/cache@v4
        with:
          path: ui/dist
          key: ui-dist-v1-${{ hashFiles('ui/**') }}
      - if: steps.ui-dist.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - if: steps.ui-dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the web UI
        if: steps.ui-dist.outputs.cache-hit != 'true'
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # On Depot runners the GitHub Actions cache API is backed by Depot Cache,
      # which is not isolated per ref -- so a tag build can restore the cache
      # saved by the previous tag (GitHub's own cache cannot: each tag is a new
      # ref). No sccache: maturin-action's `sccache: true` exports
      # RUSTC_WRAPPER=sccache for the whole job, which breaks this step's
      # post-run `cargo metadata` on the host (sccache is only installed in the
      # manylinux container) so it saved an empty cache, and sccache's own
      # GitHub-cache writes failed on every compile anyway.
      # rust-cache never re-saves on an exact-key hit, so a bad entry sticks
      # until the key changes. Bump the `v2` below if a cache ever needs busting
      # (v1 held an empty Linux cache from the sccache breakage above).
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-v2-${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
            3.14

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin-target }}
          args: --release --locked --out dist --find-interpreter
          manylinux: ${{ matrix.compatibility || 'auto' }}
          container: ${{ matrix.container || '' }}

      - name: Package standalone CLI binary
        run: |
          BIN="target/${{ matrix.target }}/release/barca"
          [ -f "$BIN" ] || BIN="target/release/barca"
          # The release binary must carry the web UI (a missing ui/dist still
          # compiles, so check rather than trust it).
          grep -qa '<div id="root">' "$BIN" || { echo "barca binary has no embedded web UI"; exit 1; }
          cp "$BIN" barca-${{ matrix.name }}
          chmod +x barca-${{ matrix.name }}
          tar czf barca-${{ matrix.name }}.tar.gz barca-${{ matrix.name }}

      - name: Install and execute Linux artifacts without a compiler
        if: startsWith(matrix.name, 'linux-')
        timeout-minutes: 5
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          docker run --rm --init -v "$PWD:/io:ro" \
            -e BARCA_VERSION="$VERSION" -e BARCA_NATIVE="barca-${{ matrix.name }}" \
            "${{ matrix.runtime || 'python:3.13-slim' }}" sh -eu -c '
              python -m pip install --disable-pip-version-check uv
              mkdir /tmp/native
              cp "/io/$BARCA_NATIVE" /tmp/native/barca
              uv init --bare /tmp/project
              cd /tmp/project
              uv add --no-index --find-links /io/dist --no-build "barca==$BARCA_VERSION"
              uv run --no-sync python /io/scripts/smoke-release-package.py \
                --version "$BARCA_VERSION" --native /tmp/native/barca
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: barca-${{ matrix.name }}.tar.gz

  build-sdist:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the web UI build
        id: ui-dist
        uses: actions/cache@v4
        with:
          path: ui/dist
          key: ui-dist-v1-${{ hashFiles('ui/**') }}
      - if: steps.ui-dist.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - if: steps.ui-dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the web UI
        if: steps.ui-dist.outputs.cache-hit != 'true'
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-notes, build-wheels, build-sdist]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/


      - name: Collect release assets
        run: |
          mkdir -p release/
          cp artifacts/wheels-*/*.whl release/
          cp artifacts/cli-*/*.tar.gz release/
          cp artifacts/sdist/*.tar.gz release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'dev') }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-notes, build-wheels, build-sdist]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist/
          cp artifacts/wheels-*/*.whl dist/
          cp artifacts/sdist/*.tar.gz dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  # Deploys the docs site, barca.sh (Cloudflare Workers, site/wrangler.jsonc), from the tag.
  # It runs after the release and the PyPI upload and nothing waits on it, so a failed deploy
  # never blocks or fails a release; rerun this job, or deploy by hand with
  # `cd site && npm ci && npm run deploy`. Without the Cloudflare secrets the job warns and
  # does nothing (a job-level `if` cannot read secrets), so a repository without them still
  # gets a green release run.
  deploy-site:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, publish-pypi]
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          present=true
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::The repository secret $name is not set, so barca.sh was not deployed. Add it under Settings > Secrets and variables > Actions and rerun this job, or deploy by hand: cd site && npm ci && npm run deploy"
              present=false
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          # astro needs Node >= 22.22; 24 matches the UI build above.
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        if: steps.secrets.outputs.present == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.present == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  # One sandbox waits for PyPI's CDN to serve the new version (its simple index is cached for up
  # to 10 minutes after a publish, #480) and for every Linux wheel to be listed, so the four
  # verification sandboxes below start once the install can succeed instead of each polling.
  wait-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the published wheels on PyPI
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          for architecture in x86_64 aarch64; do
            for libc in gnu musl; do
              python3 scripts/wait-pypi-wheel.py --version "$VERSION" --architecture "$architecture" --libc "$libc"
            done
          done

  verify-published-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, publish-pypi, wait-pypi]
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - runner: depot-ubuntu-24.04
            machine: x86_64
            name: x86_64
          - runner: depot-ubuntu-24.04-arm
            machine: aarch64
            name: arm64
        libc:
          - name: gnu
            prefix: ''
            runtime: python:3.13-slim
          - name: musl
            prefix: musl-
            runtime: python:3.13-alpine
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact published native archive
        env:
          GH_TOKEN: ${{ github.token }}
          BARCA_NATIVE: barca-linux-${{ matrix.libc.prefix }}${{ matrix.architecture.name }}
          BARCA_MACHINE: ${{ matrix.architecture.machine }}
        run: |
          test "$(uname -m)" = "$BARCA_MACHINE"
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "BARCA_VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BARCA_NATIVE.tar.gz" --dir published
          tar xzf "published/$BARCA_NATIVE.tar.gz" -C published
      - name: Verify official PyPI and GitHub artifacts in a compiler-free runtime
        timeout-minutes: 30
        env:
          BARCA_NATIVE: barca-linux-${{ matrix.libc.prefix }}${{ matrix.architecture.name }}
          BARCA_MACHINE: ${{ matrix.architecture.machine }}
          BARCA_LIBC: ${{ matrix.libc.name }}
        run: |
          BARCA_VERIFY_CONTAINER="barca-published-$GITHUB_RUN_ID-${{ matrix.architecture.name }}-${{ matrix.libc.name }}"
          trap 'docker rm -f "$BARCA_VERIFY_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker run --rm --init --name "$BARCA_VERIFY_CONTAINER" -v "$PWD:/io:ro" \
            -e BARCA_VERSION -e BARCA_NATIVE -e BARCA_MACHINE -e BARCA_LIBC \
            "${{ matrix.libc.runtime }}" sh -eu -c '
              test "$(uname -m)" = "$BARCA_MACHINE"
              python -m pip install --disable-pip-version-check --only-binary=:all: uv
              python /io/scripts/wait-pypi-wheel.py --version "$BARCA_VERSION" \
                --architecture "$BARCA_MACHINE" --libc "$BARCA_LIBC"
              mkdir /tmp/native
              cp "/io/published/$BARCA_NATIVE" /tmp/native/barca
              uv init --bare /tmp/project
              cd /tmp/project
              # PyPI serves https://pypi.org/simple/barca/ with cache-control: max-age=600, so for up
              # to 10 minutes after publish the CDN can keep answering with an index that lacks the
              # new version (#480; v0.24.3 and v0.25.0 both hit it). uv and pip read that normal URL,
              # never a cache-busted one, so retry the real install on it: every 20 s for up to
              # 12 minutes, and only while uv says the version does not exist yet.
              attempt=1
              until uv --no-cache add --index https://pypi.org/simple --no-build "barca==$BARCA_VERSION" 2>/tmp/uv-add.err; do
                cat /tmp/uv-add.err >&2
                grep -q "no version of barca==$BARCA_VERSION" /tmp/uv-add.err || exit 1
                if [ "$attempt" -ge 36 ]; then
                  echo "barca==$BARCA_VERSION is still not resolvable from https://pypi.org/simple after 12 minutes" >&2
                  exit 1
                fi
                echo "barca==$BARCA_VERSION not on the simple index yet (attempt $attempt/36); retrying in 20 s" >&2
                attempt=$((attempt + 1))
                sleep 20
              done
              uv run --no-sync python /io/scripts/smoke-release-package.py \
                --version "$BARCA_VERSION" --native /tmp/native/barca
            '
