name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run the build jobs (no release/publish: those are gated to tags below)
  # when this workflow changes, or on demand to pre-warm the build cache.
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/smoke-release-package.py", "scripts/wait-pypi-wheel.py"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The web UI is built once and embedded in every wheel's barca binary
  # (crates/barca-server/src/ui.rs embeds ui/dist at compile time), and shipped
  # prebuilt in the sdist so building from source does not need Node.
  build-ui:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui test
          pnpm --dir ui build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

  build-wheels:
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
            name: linux-x86_64
          - os: depot-ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin-target: aarch64
            name: linux-arm64
          - os: depot-ubuntu-24.04
            target: x86_64-unknown-linux-musl
            maturin-target: x86_64-unknown-linux-musl
            name: linux-musl-x86_64
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
            compatibility: musllinux_1_2
            runtime: python:3.13-alpine
          - os: depot-ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            maturin-target: aarch64-unknown-linux-musl
            name: linux-musl-arm64
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
            compatibility: musllinux_1_2
            runtime: python:3.13-alpine
          - os: depot-macos-15
            target: aarch64-apple-darwin
            maturin-target: aarch64
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # On Depot runners the GitHub Actions cache API is backed by Depot Cache,
      # which is not isolated per ref -- so a tag build can restore the cache
      # saved by the previous tag (GitHub's own cache cannot: each tag is a new
      # ref). No sccache: maturin-action's `sccache: true` exports
      # RUSTC_WRAPPER=sccache for the whole job, which breaks this step's
      # post-run `cargo metadata` on the host (sccache is only installed in the
      # manylinux container) so it saved an empty cache, and sccache's own
      # GitHub-cache writes failed on every compile anyway.
      # rust-cache never re-saves on an exact-key hit, so a bad entry sticks
      # until the key changes. Bump the `v2` below if a cache ever needs busting
      # (v1 held an empty Linux cache from the sccache breakage above).
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-v2-${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
            3.14

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin-target }}
          args: --release --locked --out dist --find-interpreter
          manylinux: ${{ matrix.compatibility || 'auto' }}
          container: ${{ matrix.container || '' }}

      - name: Package standalone CLI binary
        run: |
          BIN="target/${{ matrix.target }}/release/barca"
          [ -f "$BIN" ] || BIN="target/release/barca"
          # The release binary must carry the web UI (a missing ui/dist still
          # compiles, so check rather than trust it).
          grep -qa '<div id="root">' "$BIN" || { echo "barca binary has no embedded web UI"; exit 1; }
          cp "$BIN" barca-${{ matrix.name }}
          chmod +x barca-${{ matrix.name }}
          tar czf barca-${{ matrix.name }}.tar.gz barca-${{ matrix.name }}

      - name: Install and execute Linux artifacts without a compiler
        if: startsWith(matrix.name, 'linux-')
        timeout-minutes: 5
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          docker run --rm --init -v "$PWD:/io:ro" \
            -e BARCA_VERSION="$VERSION" -e BARCA_NATIVE="barca-${{ matrix.name }}" \
            "${{ matrix.runtime || 'python:3.13-slim' }}" sh -eu -c '
              python -m pip install --disable-pip-version-check uv
              mkdir /tmp/native
              cp "/io/$BARCA_NATIVE" /tmp/native/barca
              uv init --bare /tmp/project
              cd /tmp/project
              uv add --no-index --find-links /io/dist --no-build "barca==$BARCA_VERSION"
              uv run --no-sync python /io/scripts/smoke-release-package.py \
                --version "$BARCA_VERSION" --native /tmp/native/barca
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: barca-${{ matrix.name }}.tar.gz

  build-sdist:
    needs: build-ui
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Install git-cliff
        run: pip install git-cliff

      - name: Generate release notes
        run: |
          git cliff --config cliff.toml --latest --strip header > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Install" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo "uv add barca" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Collect release assets
        run: |
          mkdir -p release/
          cp artifacts/wheels-*/*.whl release/
          cp artifacts/cli-*/*.tar.gz release/
          cp artifacts/sdist/*.tar.gz release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'dev') }}
          body_path: RELEASE_NOTES.md

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist/
          cp artifacts/wheels-*/*.whl dist/
          cp artifacts/sdist/*.tar.gz dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  verify-published-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, publish-pypi]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - runner: depot-ubuntu-24.04
            machine: x86_64
            name: x86_64
          - runner: depot-ubuntu-24.04-arm
            machine: aarch64
            name: arm64
        libc:
          - name: gnu
            prefix: ''
            runtime: python:3.13-slim
          - name: musl
            prefix: musl-
            runtime: python:3.13-alpine
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact published native archive
        env:
          GH_TOKEN: ${{ github.token }}
          BARCA_NATIVE: barca-linux-${{ matrix.libc.prefix }}${{ matrix.architecture.name }}
          BARCA_MACHINE: ${{ matrix.architecture.machine }}
        run: |
          test "$(uname -m)" = "$BARCA_MACHINE"
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "BARCA_VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BARCA_NATIVE.tar.gz" --dir published
          tar xzf "published/$BARCA_NATIVE.tar.gz" -C published
      - name: Verify official PyPI and GitHub artifacts in a compiler-free runtime
        timeout-minutes: 5
        env:
          BARCA_NATIVE: barca-linux-${{ matrix.libc.prefix }}${{ matrix.architecture.name }}
          BARCA_MACHINE: ${{ matrix.architecture.machine }}
          BARCA_LIBC: ${{ matrix.libc.name }}
        run: |
          BARCA_VERIFY_CONTAINER="barca-published-$GITHUB_RUN_ID-${{ matrix.architecture.name }}-${{ matrix.libc.name }}"
          trap 'docker rm -f "$BARCA_VERIFY_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker run --rm --init --name "$BARCA_VERIFY_CONTAINER" -v "$PWD:/io:ro" \
            -e BARCA_VERSION -e BARCA_NATIVE -e BARCA_MACHINE -e BARCA_LIBC \
            "${{ matrix.libc.runtime }}" sh -eu -c '
              test "$(uname -m)" = "$BARCA_MACHINE"
              python -m pip install --disable-pip-version-check --only-binary=:all: uv
              python /io/scripts/wait-pypi-wheel.py --version "$BARCA_VERSION" \
                --architecture "$BARCA_MACHINE" --libc "$BARCA_LIBC"
              mkdir /tmp/native
              cp "/io/published/$BARCA_NATIVE" /tmp/native/barca
              uv init --bare /tmp/project
              cd /tmp/project
              uv --no-cache add --index https://pypi.org/simple --no-build "barca==$BARCA_VERSION"
              uv run --no-sync python /io/scripts/smoke-release-package.py \
                --version "$BARCA_VERSION" --native /tmp/native/barca
            '
