name: Save the Rust build directory
description: >-
  Prunes incremental session dirs not used for 2 days (which bounds the entry's size), reports
  the size of ./target in the step summary and saves ./target and the cargo registry under the
  key rust-cache-restore produced. Call it with `if: success()`.

inputs:
  key:
    description: The key to save under (rust-cache-restore's `key` output)
    required: true

runs:
  using: composite
  steps:
    - name: Prune stale incremental sessions
      shell: bash
      run: |
        find target -path '*/incremental/*' -mindepth 3 -maxdepth 3 -type d -mtime +2 \
          -exec rm -rf {} + 2>/dev/null || true
        echo "target: $(du -sh target | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Save the build directory
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ inputs.key }}
