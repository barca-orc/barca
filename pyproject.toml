[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "barca"
version = "0.37.1"
description = "Invisible asset orchestrator"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/barca-orc/barca"

[project.optional-dependencies]
parquet = ["pyarrow", "pandas"]
sql = ["duckdb>=1.4,<3"]
fast = ["orjson"]
datadog = ["ddtrace>=3,<5"]
azure = ["fsspec", "adlfs"]
s3 = ["fsspec", "s3fs"]
# Cloudflare R2 is S3-compatible: install the s3 extra and point
# storage_options at the R2 endpoint (see https://barca.sh/reference/remote-storage/).
r2 = ["fsspec", "s3fs"]
# gcsfs speaks the GCS API for artifacts and metadata backups; google-cloud-storage signs
# GCS links (barca.signed_url, barca get -o url).
gcs = ["fsspec", "gcsfs", "google-cloud-storage"]
remote = ["fsspec", "adlfs", "s3fs", "gcsfs", "google-cloud-storage"]
# Everything needed to run the full test suite, including the object-store
# backend clients exercised against local emulators (MinIO / fake-gcs-server /
# Azurite). Not part of a normal install.
test = [
    "pytest",
    "pytest-xdist>=3.8,<4",
    "jsonschema>=4,<5",
    "PyYAML>=6,<7",
    "pandas",
    "pyarrow",
    "polars",
    "duckdb>=1.4,<3",
    "orjson",
    "fsspec",
    "adlfs",
    "s3fs",
    "gcsfs",
    "google-cloud-storage",
    # Datadog: Python spans in the workers and the fake Agent's msgpack decoding
    # (python/tests/test_telemetry_datadog.py). CI installs Datadog's APM test agent
    # (ddapm-test-agent) in a venv of its own: it pins an older protobuf.
    "ddtrace>=3,<5",
    "msgpack",
]

[tool.maturin]
bindings = "bin"
python-source = "python"
module-name = "barca"
manifest-path = "crates/barca-cli/Cargo.toml"
# ui/dist is the prebuilt web UI (the release workflow builds it first); the sdist
# carries it so a source build embeds the UI without Node.
include = ["LICENSE", { path = "ui/dist/**/*", format = "sdist" }]

[tool.ruff]
line-length = 100

[tool.ty.environment]
extra-paths = ["python"]
# Check against the oldest supported Python, whatever interpreter the checker finds.
python-version = "3.12"

[tool.ty.analysis]
# Optional runtime dependencies (extras) are imported lazily and typed as Any, so ty gives the
# same answer whether or not they are installed in the environment it finds. The prek hook
# pins ty's version (prek.toml).
replace-imports-with-any = [
    "aiobotocore.**",
    "azure.**",
    "ddtrace.**",
    "duckdb.**",
    "fsspec.**",
    "google.**",
    "orjson.**",
    "pandas.**",
    "polars.**",
    "pyarrow.**",
]
