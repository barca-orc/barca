[package]
name = "barca-engine"
version = "0.46.0"
edition = "2024"
description = "Engine layer — plan in, results out: the coordinator, the worker pool, the wire protocol"

# barca-model, barca-compile and barca-proc, and barca-python for `batch` alone; no metadata
# database (#905, #1056).
[dependencies]
barca-model = { path = "../barca-model" }
barca-compile = { path = "../barca-compile" }
barca-python = { path = "../barca-python" }
barca-proc = { path = "../barca-proc" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util", "time", "sync", "process"] }
tokio-util = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
