[package]
name = "barca-analysis"
version = "0.45.0"
edition = "2024"
description = "Analysis layer — read models over what was recorded: status, health, causes, estimates, the rollup, run explanations"

# Above barca-decide, beside the run orchestrator (#1056, C6). Never barca-engine or barca-run:
# a read model reads what a run recorded and starts nothing.
[dependencies]
barca-model = { path = "../barca-model" }
barca-compile = { path = "../barca-compile" }
barca-db = { path = "../barca-db" }
barca-store = { path = "../barca-store" }
barca-decide = { path = "../barca-decide" }
serde = { workspace = true }
serde_json = { workspace = true }
croner = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util", "time", "sync", "process"] }
# Optional: TypeScript binding generation (enable with --features ts). Kept out
# of the production binary; used only to regenerate ui/src/lib/generated/.
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# Tests write graphs as Python source. No code of this crate loads one: it takes a graph.
barca-python = { path = "../barca-python" }
tempfile = { workspace = true }

[features]
# Generate TS type bindings for the frontend. Off by default.
ts = ["dep:ts-rs", "barca-model/ts", "barca-db/ts", "barca-store/ts"]
