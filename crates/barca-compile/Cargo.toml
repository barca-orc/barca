[package]
name = "barca-compile"
version = "0.46.4"
edition = "2024"
description = "Planning layer — a graph in, an execution plan out: targets, selection, the planner, partition expansion, plan warnings"

# Only barca-model among barca crates; no libsql, no HTTP client (#905), and no Python parser:
# the frontend is barca-python (#1056, C6), a dev-dependency here for tests that write a graph
# as Python source.
[dependencies]
barca-model = { path = "../barca-model" }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
# Tests plan graphs written as Python source.
barca-python = { path = "../barca-python" }
tempfile = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
