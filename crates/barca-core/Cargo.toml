[package]
name = "barca-core"
version = "0.41.1"
edition = "2024"
description = "Core library — models, parsing, DAG, execution planning, hashing, dispatch, caching"

[dependencies]
ruff_python_parser = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = { workspace = true }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
croner = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
smallvec = { version = "1.13", features = ["serde"] }
tempfile = { workspace = true }
libsql = { version = "=0.10.0", default-features = false, features = ["core"] }
tokio = { workspace = true, features = ["rt", "io-util", "time", "sync", "process"] }
tokio-util = { workspace = true }
futures = { workspace = true }
indicatif = "0.18.4"
libc = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
# Optional: TypeScript binding generation (enable with --features ts). Kept out
# of the production binary; used only to regenerate ui/src/lib/generated/.
ts-rs = { workspace = true, optional = true }

[features]
# Generate TS type bindings for the frontend. Off by default.
ts = ["dep:ts-rs"]
