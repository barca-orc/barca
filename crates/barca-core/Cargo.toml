[package]
name = "barca-core"
version = "0.13.0"
edition = "2024"
description = "Core library — models, parsing, DAG, execution planning, hashing, dispatch, caching"

[dependencies]
ruff_python_parser = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = { workspace = true }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
croner = "3.0.1"
smallvec = { version = "1.13", features = ["serde"] }
tempfile = "3"
turso = { version = "0.7.0-pre.5", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
tokio-util = "0.7"
futures = "0.3"
indicatif = "0.18.4"
libc = "0.2"
toml = { workspace = true }
