[package]
name = "barca-db"
version = "0.42.0"
edition = "2024"
description = "Metadata database layer — `.barca/metadata.db`: its schema, its writes and the rows' owners"

# Only barca-model among barca crates (#905): no compile, engine or core.
[dependencies]
barca-model = { path = "../barca-model" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libsql = { version = "=0.10.0", default-features = false, features = ["core"] }
tokio = { workspace = true, features = ["rt", "io-util", "time", "sync", "process"] }
tokio-util = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
# Optional: TypeScript binding generation (enable with --features ts). Kept out
# of the production binary; used only to regenerate ui/src/lib/generated/.
ts-rs = { workspace = true, optional = true }

[features]
# Generate TS type bindings for the frontend. Off by default.
ts = ["dep:ts-rs", "barca-model/ts"]
