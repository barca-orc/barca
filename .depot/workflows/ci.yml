name: CI

on:
  pull_request:
    branches: [main]
    # `labeled` so adding `ci-full` starts the full set without another push.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue: each merge group (one or more queued PRs on top of main) is tested
  # before main moves to it. This is the run that gates a merge.
  merge_group:
    types: [checks_requested]
  # No run on push to main: main only ever moves to a merge group's commit, which the queue
  # has just tested.

# One run per PR at a time; a newer push to the PR cancels the older run. A merge group has a
# ref of its own (gh-readonly-queue/main/pr-<n>-<sha>), so merge-group runs never share a group
# with each other or with PR runs, and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What runs where. The required checks are `CI / test` and `CI / backends`, the two aggregator
# jobs at the end of each group below; they report on every event. Three tiers:
#
# - fast (a pull request): `checks` (the CHANGELOG and specification checks, the prek hooks:
#   ruff, ruff format, ty, cargo fmt, version sync, uv lock), `clippy`, `changes` only, so a
#   PR can enter the merge queue about a minute after a push. Everything else is skipped, and
#   the aggregators accept those skips.
# - merge (a merge group): the fast set plus `rust-tests`, the wheel `build`, one `python`
#   job running the quick subset in scripts/fast-tests.txt and `perf`, the performance
#   budgets (scripts/perf-gate.py). About two minutes; this is the gate every merge to main
#   passes.
# - full (a release): everything, with the object-store emulators, the duckdb 1.x rerun and
#   the real minute checkpoint test on. A release PR (head branch `release/v*`) runs it as
#   its PR run, and its merge group (checked-out commit `chore(release): ...`) runs it again. A PR
#   labelled `ci-full` runs it too.
#
# The changes job selects one tier with scripts/ci-tier.py; jobs consume its output:
#   full  = (pull_request && (head_ref starts with release/v || label ci-full))
#           || (merge_group && checked-out commit message contains "chore(release)")
#   merge = merge_group || full
#
# Sandbox sizes: Depot bills per vCPU-second, so a larger sandbox costs the same CPU time and
# only shortens the wall time. Jobs that compile or run tests in parallel use more CPUs.
env:
  # Python test shards in the backends check (scripts/ci-shards.py). Three are as fast as four
  # (the longest test files set the floor) and cost one sandbox less.
  PYTHON_SHARDS: 3
  # What the aggregators run on the results of the jobs they need. A job the tier runs must
  # succeed; a job the tier skips may be skipped. A failed or cancelled job always fails the
  # check.
  CHECK_NEEDS: |
    import json, os, sys
    tier = os.environ["TIER"]
    runs = {
        "fast": {"checks", "clippy", "changes"},
        "merge": {"checks", "clippy", "changes", "rust-tests", "build", "python", "perf"},
    }.get(tier)  # None: full, every job runs
    results = {job: v["result"] for job, v in json.loads(os.environ["RESULTS"]).items()}
    for job, result in results.items():
        print(f"{job}: {result}")
    bad = {
        job: r for job, r in results.items()
        if r != "success" and not (r == "skipped" and runs is not None and job not in runs)
    }
    sys.exit(f"tier {tier}: not every job this check needs succeeded: {bad}" if bad else 0)

jobs:
  # ---- CI / test -------------------------------------------------------------------------
  #
  # checks, clippy (fast set); rust-tests, and integration against the wheel `build` makes
  # once for both checks (full set).
  #
  # Cargo must build on local disk: builds on the shared cache volume produced corrupt
  # .rlib/.rmeta files, even with a target dir per PR. So each Rust job builds incrementally in
  # ./target, restored before the build from an immutable cache archive (actions/cache: an
  # entry is written whole under a new key, never updated in place) and saved after it
  # (.depot/actions/rust-cache-restore and rust-cache-save). Keys carry the job, the rustc
  # version, the Cargo.lock hash, the branch and the run; a PR starts from its own latest
  # entry, else main's. A merge group saves under `main`, since its commit is what main
  # becomes: each run writes its own key, so concurrent merge groups never write the same
  # entry, and a restore takes the newest under the prefix. Rust jobs use no sccache: it
  # cannot cache incremental crates, and the restored target dir already holds the compiled
  # dependencies. Jobs that test against the wheel set up Python, uv and the wheel with
  # .depot/actions/setup-wheel.
  checks:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the CHANGELOG check reads each release's tag.
          fetch-depth: 0

      # A branch cut before a release can merge its notes into the section that release
      # shipped (git applies the hunk by context). Released sections must match their tag's
      # copy or the base's; a commit line `Changelog-Fix: <reason>` allows a deliberate fix.
      - name: Released CHANGELOG sections are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/check-changelog.py --base "$BASE"

      - name: Specification owners, links and evidence references
        run: |
          python3 scripts/check-specs.py
          python3 scripts/test-check-specs.py

      # The prek hooks of prek.toml, the same ones `prek run --all-files` (scripts/check-fast.sh)
      # runs locally: ruff and ruff format at their pinned release, ty (pinned) on
      # python/barca/, cargo fmt, the version sync and `uv lock --check`, plus the whitespace,
      # YAML, TOML and merge-marker checks. The hook environments (ruff, ty) are cached on
      # prek.toml; rustfmt is the only toolchain component the job needs.
      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Restore the hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-v1-${{ runner.os }}-${{ hashFiles('prek.toml') }}

      - name: Lint hooks (prek.toml)
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Install Java for specification models
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The jar is cached on its pinned version; the checker verifies its SHA-256 before
      # executing it, cached or downloaded.
      - name: Restore tla2tools.jar
        id: tla2tools
        uses: actions/cache@v4
        with:
          path: .spec-check/tla2tools.jar
          key: tla2tools-v1.7.4

      - name: Download tla2tools.jar
        if: steps.tla2tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .spec-check
          curl --retry 3 --max-time 60 -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o .spec-check/tla2tools.jar

      - name: Check specification models and negative controls
        run: python3 specs/models/check.py --jar .spec-check/tla2tools.jar

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the docs site for Cloudflare Workers
        working-directory: site
        run: |
          npm ci
          npm run build

  clippy:
    runs-on: depot-ubuntu-24.04-4
    # A hung step fails the job instead of holding it for hours (#637).
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      # Incremental: rustc reuses the unchanged parts of barca's own crates from the restored
      # target dir (checkout makes every file look modified, but rustc compares content).
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore the build directory
        id: rust-cache
        uses: ./.depot/actions/rust-cache-restore
        with:
          name: clippy
          toolchain: ${{ steps.toolchain.outputs.cachekey }}
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Saved from a PR's own runs, and from a merge group as main's next entry. Incremental
      # session dirs not used for 2 days are pruned first, which bounds the entry's size.
      - name: Save the build directory
        if: success()
        uses: ./.depot/actions/rust-cache-save
        with:
          key: ${{ steps.rust-cache.outputs.key }}

  rust-tests:
    # Tier merge and up.
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/v') || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
    runs-on: depot-ubuntu-24.04-8
    # See clippy (#637).
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      # Incremental: rustc reuses the unchanged parts of barca's own crates from the restored
      # target dir (checkout makes every file look modified, but rustc compares content).
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Restore the build directory
        id: rust-cache
        uses: ./.depot/actions/rust-cache-restore
        with:
          name: tests
          toolchain: ${{ steps.toolchain.outputs.cachekey }}
      # nextest runs each test in its own process. The crates have no runnable doctests (their
      # code blocks are `text`/`json`), so there is no `cargo test --doc` step.
      - name: Run unit tests
        # Includes building the test binaries; the tests themselves take under a minute.
        timeout-minutes: 20
        run: cargo nextest run --workspace --no-fail-fast

      # The web UI's wire types are generated from Rust by ts-rs (ui/ARCHITECTURE.md). This is
      # what `pnpm gen:types` runs; any difference from the committed ui/src/lib/generated,
      # a new file included, fails the build.
      - name: The UI's generated types match Rust
        timeout-minutes: 15
        run: |
          bash ui/scripts/regen-types.sh
          git add --intent-to-add ui/src/lib/generated
          git diff --exit-code -- ui/src/lib/generated

      # Saved from a PR's own runs, and from a merge group as main's next entry. Incremental
      # session dirs not used for 2 days are pruned first, which bounds the entry's size.
      - name: Save the build directory
        if: success()
        uses: ./.depot/actions/rust-cache-save
        with:
          key: ${{ steps.rust-cache.outputs.key }}

  integration:
    # The shell integration tests and benchmark examples, against the wheel `build` makes.
    # Tier full only.
    needs: [build, changes]
    if: ${{ needs.changes.outputs.tier == 'full' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python, uv and the wheel
        uses: ./.depot/actions/setup-wheel
        with:
          uv-cache: true
          # scikit-learn: only benchmarks/spaceflights needs it; pandas, pyarrow: only
          # benchmarks/etl_duckdb_dataframes.
          packages: scikit-learn pandas pyarrow

      - name: Run integration tests
        run: |
          bash tests/integration/test_cli.sh
          bash tests/integration/test_cache.sh
          bash tests/integration/test_cache_gaps.sh
          bash tests/integration/test_cache_fuzz.sh
          bash tests/integration/test_env.sh
          bash tests/integration/test_remote_state.sh
          bash tests/integration/test_partitions.sh
          bash tests/integration/test_run_refresh.sh

      - name: Run benchmark examples as integration smoke tests
        run: |
          # benchmarks/*/barca/run.sh hardcode $REPO_ROOT/.venv/bin/barca, matching
          # the local dev convention (`maturin develop` installs there) — link it to the
          # wheel-installed barca instead of building a second copy.
          mkdir -p .venv/bin
          ln -sf "$(command -v barca)" .venv/bin/barca
          bash tests/integration/test_benchmark_examples.sh

  perf:
    # The performance budgets of specs/behavior/performance.md ("Gates"): the trivial
    # pipeline's wall time, coordinator CPU and memory, and the incremental_dag native budgets,
    # against the wheel `build` makes. Under a minute. Tier merge and up.
    needs: [build]
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/v') || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python, uv and the wheel
        uses: ./.depot/actions/setup-wheel

      - name: Performance budgets
        timeout-minutes: 5
        run: python3 scripts/perf-gate.py

  test:
    # The required `CI / test` check. It always runs, so a failed, cancelled or (in a full run)
    # skipped job fails it instead of leaving the check missing.
    needs: [changes, checks, clippy, rust-tests, build, integration, perf]
    if: always()
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: python3 -c "$CHECK_NEEDS"

  # ---- CI / backends ---------------------------------------------------------------------
  #
  #   changes ──┐
  #   build ────┴─ python (matrix: PYTHON_SHARDS shards of python/tests [+ duckdb 1.x])
  #         ├───── proxy (nginx/Traefik and server-mode shell tests)
  #         └───── ui (typecheck, lint, unit tests, then the Playwright e2e suites)
  #
  # In the merge tier `python` is one job running scripts/fast-tests.txt. In the full tier it
  # is the shards, with the object-store emulators, the duckdb 1.x rerun and the real minute
  # checkpoint test all on (`scripts/ci-changes.py --all`). Without the emulators the backend
  # conformance tests skip (python/tests/emulators.py); without the checkpoint part,
  # BARCA_TEST_MINUTE_CHECKPOINT=0 skips python/tests/test_minute_checkpoints.py.
  changes:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.decide.outputs.tier }}
      emulators: ${{ steps.decide.outputs.emulators }}
      duckdb1: ${{ steps.decide.outputs.duckdb1 }}
      checkpoint: ${{ steps.decide.outputs.checkpoint }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide which optional parts run
        id: decide
        env:
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        # The tier and the reasons go to the check's summary as well as the log.
        run: |
          TIER=$(python3 scripts/ci-tier.py)
          python3 scripts/test-ci-tier.py
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          if [ "$TIER" = full ]; then
            python3 scripts/ci-changes.py --all >> "$GITHUB_OUTPUT" 2> why.txt
          else
            printf 'emulators=false\nduckdb1=false\ncheckpoint=false\n' >> "$GITHUB_OUTPUT"
            echo "tier $TIER: the optional parts run in the full tier (a release)" > why.txt
          fi
          cat why.txt "$GITHUB_OUTPUT"
          { echo '```'; cat why.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Every test file is in exactly one shard, and the fast subset exists
        run: |
          python3 scripts/ci-shards.py --shards "$PYTHON_SHARDS" --check
          while read -r f; do test -f "python/tests/$f" || { echo "scripts/fast-tests.txt: no python/tests/$f"; exit 1; }; done \
            < <(grep -v '^#' scripts/fast-tests.txt | grep .)

      - name: Shard matrix
        id: matrix
        env:
          TIER: ${{ steps.decide.outputs.tier }}
          DUCKDB1: ${{ steps.decide.outputs.duckdb1 }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          n = int(os.environ["PYTHON_SHARDS"])
          if os.environ["TIER"] == "full":
              include = [{"name": f"{i}/{n}", "shard": i, "duckdb": "2"} for i in range(1, n + 1)]
              if os.environ["DUCKDB1"] == "true":
                  include.append({"name": "duckdb 1.x", "shard": 0, "duckdb": "1"})
          else:
              include = [{"name": "fast", "shard": "fast", "duckdb": "2"}]
          print("matrix=" + json.dumps({"include": include}))
          PY
          cat "$GITHUB_OUTPUT"

  ui:
    needs: [changes, build]
    # The web UI's own checks, then the Playwright suites (ui/e2e, ui/e2e-auth) against the
    # wheel `build` makes. The build job builds `ui/dist` (or restores it) on its own.
    # Tier full only.
    if: ${{ needs.changes.outputs.tier == 'full' }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Check the web UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui typecheck
          pnpm --dir ui lint
          pnpm --dir ui test

      - name: Install Python, uv and the wheel
        uses: ./.depot/actions/setup-wheel

      - name: Install Playwright's Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium

      # Each config starts `barca serve` on its fixture and the Vite dev server in front of it:
      # the flat project (ui/e2e), the project declared in groups (ui/e2e-groups) and token
      # mode (ui/e2e-auth). Gating: a failing spec fails the job (#807).
      - name: Playwright end-to-end tests
        timeout-minutes: 20
        run: BARCA_BIN="$(command -v barca)" pnpm --dir ui test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            ui/test-results
            ui/test-results-groups
            ui/test-results-auth
          if-no-files-found: ignore

  build:
    # Builds the wheel once, for both checks: the integration tests, the Python shards and
    # the proxy tests. It does not wait for `changes`. The wheel is built with the `fast`
    # profile (no whole-program LTO); release wheels (release workflow) keep `--release`.
    # Tier merge and up.
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/v') || contains(github.event.pull_request.labels.*.name, 'ci-full'))) }}
    runs-on: depot-ubuntu-24.04-16
    # See clippy (#637).
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: target
      # Incremental: rustc reuses the unchanged parts of barca's own crates from the restored
      # target dir (checkout makes every file look modified, but rustc compares content).
      CARGO_INCREMENTAL: 1
    steps:
      - uses: actions/checkout@v4

      # The binary embeds ui/dist (rust-embed), so it must exist before Cargo runs. It depends
      # only on ui/, so it is cached on a hash of that directory.
      - name: Restore the web UI build
        id: ui-dist
        uses: actions/cache@v4
        with:
          path: ui/dist
          key: ui-dist-v1-${{ hashFiles('ui/**') }}

      - if: steps.ui-dist.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - if: steps.ui-dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the web UI
        if: steps.ui-dist.outputs.cache-hit != 'true'
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the build directory
        id: rust-cache
        uses: ./.depot/actions/rust-cache-restore
        with:
          name: wheel
          toolchain: ${{ steps.toolchain.outputs.cachekey }}
      - name: Build the barca wheel
        run: |
          mkdir -p dist-wheel
          uvx maturin build --profile fast --out dist-wheel

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: barca-wheel
          path: dist-wheel/*.whl
          retention-days: 3
          if-no-files-found: error

      # Saved from a PR's own runs, and from a merge group as main's next entry. Incremental
      # session dirs not used for 2 days are pruned first, which bounds the entry's size.
      - name: Save the build directory
        if: success()
        uses: ./.depot/actions/rust-cache-save
        with:
          key: ${{ steps.rust-cache.outputs.key }}

  proxy:
    # The shell tests that need the UI-embedded binary, beside the Python shards.
    # Tier full only.
    needs: [build, changes]
    if: ${{ needs.changes.outputs.tier == 'full' }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Python, uv and the wheel
        uses: ./.depot/actions/setup-wheel

      - name: barca serve behind nginx (prefix, embedded UI, live events)
        run: bash tests/integration/test_reverse_proxy.sh

      - name: --server through nginx with a path prefix
        run: bash tests/integration/test_server_mode.sh

  python:
    # Merge tier: one job, the quick subset in scripts/fast-tests.txt. Full tier: the suite
    # split by file into shards balanced by recorded duration (scripts/ci-shards.py), plus
    # the duckdb 1.x rerun.
    name: python (${{ matrix.name }})
    needs: [changes, build]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # Timestamps of the shard's phases, for the summary the test step writes.
      - name: Mark the start
        run: echo "start $(date +%s.%N)" > /tmp/phases

      - uses: actions/checkout@v4

      # The full suite includes the state-backend conformance tests, which run against local
      # object-store emulators (no cloud credentials). MinIO covers the S3 API — and so
      # Cloudflare R2's code path — fake-gcs-server covers GCS generation-match, Azurite covers
      # Azure ETag If-Match. Started first so the pulls overlap with the install below.
      # Setting the variables declares the emulators provided: an unreachable one then fails
      # its tests instead of skipping them.
      - name: Start object-store emulators
        if: needs.changes.outputs.emulators == 'true'
        env:
          BARCA_TEST_S3_ENDPOINT: http://localhost:9100
          BARCA_TEST_GCS_ENDPOINT: http://localhost:9200
          BARCA_TEST_AZURITE_HOST: 127.0.0.1:9210
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.5.24
          # Emulators are pinned: an unpinned :latest can change behavior with no
          # commit here. Bump deliberately.
          docker run -d --name fake-gcs -p 9200:4443 \
            fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443 \
            -public-host localhost:9200 -external-url http://localhost:9200
          docker run -d --name azurite -p 9210:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          {
            echo "BARCA_TEST_S3_ENDPOINT=$BARCA_TEST_S3_ENDPOINT"
            echo "BARCA_TEST_GCS_ENDPOINT=$BARCA_TEST_GCS_ENDPOINT"
            echo "BARCA_TEST_AZURITE_HOST=$BARCA_TEST_AZURITE_HOST"
          } >> "$GITHUB_ENV"

      - name: Install Python and uv, download the wheel
        uses: ./.depot/actions/setup-wheel
        with:
          uv-cache: true
          install: false

      - name: Mark the wheel downloaded
        run: echo "wheel $(date +%s.%N)" >> /tmp/phases

      - name: Select test files
        env:
          SHARD: ${{ matrix.shard }}
          EMULATORS: ${{ needs.changes.outputs.emulators }}
          CHECKPOINT: ${{ needs.changes.outputs.checkpoint }}
        run: |
          if [ "$SHARD" = fast ]; then
            # The merge tier: the quick subset scripts/check-fast.sh runs locally too.
            grep -v '^#' scripts/fast-tests.txt | grep . | sed 's#^#python/tests/#' > test-files.txt
          elif [ "$SHARD" = 0 ]; then
            # barca supports duckdb>=1.4,<3 (#567): every test file that mentions DuckDB runs
            # again on the newest 1.x.
            grep -li duckdb python/tests/test_*.py > test-files.txt
          else
            # The split balances on durations with or without the emulators, whichever this run
            # has, and weighs the minute checkpoint test only when it runs.
            map=(); [ "$EMULATORS" = true ] && map=(--emulators)
            [ "$CHECKPOINT" = true ] && map+=(--checkpoint)
            python3 scripts/ci-shards.py --shards "$PYTHON_SHARDS" --shard "$SHARD" "${map[@]}" \
              > test-files.txt
          fi
          # Off, the real minute checkpoint test skips (python/tests/test_minute_checkpoints.py).
          [ "$CHECKPOINT" = true ] || echo "BARCA_TEST_MINUTE_CHECKPOINT=0" >> "$GITHUB_ENV"
          echo "$(wc -l < test-files.txt) test files"; cat test-files.txt

      - name: Install barca and test extras
        env:
          DUCKDB: ${{ matrix.duckdb }}
        run: |
          WHEEL=$(ls dist-wheel/*.whl)
          # The test extra resolves to the newest duckdb, 2.x.
          extra=(); [ "$DUCKDB" = 1 ] && extra=('duckdb>=1.4,<2')
          # A stalled download is retried rather than waited out (one took 193s).
          timeout 60 uv pip install --system "${WHEEL}[test]" "${extra[@]}" \
            || timeout 120 uv pip install --system "${WHEEL}[test]" "${extra[@]}"
          python -c "import duckdb, sys; v = duckdb.__version__; print('duckdb', v); assert v.startswith(sys.argv[1] + '.'), v" "$DUCKDB"
          if grep -q test_telemetry_datadog.py test-files.txt; then
            # Datadog's APM test agent checks barca's trace payloads; its own venv keeps its
            # dependencies (an older protobuf) out of the test environment.
            uv venv -q /tmp/dd-test-agent
            uv pip install -q --python /tmp/dd-test-agent ddapm-test-agent
            echo "BARCA_DD_TEST_AGENT=/tmp/dd-test-agent/bin/ddapm-test-agent" >> "$GITHUB_ENV"
          fi
          echo "deps $(date +%s.%N)" >> /tmp/phases

      - name: Wait for emulators
        if: needs.changes.outputs.emulators == 'true'
        # Each loop ends at the first answer; by now the containers have usually started.
        run: |
          for i in $(seq 1 120); do curl -sf http://localhost:9100/minio/health/live && break; sleep 0.5; done
          for i in $(seq 1 120); do curl -sf http://localhost:9200/storage/v1/b >/dev/null && break; sleep 0.5; done
          for i in $(seq 1 120); do curl -s http://localhost:9210/devstoreaccount1 >/dev/null && break; sleep 0.5; done

      - name: Run the shard's Python tests
        timeout-minutes: 30
        # One pytest worker per CPU. Failures and each file's duration go to the check's
        # summary, readable without the Depot log (`scripts/ci-shards.py --update-durations`
        # takes the JUnit report the same way).
        run: |
          mapfile -t files < test-files.txt
          set -o pipefail
          echo "$(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pytest $(date +%s.%N)" >> /tmp/phases
          status=0
          # Its own session: a test that signals its process group cannot reach the runner.
          setsid --wait pytest "${files[@]}" -q -n "$(nproc)" --dist loadscope --durations=30 \
            -rfE --junitxml=junit.xml 2>&1 | tee pytest.log || status=$?
          echo "end $(date +%s.%N)" >> /tmp/phases
          awk 'NR > 1 { printf "%s→%s %.0fs, ", prev, $1, $2 - t } { prev = $1; t = $2 }
               END { print "" }' /tmp/phases | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            grep -E '^(FAILED|ERROR) ' pytest.log | head -50 || true
            tail -n 5 pytest.log
            echo '```'
            echo '<details><summary>Seconds per file</summary>'
            echo
            echo '```json'
            python3 -c "
          import json, xml.etree.ElementTree as ET
          t = {}
          for c in ET.parse('junit.xml').getroot().iter('testcase'):
              m = next((p for p in c.get('classname', '').split('.') if p.startswith('test_')), None)
              if m:
                  f = f'python/tests/{m}.py'
                  t[f] = round(t.get(f, 0) + float(c.get('time') or 0), 1)
          print(json.dumps(dict(sorted(t.items())), separators=(',', ':')))
          " || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The full tier's shards keep their JUnit reports for the `durations` job below.
      - name: Upload the JUnit report
        if: always() && matrix.duckdb == '2' && matrix.shard != 'fast'
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: junit.xml
          retention-days: 3
          if-no-files-found: ignore

  durations:
    # Refreshes scripts/ci-test-durations.json (the per-file durations the shard split balances
    # on, scripts/ci-shards.py) from this run's JUnit reports and uploads the result as the
    # `ci-test-durations` artifact; scripts/release.sh downloads the newest one and commits
    # it with the version bump, so the file follows the suite without anyone measuring by
    # hand. The full tier runs with the emulators, so it refreshes the `with_emulators` map.
    # Not gating: a shard's failure still leaves a usable report, and nothing here can fail
    # a release.
    needs: [changes, python]
    if: ${{ !cancelled() && needs.changes.outputs.tier == 'full' }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit

      - name: Merge the shards' durations
        run: |
          for report in junit/junit-*/junit.xml; do
            python3 scripts/ci-shards.py --update-durations "$report" --emulators
          done
          python3 scripts/ci-shards.py --shards "$PYTHON_SHARDS" --check
          { echo '```'; git diff --stat -- scripts/ci-test-durations.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-durations
          path: scripts/ci-test-durations.json
          retention-days: 90
          if-no-files-found: error

  backends:
    # The required `CI / backends` check. It always runs, so a failed, cancelled or (in a full
    # run) skipped job fails it instead of leaving the check missing.
    needs: [changes, ui, build, proxy, python]
    if: always()
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every backends job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: python3 -c "$CHECK_NEEDS"
