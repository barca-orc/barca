name: CI

on:
  pull_request:
    branches: [main]

# One run per PR at a time; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: depot-ubuntu-latest
    env:
      # Cargo must build on local disk: builds on the shared cache volume
      # produced corrupt .rlib/.rmeta files, even with a target dir per PR.
      # rust-cache restores an archive here before the build and saves afterward.
      CARGO_TARGET_DIR: target
      PIP_CACHE_DIR: /mnt/cache/test/pip
    steps:
      - uses: actions/checkout@v4

      - name: Mount cache disk
        uses: depot/cache-mount@v1
        with:
          name: barca-ci-cache
          path: /mnt/cache

      - name: Prepare cache dirs
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$PIP_CACHE_DIR" 2>/dev/null \
            || { sudo mkdir -p "$CARGO_TARGET_DIR" "$PIP_CACHE_DIR" && sudo chown "$(id -u):$(id -g)" "$PIP_CACHE_DIR"; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate archives for clippy/test builds and wheel-only builds.
          key: ci-local-v1-test
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install maturin and build
        run: |
          pip install maturin
          # Wheel goes to a per-run dir, not $CARGO_TARGET_DIR/wheels on the
          # shared cache disk, where overlapping runs could delete or install
          # each other's wheel.
          WHEELS=$(mktemp -d)
          maturin build --release --out "$WHEELS"
          pip install "$WHEELS"/*.whl

      - name: Run integration tests
        run: |
          bash tests/integration/test_cli.sh
          bash tests/integration/test_cache.sh
          bash tests/integration/test_cache_gaps.sh
          bash tests/integration/test_cache_fuzz.sh
          bash tests/integration/test_env.sh
          bash tests/integration/test_remote_state.sh
          bash tests/integration/test_partitions.sh
          bash tests/integration/test_run_refresh.sh

      - name: Run benchmark examples as integration smoke tests
        run: |
          # benchmarks/*/barca/run.sh hardcode $REPO_ROOT/.venv/bin/barca, matching
          # the local dev convention (`maturin develop --release` installs there) —
          # link it to the wheel-installed barca from the build step above instead
          # of building a second copy.
          mkdir -p .venv/bin
          ln -sf "$(command -v barca)" .venv/bin/barca
          pip install scikit-learn  # only benchmarks/spaceflights needs this
          pip install pandas pyarrow  # only benchmarks/etl_duckdb_dataframes needs this
          bash tests/integration/test_benchmark_examples.sh

  backends:
    # Full Python suite, including the state-backend conformance suite that runs
    # against local object-store emulators (no cloud credentials). MinIO covers
    # the S3 API — and therefore Cloudflare R2's code path — fake-gcs-server
    # covers GCS generation-match, Azurite covers Azure ETag If-Match.
    runs-on: depot-ubuntu-latest
    env:
      CARGO_TARGET_DIR: target
      PIP_CACHE_DIR: /mnt/cache/backends/pip
    steps:
      - uses: actions/checkout@v4

      # Start the emulators first: `docker run -d` returns after pulling, and the
      # pulls then overlap with the (much longer) Rust build below instead of
      # waiting behind it.
      - name: Start object-store emulators
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.5.24
          # Emulators are pinned: an unpinned :latest can change behavior with no
          # commit here. Bump deliberately.
          docker run -d --name fake-gcs -p 9200:4443 \
            fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443 \
            -public-host localhost:9200 -external-url http://localhost:9200
          docker run -d --name azurite -p 9210:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

      - name: Mount cache disk
        uses: depot/cache-mount@v1
        with:
          name: barca-ci-cache
          path: /mnt/cache

      - name: Prepare cache dirs
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$PIP_CACHE_DIR" 2>/dev/null \
            || { sudo mkdir -p "$CARGO_TARGET_DIR" "$PIP_CACHE_DIR" && sudo chown "$(id -u):$(id -g)" "$PIP_CACHE_DIR"; }

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate archives for clippy/test builds and wheel-only builds.
          key: ci-local-v1-backends
          workspaces: ". -> target"
          cache-on-failure: true

      # Build the UI before Cargo so the binary embeds it for the proxy test.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check and build the web UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui typecheck
          pnpm --dir ui lint
          pnpm --dir ui test
          pnpm --dir ui build

      - name: Build barca and install test extras
        run: |
          pip install maturin
          # Per-run wheel dir: see the test job.
          WHEELS=$(mktemp -d)
          maturin build --release --out "$WHEELS"
          WHEEL=$(ls "$WHEELS"/*.whl)
          pip install "${WHEEL}[test]"

      - name: Wait for emulators
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:9100/minio/health/live && break; sleep 1; done
          for i in $(seq 1 60); do curl -sf http://localhost:9200/storage/v1/b >/dev/null && break; sleep 1; done
          for i in $(seq 1 60); do curl -s http://localhost:9210/devstoreaccount1 >/dev/null && break; sleep 1; done

      - name: Run full Python suite (incl. backend conformance and transfer fault tests)
        env:
          BARCA_TEST_S3_ENDPOINT: http://localhost:9100
          BARCA_TEST_GCS_ENDPOINT: http://localhost:9200
          BARCA_TEST_AZURITE_HOST: 127.0.0.1:9210
        # Bound concurrency: these tests launch workers and local store clients.
        run: pytest python/tests -q -n 4 --dist loadscope --durations=30

      - name: barca serve behind nginx (prefix, embedded UI, live events)
        run: bash tests/integration/test_reverse_proxy.sh
