[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
ruff_python_parser = "=0.0.4"
ruff_python_ast = "=0.0.4"
ruff_text_size = "=0.0.4"
petgraph = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
# No "suggestions" feature: a mistyped flag or subcommand gets barca's own "Did you mean" (one
# rule for every name, `barca_core::suggest`; see `barca docs agents`), not clap's tips.
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive"] }
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
dashmap = "6"
notify = "8"
tower = { version = "0.5", features = ["util"] }
toml = "0.8"
# Outgoing HTTPS (Slack webhooks; the `--server` client). rustls with the ring provider, never
# native-tls; no default features, so no HTTP/2, proxy discovery, cookies or decompression.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
# Jobs run in worker processes; compact coordinator code keeps resident instruction
# pages small without changing its data structures or limiting worker parallelism.
opt-level = "s"
strip = true
lto = true
codegen-units = 1
