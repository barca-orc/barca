[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
ruff_python_parser = "=0.0.4"
ruff_python_ast = "=0.0.4"
ruff_text_size = "=0.0.4"
petgraph = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# No "suggestions" feature: clap's "a similar argument exists" tips can read as confirmation to
# an agent, and barca never offers fuzzy suggestions (see `barca docs agents`).
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive"] }
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
dashmap = "6"
notify = "8"
tower = { version = "0.5", features = ["util"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
