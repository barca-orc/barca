          type: string
      - name: value
        in: query
        required: false
        description: Only keys whose dimension is one of the values (region=apac,emea). Repeat for another dimension.
        schema:
          type: string
      - name: range
        in: query
        required: false
        description: Only keys whose dimension is between two of its values, in the dimension's order, both
          included (day=2026-01-01..2026-01-31).
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Only the failed keys of one error group, an index into errors.
        schema:
          type: integer
          minimum: 0
      - name: q
        in: query
        required: false
        description: Only keys that contain this text, in any case.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: The order. key (default), state (most urgent first), attempted (latest first), elapsed
          (slowest first), size (largest first), rows (most first).
        schema:
          type: string
          enum: [key, state, attempted, elapsed, size, rows]
      - name: limit
        in: query
        required: false
        description: Keys to return. Default 100, at most 1000.
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        required: false
        description: Matching keys to skip.
        schema:
          type: integer
          minimum: 0
