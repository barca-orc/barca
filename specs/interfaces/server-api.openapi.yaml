  /sql/query:
    post:
      summary: One SELECT over barca's own tables, run by the server
      operationId: post_sql_query
      description: 'Experimental (specs/behavior/health.md, "Server query route"). The query is one
        SELECT (DuckDB dialect) over barca.runs, barca.materializations, barca.nodes, barca.schedules,
        barca.ticks and barca.queue; the answer
        is the document barca sql --json prints. A read: a read-only server serves it, and token
        mode requires a token as on every route. The server never runs SQL over results or files:
        the query runs in one long-lived helper process whose in-memory DuckDB holds those tables
        only, with external access disabled (no file, network or extension access) and its
        configuration locked, in a read-only transaction, under a memory limit, in an empty
        directory outside the project and without the server''s credentials; rows are handed to
        it by the server when the metadata database or the graph changed. An answer holds at most
        4MB of rows; four queries are admitted at once. The tables carry the error text of failed
        steps and artifact paths, as the other read routes do. A query has 5 seconds,
        waiting for the helper and loading tables included. barca sql with a server sends a query
        that names only barca''s tables here.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The rows, as barca sql --json prints them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlAnswer'
        '400':
          description: 'Not one SELECT over barca''s tables: a result view or any other relation, a
            file or URL, another statement type, more than one statement, a write inside a SELECT,
            a SQL error, rows of more than 4MB, a query needing more memory than DuckDB is given
            (1GB; the helper stays), or a body that is not the request. Usage envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: The query did not finish within 5 seconds and was cancelled. Usage envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Four queries are admitted already (one running, three waiting); this one was
            not started. Infra envelope.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before sending the query again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Metadata DB or status error while loading a table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The server's Python environment has no DuckDB, or the query helper stopped
            under the query (the next query starts another). Infra envelope; no other route is
            affected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
