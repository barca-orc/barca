        runs, total and activity are of the runs they keep. With status=running alone, only the runs
        in flight (pending or running), this server's and the CLI runs on the same metadata database
        whose owner is alive, each with active_steps and now. activity is the runs started in the
        last 24 hours that the filters keep (whatever since and until say), counted by hour over
        every recorded run of the window, not over the runs listed.
      parameters: &id024
      - name: limit
        in: query
        required: false
        schema:
          type: integer
