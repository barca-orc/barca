# Normative shipped HTTP boundary; update this document and conformance in the same PR.
openapi: 3.1.0
info:
  title: Barca current HTTP API
  version: '38'
  description: 'Normative current wire contract; specification version 35 is independent of package versions.
    Scope: registered barca-server routes and fallback responses. Authentication defaults off. Opt-in token mode requires a bearer token for every API method,
    including health, HEAD, ETag and SSE; read-only is an independent operating mode.
    Only exact UI static routes and GET /auth/status are public reads. POST /auth/bootstrap
    consumes its own one-use local credential. No cookies or CORS credentials are accepted. The run contract and inspection routes of RFC-0007 section
    3.4 are shipped (POST /runs, GET /runs/{run_id}, its events, output, logs and cancel; /list, /nodes, /history,
    /stats/{name}, /project), the barca sql reads (GET /sql/views, GET /materializations) and its query route over barca''s own tables (POST /sql/query; the server never runs SQL over results or files), and so are its ledger routes (POST /ledger/lookup, POST /ledger/runs), POST /state/reset and POST /gc (barca gc run by the server), and the durable run queue (GET /queue, POST /queue/pause, POST /queue/resume: every accepted run is recorded before it is answered and resumed in order after a restart). GET /state, GET /assets/{name} and GET /runs?status=running report the runs working on each node now. Every error body is the CLI error
    envelope. Every GET of an inspection route answers with an ETag (a digest of its body) and Cache-Control: no-cache; a request whose If-None-Match names it gets 304 Not Modified and no body. Routes marked deprecated are aliases retained for Python Client compatibility, with no scheduled removal; a removal migrates Client first and lands in a minor release. Conformance: crates/barca-server/tests/openapi.rs
    and python/tests/test_http_openapi_client.py. The same routes are served on the project socket
    (x-project-socket).'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://127.0.0.1:8274
  description: Default local listener; configurable host/port, reverse proxies may add a prefix.
security:
- {}
- projectToken: []
x-host-validation: 'On loopback TCP binds every route first validates Host (or HTTP/2 URI authority): localhost, loopback IP literals, and exact DNS names configured in [server] allowed_hosts are accepted. Ports are optional; foreign or malformed hosts receive HTTP 403 with the Error schema. Duplicate Host headers are refused. Host-less HTTP/1.0 and owner-only project socket requests are exempt. Non-loopback binds retain their exposure warning. Conformance: python/tests/test_host_validation.py and crates/barca-server/src/host_guard.rs.'
x-authentication: Bearer authentication is mandatory when [server] auth is token; off preserves unauthenticated and proxy deployments.
x-project-socket: 'A server that holds its environment (serve.lock) also listens on a Unix socket beside
  its metadata database: .barca/serve.sock, or .barca/envs/<env>/serve.sock for a named environment
  (specs/interfaces/dot-barca-layout.md). It serves every route of this document there, unchanged. The
  socket file is owner-only (mode 0600) and that permission is its access rule: a request over it needs
  no bearer token in token mode, 401 is never answered on it, and what records an actor names
  project-socket (specs/behavior/server-authentication.md). A read-only server answers on it as on its
  TCP address: reads, and 403 for every mutation. The socket is removed when the server exits; one a
  killed server left refuses connections. barca commands run in the project use it (barca docs
  server-mode). Conformance: crates/barca-server/src/project_socket.rs, python/tests/test_project_socket.py.'
paths:
  /cached:
    post:
      summary: Read latest completed results without executing or enqueueing work
      operationId: cachedGet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CachedRequest'}
      responses:
        '200':
          description: Every selected key was found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CachedAnswer'}
        '404':
          description: At least one selected key missed; all outcomes and typed cache_miss error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CachedAnswer'}
        '400':
          description: Invalid target, partition or incompatible options
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Metadata, authorization to storage, corruption or other read failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /auth/status:
    get:
      summary: Public authentication mode
      operationId: get_auth_status
      security: []
      responses:
        '200':
          description: Mode only; no project data
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mode]
                properties:
                  mode: {type: string, enum: [off, token]}
    head:
      summary: Authentication metadata headers (requires a token in token mode)
      operationId: head_auth_status
      responses:
        '200': {description: Headers only}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthOff'}
        '500': {$ref: '#/components/responses/AuthUnavailable'}
  /auth/bootstrap:
    post:
      summary: Exchange a one-use local bootstrap code for a 12-hour connection token
      operationId: post_auth_bootstrap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: Bootstrap consumed; credential shown once; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedToken'}
        '400': {$ref: '#/components/responses/AuthBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthOff'}
        '500': {$ref: '#/components/responses/AuthUnavailable'}
  /auth/tokens:
    get:
      summary: List active token metadata, including the bootstrap connection
      operationId: get_auth_tokens
      responses:
        '200':
          description: Public metadata only; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    maxItems: 1001
                    items: {$ref: '#/components/schemas/TokenMetadata'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthOff'}
        '500': {$ref: '#/components/responses/AuthUnavailable'}
    post:
      summary: Create a full-capability named API token; permitted with read-only ledger mode
      operationId: post_auth_tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, description: At most 128 UTF-8 bytes; no control characters}
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: Future expiry; omitted or null means non-expiring
      responses:
        '201':
          description: Secret shown once; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedToken'}
        '400': {$ref: '#/components/responses/AuthBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthOff'}
        '409':
          description: 1000 ordinary tokens; revoke an unused token to make space
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/AuthUnavailable'}
    head:
      summary: Authentication metadata headers (requires a token in token mode)
      operationId: head_auth_tokens
      responses:
        '200': {description: Headers only}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthOff'}
        '500': {$ref: '#/components/responses/AuthUnavailable'}
  /auth/tokens/{id}:
    delete:
      summary: Idempotently revoke a token; close its event streams
      operationId: delete_auth_token
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: Revoked or already absent; Cache-Control no-store}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthOff'}
        '500': {$ref: '#/components/responses/AuthUnavailable'}
  /health:
    get:
      summary: Server liveness and operating modes
      operationId: get_health
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: &id_etag
            ETag:
              description: A digest of the body. Send it back as If-None-Match to get 304 Not Modified, and no body, while the body is unchanged.
              schema:
                type: string
                pattern: ^"[0-9a-f]{24}"$
            Cache-Control:
              description: A client may keep the body, and asks again each time (with If-None-Match).
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id001
            Allow:
              schema: &id003
                type: string
              description: Methods accepted by this route
      description: Liveness; requires a bearer credential when token authentication is enabled.
        status is draining from the first SIGTERM or SIGINT until the server exits; the
        response stays 200. started_at changes when the server restarts (a client following a run
        tells a restart by it); queue counts the runs waiting and running. Read-only mode refuses mutating routes; it does not restrict inspection access.
        load_errors reports unloaded sources and excluded dependent definitions from
        the selected served graph. Healthy loads return an empty array; healthy
        definitions remain inspectable beside those diagnostics. scheduler_enabled is
        false while disabled or stopped on a metadata error. A successful restart restores it. metadata_error says why
        the metadata DB cannot be used, while it cannot.
    head:
      summary: Server liveness and operating modes (headers only)
      operationId: head_health
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id001
  /project:
    get:
      summary: The deployed tree
      operationId: get_project
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id002
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: &id005
                type: string
      description: The deployed files and their sha256, hashed on each request, the environment and the
        commit at the root.
    head:
      summary: The deployed tree (headers only)
      operationId: head_project
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id002
        '400':
          description: Invalid request
  /plan:
    get:
      summary: Static plan of the served DAG
      operationId: get_plan
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id004
            Allow:
              schema: *id003
              description: Methods accepted by this route
    head:
      summary: Static plan of the served DAG (headers only)
      operationId: head_plan
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id004
  /groups:
    get:
      summary: List organizational groups
      description: Groups organize nodes without changing execution, dependencies or caching. Groups reference
        member node or group IDs and an output node or group ID. Invalid groups are omitted from the healthy
        served graph and reported in health load_errors, while healthy executable nodes remain available.
      operationId: get_groups
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeGroup'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
    head:
      summary: List organizational groups (headers only)
      operationId: head_groups
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id001
  /list:
    get:
      summary: barca list --json --all
      operationId: get_list
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBody'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id006
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id005
      description: Built by the function barca list --json uses; the client applies --limit and --fields.
    head:
      summary: barca list --json --all (headers only)
      operationId: head_list
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id006
        '400':
          description: Invalid request
  /nodes:
    get:
      summary: barca status --json for the ledger
      operationId: get_nodes
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusBody'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '404':
          description: Unknown target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id007
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id005
      description: Built by the function barca status --json uses, reading the metadata DB in place
        beside the runs writing it, including under --read-only (SQLite can create -wal and -shm;
        a database requiring migration is copied on the blocking pool and migrated privately). When deciding the cache
        states takes longer than a second, a request after a change is answered after that second with
        the last result while the new one is computed; running is always current. A scheduled node's schedule is the running scheduler's view (GET /schedule), or with no
        scheduler what the metadata DB holds (live false). state and problems keep only the matching
        nodes, as barca status --state and --problems do; summary still counts every node, and filter
        names the filter. An unknown state is 400.
      parameters: &id008
      - name: targets
        in: query
        required: false
        schema: *id005
        description: 'Comma-separated targets; absent: every node.'
      - name: files
        in: query
        schema:
          type: string
        description: Comma-separated files whose classified nodes contribute to the scope.
      - name: sample
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: --sample N
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated cache states (--state): cached, unsynced, stale, never_run, partial,
          blocked, unknown, always_runs.'
      - name: problems
        in: query
        required: false
        schema:
          type: string
        description: '--problems: 1 or true keeps the nodes that need attention (every state but cached
          and always_runs, a task or sensor whose last run failed, a paused or failing schedule).'
    head:
      summary: barca status --json for the ledger (headers only)
      operationId: head_nodes
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '404':
          description: Unknown target
        '409':
          description: Ambiguous target
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id007
        '400':
          description: Invalid request
      parameters: *id008
  /history:
    get:
      summary: barca history --json
      operationId: get_history
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryBody'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id009
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id005
      description: Newest first. Without limit, every run, as barca history --json prints without -l.
        The filters combine with AND; total and truncated count the runs they keep, and limit applies
        after them. An unknown filter value is a 400. When status names running, each listed run
        in flight carries now, the nodes it is working on.
      parameters: &id010
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: all
        in: query
        required: false
        schema: *id005
        description: 'Any value but 0 or false: every run.'
      - name: status
        in: query
        required: false
        schema: *id005
        description: 'barca history --status: comma-separated, any of success, failed, cancelled, error,
          running, interrupted; not_successful is every one but success and running.'
      - name: target
        in: query
        required: false
        schema: *id005
        description: 'barca history --target: runs whose target or job names this node (a function name
          or node id).'
      - name: triggered_by
        in: query
        required: false
        schema: *id005
        description: 'barca history --triggered-by: comma-separated, any of manual, api, schedule, client.'
      - name: since
        in: query
        required: false
        schema: *id005
        description: 'barca history --since: started at or after a duration back from the server''s clock
          (30m, 24h, 7d, 2w), an RFC 3339 time or a UTC date.'
      - name: not_triggered_by
        in: query
        required: false
        schema: *id005
        description: 'barca history --not-triggered-by: comma-separated, any of manual, api, schedule,
          client, left out; a run that recorded no trigger is kept. Experimental.'
      - name: until
        in: query
        required: false
        schema: *id005
        description: 'barca history --until: started before a time, written as since is. Experimental.'
      - name: search
        in: query
        required: false
        schema: *id005
        description: 'barca history --search: runs whose run id, target or job contains this text,
          whatever its case. Experimental.'
    head:
      summary: barca history --json (headers only)
      operationId: head_history
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id009
        '400':
          description: Invalid request
      parameters: *id010
  /sql/views:
    get:
      summary: Which result each barca sql view reads in the ledger
      operationId: get_sql_views
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlCatalog'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
      description: barca sql with a server resolves its views here and runs the query on the client,
        over the store paths this returns. The server never runs SQL over results or files (DuckDB
        reads and writes files; POST /sql/query answers queries over barca's own tables only). Built by the function a local barca sql uses, against a private
        snapshot of the metadata DB, so view names, stale results and current partition keys follow the
        same rules.
      parameters:
      - name: files
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated deployed files (root-relative); absent: every deployed file.'
    head:
      summary: Which result each barca sql view reads in the ledger (headers only)
      operationId: head_sql_views
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '500':
          description: Inspection infrastructure error
        '405':
