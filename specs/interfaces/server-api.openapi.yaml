          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id039
            Allow:
              schema: *id003
              description: Methods accepted by this route
        '404':
          description: 'Missing index: plain text explanation; missing other asset: empty body'
          content:
            text/plain:
              schema: *id003
      description: 'No UI build in the binary: /ui/ returns explanatory text with 404. Missing static
        assets return empty 404. Fingerprinted assets use immutable one-year caching; other resources
        use no-cache.'
    head:
      summary: Embedded UI document or static asset (headers only)
      operationId: head_ui_index
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id039
        '404':
          description: UI not embedded or asset missing
  /ui/{path}:
    get:
      summary: Embedded UI document or static asset
      operationId: get_ui_path
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Embedded UI content
          headers:
            Cache-Control:
              schema: *id003
          content:
            text/html:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
            application/json:
              schema: {}
            font/woff2:
              schema:
                type: string
                format: binary
            font/woff:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id040
            Allow:
              schema: *id003
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id003
        '404':
          description: 'Missing index: plain text explanation; missing other asset: empty body'
          content:
            text/plain:
              schema: *id003
      description: 'No UI build in the binary: /ui/ returns explanatory text with 404. Missing static
        assets return empty 404. Fingerprinted assets use immutable one-year caching; other resources
        use no-cache.'
      parameters: &id041
      - name: path
        in: path
        required: true
        schema: *id003
    head:
      summary: Embedded UI document or static asset (headers only)
      operationId: head_ui_path
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id040
        '400':
          description: Invalid request
        '404':
          description: UI not embedded or asset missing
      parameters: *id041
components:
  securitySchemes:
    projectToken:
      type: http
      scheme: bearer
      description: Project-wide opaque token; opt-in, no accounts or roles
  responses:
    Unauthorized:
      description: Missing, invalid, revoked or expired token in token mode; code 3 infra envelope with authentication_required or invalid_token reason
      headers:
        WWW-Authenticate:
          schema: {type: string, const: Bearer}
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthBadRequest:
      description: Invalid JSON, token name or future expiry; sanitized usage envelope; Cache-Control no-store
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthOff:
      description: Token administration disabled in auth-off mode; Cache-Control no-store
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthUnavailable:
      description: Authentication state unavailable; fail closed; Cache-Control no-store
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    CachedRequest:
      type: object
      additionalProperties: false
      required: [tier]
      properties:
        targets: {type: array, items: {type: string}, default: []}
        files: {type: array, items: {type: string}, default: []}
        tier: {type: string, enum: [store, local]}
        partition: {type: [string, 'null']}
        values: {type: boolean, default: false}
        url_expires: {type: [integer, 'null'], minimum: 1, maximum: 604800}
    CachedOutcome:
      type: object
      additionalProperties: false
      required: [node, partition, status]
      properties:
        node: {type: string}
        partition: {type: [string, 'null']}
        status: {type: string, enum: [hit, miss]}
        reason: {type: string, enum: [never_run, evicted, not_fetched]}
        run_hash: {type: string}
        format: {type: string}
        size_bytes: {type: integer, minimum: 0}
        path: {type: string}
        url: {type: string}
        fresh: {type: boolean}
        source: {type: string, enum: [disk, store]}
    CachedAnswer:
      type: object
      additionalProperties: false
      required: [outcomes, final_output, path_scope]
      properties:
        outcomes: {type: array, items: {$ref: '#/components/schemas/CachedOutcome'}}
        final_output: {}
        path_scope: {type: string, enum: [local, server]}
        error: {$ref: '#/components/schemas/Error'}
    AssetPin:
      type: object
      additionalProperties: false
      required: [node_id, run_hash, pinned_at, pinned_by, reason, run_id, upload]
      properties:
        run_id:
          description: The run that computed the pinned version; null for an upload.
          type:
          - string
          - 'null'
        upload:
          description: Set when the pinned version was uploaded (an override).
          oneOf:
          - $ref: '#/components/schemas/AssetUpload'
          - type: 'null'
        node_id:
          type: string
        run_hash:
          type: string
        pinned_at:
          type: string
          description: RFC 3339 UTC
        pinned_by:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
    AssetVersion:
      type: object
      additionalProperties: false
      required: [run_hash, run_id, materialized_at, elapsed_seconds, size_bytes, format, artifact, available, current, pinned, upload]
      properties:
        run_hash:
          type: string
        run_id:
          type:
          - string
          - 'null'
        materialized_at:
          type: string
        elapsed_seconds:
          type:
          - number
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
        format:
          type:
          - string
          - 'null'
        artifact:
          type: string
        available:
          type: boolean
        current:
          type: boolean
        pinned:
          type: boolean
        upload:
          description: Set when an operator uploaded this materialization (an override).
          oneOf:
          - $ref: '#/components/schemas/AssetUpload'
          - type: 'null'
    AssetUpload:
      type: object
      additionalProperties: false
      required: [uploaded_at, uploaded_by, file_name, reason]
      properties:
        uploaded_at:
          type: string
        uploaded_by:
          type:
          - string
          - 'null'
        file_name:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
    AssetVersions:
      type: object
      additionalProperties: false
      required: [node_id, pinnable, pin, versions]
      properties:
        node_id:
          type: string
        pinnable:
          type: boolean
        pin:
          oneOf:
          - $ref: '#/components/schemas/AssetPin'
          - type: 'null'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AssetVersion'
    PinList:
      type: object
      additionalProperties: false
      required: [pins]
      properties:
        pins:
          type: array
          items:
            $ref: '#/components/schemas/AssetPin'
    PinRequest:
      type: object
      additionalProperties: false
      properties:
        run_hash:
          type: string
          description: A run hash, or a unique prefix of at least 6 characters
        previous:
          type: boolean
          description: Pin the newest version before the latest one
        reason:
          type:
          - string
          - 'null'
    PinResult:
      type: object
      additionalProperties: false
      required: [node_id, pin, version, replaced]
      properties:
        node_id:
          type: string
        pin:
          $ref: '#/components/schemas/AssetPin'
        version:
          $ref: '#/components/schemas/AssetVersion'
        replaced:
          oneOf:
          - $ref: '#/components/schemas/AssetPin'
          - type: 'null'
    UnpinResult:
      type: object
      additionalProperties: false
      required: [node_id, removed]
      properties:
        node_id:
          type: string
        removed:
          oneOf:
          - $ref: '#/components/schemas/AssetPin'
          - type: 'null'
    TokenMetadata:
      type: object
      required: [id, name, created_at, expires_at]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
    IssuedToken:
      allOf:
      - {$ref: '#/components/schemas/TokenMetadata'}
      - type: object
        required: [token]
        properties:
          token: {type: string, description: Secret returned once; never logged or stored verbatim}
    Error:
      type: object
      additionalProperties: false
      description: 'The CLI stderr error envelope (barca docs contract). HTTP status follows kind: usage
        400 (404 not found, 409 ambiguous or conflicting with a run, 403 read-only), infra 500.'
      required:
      - error
      - code
      - kind
      - remediation
      properties:
        error: *id005
        code:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 130
        kind:
          type: string
          enum:
          - step_failed
          - cache_miss
          - usage
          - infra
          - cancelled
        remediation: &id042
          anyOf:
          - type: string
          - type: 'null'
        node: *id042
        traceback: *id042
        artifact_dir: *id042
        phase:
          description: step_failed only. Where the step failed, as its worker reported it (barca docs
            contract, Error envelope); null when unknown (a worker that died).
          anyOf:
          - type: string
            enum:
            - load_inputs
            - user_code
            - split_output
            - write_output
            - sink
          - type: 'null'
        outcomes:
          type: array
          items: {$ref: '#/components/schemas/CachedOutcome'}
        reason:
          description: A stable name for an error a client may handle on its own, present
            only when barca has one. metadata_unusable means the metadata DB is there but this
            barca cannot use it (empty, not SQLite, a newer format or a malformed schema); the
            error names the file and the remediation says what to do.
          type: string
          enum:
          - metadata_unusable
          - cached_value_unsupported
          - authentication_required
          - invalid_token
          - invalid_event_cursor
          - event_cursor_mismatch
          - event_cursor_expired
    SchedulerLiveness:
      type: object
      additionalProperties: false
      required: [heartbeat_at_ms, last_due_slot, last_enqueue, operation, operation_started_at_ms, restart_count, last_exit_reason, reason]
      properties:
        heartbeat_at_ms: {type: [integer, 'null'], description: Unix milliseconds}
        last_due_slot: {type: [integer, 'null'], description: Unix seconds}
        last_enqueue: {type: [integer, 'null'], description: Unix seconds}
        operation: {type: [string, 'null']}
        operation_started_at_ms: {type: [integer, 'null'], description: Unix milliseconds}
        restart_count: {type: integer, minimum: 0}
        last_exit_reason: {type: [string, 'null']}
        reason: {type: [string, 'null']}
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - version
      - read_only
      - scheduler
      - load_errors
      - api_version
      - env
      - store_uri
      - scheduler_enabled
      - metadata_error
      - started_at
      - queue
      properties:
        scheduler_liveness:
          $ref: '#/components/schemas/SchedulerLiveness'
        capabilities:
          type: object
          required: [event_resume]
          properties:
            event_resume: {type: integer, const: 1}
        started_at:
          type: string
          description: When this server process started, RFC 3339 UTC with milliseconds.
        queue:
          $ref: '#/components/schemas/QueueHealth'
        status:
          description: ok, degraded when the local scheduler exited unexpectedly or its heartbeat is stale, or draining once the server was told to stop (SIGTERM or
            SIGINT); a draining server starts no queued run, queues new runs for the next
            start and finishes the runs in flight
          enum:
          - ok
          - degraded
          - draining
        version:
          type: string
        read_only: &id043
          type: boolean
        scheduler: *id043
        scheduler_enabled:
          type: boolean
          description: Whether the scheduler is running. scheduler (configured on, not
            --no-schedule or --read-only), and false while stopped on a metadata error. Returns to true after successful restart.
        metadata_error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the metadata DB cannot be used, while it cannot; null otherwise. A
            writer whose database cannot be set up at startup exits 3 instead of serving; a
            read-only server keeps serving and reports it here until a read succeeds again.
        graph_stale:
          description: Whether the selected graph differs from its configured sources on disk. Null while loading.
          anyOf:
          - type: boolean
          - type: 'null'
        load_errors:
          type: array
          items:
            $ref: '#/components/schemas/LoadError'
        api_version:
          const: 1
          description: Major version of this API; a client refuses another.
        env: *id005
        store_uri:
          anyOf:
          - *id005
          - type: 'null'
          description: The artifact store this server writes to; null when artifacts stay on its machine.
        cache:
          description: Null until the server has measured .barca/, and when [cache] max_size
            is off or the server is read-only.
          anyOf:
          - $ref: '#/components/schemas/CacheSize'
          - type: 'null'
    LoadError:
      type: object
      additionalProperties: false
      required:
      - file
      - error
      - affected_nodes
      properties:
        file: *id003
        error: *id003
        affected_nodes:
          type: array
          items: *id003
    QueueHealth:
      type: object
      additionalProperties: false
      required:
      - paused
      - queued
      - running
      - max_runs
      - capacity
      properties:
        paused:
          type: boolean
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        max_runs:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        capacity:
          description: The capacity every run shares (--capacity, [server] capacity); null without one. Experimental.
          anyOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - total
            - in_use
            - waiting
            properties:
              total:
                type: integer
                minimum: 1
              in_use:
                type: integer
                minimum: 0
              waiting:
                type: integer
                minimum: 0
                description: Steps waiting for capacity.
    RunAccepted:
      type: object
      additionalProperties: false
      required:
      - run_id
      - status
      - position
      - waiting_for
      properties:
        queue: &id_queue_place
          anyOf:
          - $ref: '#/components/schemas/QueuePlace'
          - type: 'null'
          description: last for a run asked to queue last (queue of POST /runs), while it waits or
            executes; null for every other run, and in GET /runs/{run_id} once the run has finished
            (it is not recorded with the run). Experimental.
        run_id:
          type: string
          description: The database run id, the one barca history shows.
        status:
          description: pending when it waits in the queue, running when it started at once.
          enum:
          - pending
          - running
        position:
          description: Its place among the queued runs (1 = next); null when it is running.
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        waiting_for: &id_waiting_for
          anyOf:
          - $ref: '#/components/schemas/WaitingFor'
          - type: 'null'
          description: What else a queued run waits for, beyond the runs ahead of it; null when nothing
            does. Experimental.
    QueuePlace:
      type: string
      enum:
      - next
      - last
      description: 'Where a requested run joins the run queue. next (the default): ahead of the
        scheduled runs that wait, behind the requests accepted before it. last: behind every run
        that waits, scheduled ones included; from then on the run is ordered with scheduled work,
        in the order accepted for a run slot (it takes no slot past max_runs), and as a scheduled
        run for the shared capacity its steps wait for (origin scheduled, the bound of
        scheduled_max_wait_seconds included). Experimental.'
    WaitingFor:
      type: string
      enum:
      - restart
      description: 'Why a queued run has not started beyond the runs ahead of it. restart: the server
        is draining before it stops (GET /health says draining) and starts no queued run; the run
        starts on the next server started on the same metadata DB, after the drain (at most [server]
        drain_timeout) and the restart. Experimental.'
    QueueEntry:
      type: object
      additionalProperties: false
      required:
      - control
      - run_id
      - status
      - position
      - command
      - target
      - triggered_by
      - schedule_id
      - queued_at
      - started_at
      - estimated_start_at
      - wait_seconds
      - waiting_for
      - target_line
      properties:
        control:
          $ref: '#/components/schemas/RunControl'
        queue: *id_queue_place
        target_line: {type: string}
        run_id:
          type: string
        status:
          enum:
          - pending
          - running
        position:
          description: Its place among the queued runs (1 = next); null for a running run.
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        command:
          enum:
          - get
          - run
        target:
          description: The targets as given, comma-separated; null for every asset and sensor.
          anyOf:
          - type: string
          - type: 'null'
        triggered_by:
          $ref: '#/components/schemas/TriggeredBy'
        schedule_id:
          anyOf:
          - type: string
          - type: 'null'
        queued_at:
          type: string
          description: When the server accepted it, RFC 3339 UTC.
        started_at:
          type: [string, 'null']
          format: date-time
          description: When it started executing (RFC 3339, UTC); null while it waits, and from a
            --read-only server (the recorded queue does not say). Experimental.
        estimated_start_at:
          type: [string, 'null']
          format: date-time
          description: For a waiting run, when it is expected to start (RFC 3339, UTC), an estimate
            rounded up to 5 seconds (specs/behavior/health.md, "Times"). Each of max_runs slots
            frees when its run ends (its start plus the typical run time of its schedule's ticks,
            never before now); a waiting run takes the slot that frees first, in queue order. null
            for a running run, while the queue is paused or draining, and from a --read-only
            server. Experimental.
        wait_seconds:
          type: [integer, 'null']
          minimum: 0
          description: How long it waits for a run slot, whole seconds, from queued_at to started_at
            for a running run and to estimated_start_at for a waiting one; null when neither is
            known. Experimental.
        waiting_for: *id_waiting_for
    PauseRequest:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: A node, named as a run target is, or a source file (pipeline.py)
        downstream:
          type: boolean
          description: Every node downstream of the target too
        all:
          type: boolean
          description: Resume only; every paused node
    Pauses:
      type: object
      additionalProperties: false
      required: [total, paused, schedules]
      properties:
        total:
          type: integer
          minimum: 0
        added:
          type: array
          items: {type: string}
          description: POST /pauses only; the ids it paused (including ones already paused)
        removed:
          type: array
          items: {type: string}
          description: POST /pauses/resume only; the ids it resumed
        covers:
          $ref: '#/components/schemas/PauseCover'
        paused:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, paused_at, via]
            properties:
              id: {type: string}
              paused_at:
                type: integer
                description: Unix seconds
              via:
                type: string
                description: The target the pause named (the node, the node a downstream pause started from, or a file)
        schedules:
          type: array
          description: Every paused schedule (POST /schedule/{id}/pause), by id; a timed pause
            whose until has passed is left out.
          items:
            type: object
            additionalProperties: false
            required: [id, paused_at, until]
            properties:
              id: {type: string}
              paused_at:
                type: integer
                description: Unix seconds
              until:
                type: [integer, 'null']
                description: Unix seconds at which the pause ends by itself; null until resumed
    PauseCover:
      type: object
      additionalProperties: false
      required: [targets, downstream, schedules]
      description: GET /pauses?target= only; what a pause of that target would cover, from the
        graph alone. The schedules are found by the scheduler's own walk, so one is listed
        exactly when a tick of it would plan a covered node. A node that is pinned or already
        paused stops that walk at run time and is not accounted for here. Experimental.
      properties:
        targets:
          type: array
          items: {type: string}
          description: The nodes the target names, in dependency order; one node, or every node
            of a file
        downstream:
          type: array
          items: {type: string}
          description: Every node below them, in dependency order; empty unless downstream was
            asked for
        schedules:
          type: array
          description: The schedules whose ticks reach a covered node, sorted by id
          items:
            type: object
            additionalProperties: false
            required: [id, relation]
            properties:
              id:
                type: string
                description: The scheduled node's id
              relation:
                type: string
                enum: [self, target, input, downstream]
                description: How its ticks touch what the pause names, the first that applies;
                  self (the schedule is of a named node), target (a named node is a target of its
                  ticks, which bring it up to date), input (its ticks read a named node),
                  downstream (its ticks reach only nodes below the named ones).
    Queue:
      type: object
      additionalProperties: false
      required:
      - paused
      - paused_at
      - draining
      - max_runs
      - running
      - queued
      - capacity
      - slots
      properties:
        slots: {type: string}
        paused:
          type: boolean
          description: Paused by an operator (POST /queue/pause); kept across restarts.
        paused_at:
          anyOf:
          - type: string
          - type: 'null'
          description: When it was paused, RFC 3339; null when it is not.
        draining:
          type: boolean
          description: The server is stopping; nothing starts until the next server resumes the queue.
        max_runs:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: How many runs execute at once (--max-runs, [server] max_runs, else one per core).
        running:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntry'
        queued:
          type: array
          description: Next first.
          items:
            $ref: '#/components/schemas/QueueEntry'
        capacity:
          description: The capacity every run shares (--capacity, [server] capacity); null without one.
            By default a requested run's waiting step is admitted before a scheduled run's, unless
            that one has waited scheduled_max_wait_seconds; admission = "first_come" admits them in
            the order they asked. A step is not overtaken by one ranked behind it. Experimental.
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/SharedCapacity'
    SharedCapacity:
      type: object
      additionalProperties: false
      required:
      - total
      - source
      - admission
      - scheduled_max_wait_seconds
      - in_use
      - runs
      - waiting
      properties:
        total:
          type: integer
          minimum: 1
        source:
          type: string
          description: --capacity or [server] capacity.
        admission:
          type: string
          enum:
          - requested_first
          - first_come
          description: '[server] admission: the order of the steps waiting.'
        scheduled_max_wait_seconds:
          description: Under requested_first, how long a scheduled run's step waits at most before
            it goes ahead of requested ones ([server] scheduled_max_wait_seconds); null under first_come.
          anyOf:
          - type: 'null'
          - type: integer
            minimum: 1
        in_use:
          type: integer
          minimum: 0
          description: The weight the running steps of every run take together.
        runs:
          type: array
          description: The weight each run holds.
          items:
            type: object
            additionalProperties: false
            required:
            - run_id
            - weight
            properties:
              run_id:
                type: string
              weight:
                type: integer
                minimum: 1
        waiting:
          type: array
          description: The steps waiting for capacity, in the order they are admitted.
          items:
            type: object
            additionalProperties: false
            required:
            - run_id
            - node
            - weight
            - waiting_seconds
            - origin
            properties:
              run_id:
                type: string
              node:
                type: string
              weight:
                type: integer
                minimum: 1
              waiting_seconds:
                type: number
                minimum: 0
              origin:
                type: string
                enum:
                - requested
                - scheduled
                description: scheduled for a run a schedule's tick started and for a run asked to
                  queue last (queue of POST /runs), requested for any other.
    RunHandle:
      type: object
      additionalProperties: false
      required:
      - run_id
      properties:
        run_id: *id003
      description: run_id is the database run id, the one barca history shows.
    Cancellation:
      type: object
      additionalProperties: false
      required:
      - run_id
      - status
      properties:
        run_id: *id003
        status:
          type: string
          enum: [cancelling, cancelled]
    RunStatus:
      type: string
      enum:
      - pending
      - running
      - complete
      - skipped
      - failed
      - cancelled
    NodeRoot:
      type: object
      additionalProperties: false
      description: The upstream fact that explains why a node is not fresh (specs/behavior/health.md,
        "Root"). Experimental.
      required: [id, kind, node]
      properties:
        id:
          type: string
          description: 'scheduler_off for the scheduler, otherwise <kind>:<node id>.'
        kind:
          type: string
          enum: [sensor_value, code, env, input, never_run, no_schedule, schedule_paused,
            scheduler_off, failure, queue, undecided]
          description: What the fact is; a change (sensor_value, code, env, input), the top of a
            never-run or undecided chain, why no tick comes (no_schedule, schedule_paused,
            scheduler_off), a failure, or a run queue that is behind.
        node:
          type: string
          description: The node the fact is about; the failing node, the sensor whose observation
            changed, the node whose code changed, the scheduled node, the topmost node no tick
            reaches.
    RollupCoverage:
      type: object
      additionalProperties: false
      description: How much of a scope's data was measured.
      required: [assets, measured, suspect]
      properties:
        assets:
          type: integer
          minimum: 0
          description: Assets in scope; tasks and sensors are not counted.
        measured:
          type: integer
          minimum: 0
          description: Assets whose latest successful result has a recorded row count.
        suspect:
          type: integer
          minimum: 0
          description: Measured assets with an empty or rows_changed signal.
    RollupEntry:
      type: object
      additionalProperties: false
      description: One entry of the rollup tree. Every count is the exact sum of its children's.
      required: [id, kind, label, parent, children, nodes, assets, running, health, asset_health,
        data_coverage, causes, asset_causes, not_fresh, weight, weights, held_by, gap_seconds,
        unbounded, fresh_by, stale_since, split, also_in]
      properties:
        id:
          type: string
          description: root, the group's id (group:FILE:NAME), file:PATH, or the node id.
        kind:
          type: string
          enum: [root, group, file, node]
        label:
          type: string
          description: The group's or node's declared name, the file's path, all for the root.
        parent:
          type: [string, 'null']
          description: The entry it sits under; null for the root.
        children:
          type: array
          items: {type: string}
          description: Its children's ids, worst health first, then most assets, then label.
        nodes:
          type: integer
          minimum: 0
          description: Nodes underneath (1 for a node).
        assets:
          type: integer
          minimum: 0
          description: Assets underneath; tasks and sensors are nodes, not assets.
        running:
          type: integer
          minimum: 0
          description: Nodes underneath a run is working on now.
        health:
          description: Nodes underneath by health.
          type: object
          additionalProperties: false
          required: [failing, blocked, suspect, behind, undecided, never_run, ok]
          properties:
            failing: {type: integer, minimum: 0}
            blocked: {type: integer, minimum: 0}
            suspect: {type: integer, minimum: 0}
            behind: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
            never_run: {type: integer, minimum: 0}
            ok: {type: integer, minimum: 0}
        asset_health:
          description: Assets underneath by health.
          type: object
          additionalProperties: false
          required: [failing, blocked, suspect, behind, undecided, never_run, ok]
          properties:
            failing: {type: integer, minimum: 0}
            blocked: {type: integer, minimum: 0}
            suspect: {type: integer, minimum: 0}
            behind: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
            never_run: {type: integer, minimum: 0}
            ok: {type: integer, minimum: 0}
        data_coverage:
          $ref: '#/components/schemas/RollupCoverage'
        causes:
          description: Nodes underneath that are not fresh, by cause. They add up to the nodes
            whose health is not ok or suspect.
          type: object
          additionalProperties: false
          required: [catching_up, queued, no_refresh_path, overdue, failing, undecided]
          properties:
            catching_up: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            no_refresh_path: {type: integer, minimum: 0}
            overdue: {type: integer, minimum: 0}
            failing: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
        asset_causes:
          description: Assets underneath that are not fresh, by cause.
          type: object
          additionalProperties: false
          required: [catching_up, queued, no_refresh_path, overdue, failing, undecided]
          properties:
            catching_up: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            no_refresh_path: {type: integer, minimum: 0}
            overdue: {type: integer, minimum: 0}
            failing: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
        not_fresh:
          type: integer
          minimum: 0
          description: Nodes underneath that are not fresh; what causes counts, as one number.
        weight:
          type: integer
          minimum: 0
          description: The entry's distance from fresh, in weighted nodes. Every node underneath
            counts 1; one that is not fresh counts its cause's weight instead (6 for failing,
            overdue and no_refresh_path, 2 for queued, catching_up and undecided). The exact sum
            of the children's.
        weights:
          description: weight by what the nodes are; each cause's nodes times its weight, and the
            fresh nodes at 1 each. They add up to weight.
          type: object
          additionalProperties: false
          required: [failing, overdue, no_refresh_path, queued, undecided, catching_up, fresh]
          properties:
            failing: {type: integer, minimum: 0}
            overdue: {type: integer, minimum: 0}
            no_refresh_path: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
            catching_up: {type: integer, minimum: 0}
            fresh: {type: integer, minimum: 0}
        stale_since: {type: [string, 'null'], format: date-time}
        split:
          type: object
          additionalProperties: false
          required: [need_someone, catching_up, run_by_hand, need_someone_nodes, in_hand_nodes, need_someone_weight, in_hand_weight]
          properties:
            need_someone: {type: integer, minimum: 0}
            catching_up: {type: integer, minimum: 0}
            run_by_hand: {type: integer, minimum: 0}
            need_someone_nodes: {type: integer, minimum: 0}
            in_hand_nodes: {type: integer, minimum: 0}
            need_someone_weight: {type: integer, minimum: 0}
            in_hand_weight: {type: integer, minimum: 0}
        held_by:
          type: array
          description: The roots that hold the not-fresh nodes underneath, each with what it holds
            under this entry, in the order of the root list applied to what is held here (the
            actionable roots first, then the most weight). Their nodes add up to not_fresh. Empty on a node entry.
          items:
            type: object
            additionalProperties: false
            required: [root, nodes, assets, causes, gap_seconds, unbounded, weight,
              cumulative_nodes, action_kind, stale_since, fresh_by]
            properties:
              root:
                type: string
                description: The root's id; an entry of roots.
              nodes:
                type: integer
                minimum: 1
                description: Nodes underneath the entry that the root holds.
              assets:
                type: integer
                minimum: 0
                description: Of them, assets.
              causes:
                description: Those nodes, by cause.
                type: object
                additionalProperties: false
                required: [catching_up, queued, no_refresh_path, overdue, failing, undecided]
                properties:
                  catching_up: {type: integer, minimum: 0}
                  queued: {type: integer, minimum: 0}
                  no_refresh_path: {type: integer, minimum: 0}
                  overdue: {type: integer, minimum: 0}
                  failing: {type: integer, minimum: 0}
                  undecided: {type: integer, minimum: 0}
              gap_seconds:
                type: integer
                minimum: 0
                description: The freshness gap of those nodes, node-seconds.
              unbounded:
                type: integer
                minimum: 0
                description: Of those nodes, the ones with no expected_fresh_at.
              weight:
                type: integer
                minimum: 0
                description: The weight of those nodes; each counts its cause's weight. What the
                  list is ranked by.
              action_kind: {type: string, enum: [wait, run, run_by_hand, add_schedule, resume_schedule, start_server, fix_failure, raise_max_runs]}
              stale_since: {type: [string, 'null'], format: date-time}
              fresh_by: {type: [string, 'null'], format: date-time}
              cumulative_nodes:
                type: integer
                minimum: 1
                description: Nodes held by this root and by the roots listed before it; against
                  not_fresh, how much of the scope the first roots explain.
        gap_seconds:
          type: integer
          minimum: 0
          description: The freshness gap underneath, node-seconds; the sum of the nodes' gap_seconds.
        unbounded:
          type: integer
          minimum: 0
          description: Nodes underneath that are not fresh and have no expected_fresh_at (failing,
            blocked, undecided, missed by a tick, no refresh path); fresh_by does not speak for them.
        fresh_by:
          type: [string, 'null']
          format: date-time
          description: The latest expected_fresh_at underneath (RFC 3339, UTC); null when no node
            underneath has one.
        keys:
          type: object
          additionalProperties: false
          description: A partitioned node's keys, on a node entry only.
          required: [failed, behind, ok, cause]
          properties:
            cause:
              type: [string, 'null']
              enum: [catching_up, queued, no_refresh_path, overdue, failing, undecided, null]
              description: Why the keys that are behind are not fresh; the node's own cause. Null
                when the node is fresh.
            failed:
              type: integer
              minimum: 0
              description: Keys whose last attempt failed.
            behind:
              type: integer
              minimum: 0
              description: Keys without a cached result that did not fail.
            ok:
              type: integer
              minimum: 0
              description: Keys with a cached result.
        also_in:
          type: array
          items:
            type: string
          description: The other groups that declare this node or group, by id. It is counted under
            parent alone. Empty for an entry declared in at most one group.
    RollupRoot:
      type: object
      additionalProperties: false
      description: One upstream fact and what it holds; every node whose root.id is this root's.
      required: [id, kind, node, detail, error_group, nodes, assets, causes, gap_seconds,
        unbounded, weight, needs_someone, stale_since, fresh_by, action]
      properties:
        id:
          type: string
          description: 'The root.id of every node it holds, including scheduler_off for the scheduler.'
        kind:
          type: string
          enum: [sensor_value, code, env, input, never_run, no_schedule, schedule_paused,
            scheduler_off, failure, queue, undecided]
        node:
          type: string
          description: The node the fact is about; the failing node, the sensor whose observation
            changed, the node whose code changed, the scheduled node of a paused, unfired or
            queue-bound schedule, the topmost node no tick reaches.
        detail:
          type: string
          description: The fact in a line; a failure's error headline as recorded, what changed,
            why no tick comes, how long its ticks wait for a run slot and max_runs.
        error_group:
          type: [string, 'null']
          description: A failure's headline with its numbers replaced by '#'; failure roots sharing
            one are shown as one entry. Null for every other kind and when no error was recorded.
        nodes:
          type: integer
          minimum: 1
          description: Nodes it holds.
        assets:
          type: integer
          minimum: 0
          description: Of them, assets.
        causes:
          description: The nodes it holds, by cause.
          type: object
          additionalProperties: false
          required: [catching_up, queued, no_refresh_path, overdue, failing, undecided]
          properties:
            catching_up: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            no_refresh_path: {type: integer, minimum: 0}
            overdue: {type: integer, minimum: 0}
            failing: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
        gap_seconds:
          type: integer
          minimum: 0
          description: The freshness gap it holds, node-seconds; the sum of its nodes' gap_seconds.
        unbounded:
          type: integer
          minimum: 0
          description: Of its nodes, those with no expected_fresh_at.
        weight:
          type: integer
          minimum: 0
          description: The weight of the nodes it holds; each counts its cause's weight. roots is
            ranked by actionability and then by it, the most first, a failure first among equals, then nodes, gap_seconds
            and id.
        needs_someone: {type: boolean}
        stale_since: {type: [string, 'null'], format: date-time}
        fresh_by: {type: [string, 'null'], format: date-time}
        action:
          type: object
          additionalProperties: false
          description: What clears the root.
          required: [kind, command, estimated_seconds, run_once]
          properties:
            kind:
              type: string
              enum: [wait, run, run_by_hand, add_schedule, resume_schedule, start_server, fix_failure,
                raise_max_runs]
              description: wait (a run in flight or the next tick computes what it holds), run
                (ticks missed what it holds, or no tick computes a Manual or pinned node), add_schedule,
                resume_schedule (a paused schedule or node), start_server (no scheduler fires the
                schedule), fix_failure, raise_max_runs (a queue-bound schedule; more run slots or
                spaced schedules).
            command:
              type: [string, 'null']
              description: The barca command that clears the root, naming --server; null when the
                action is not a command.
            run_once: {type: [string, 'null'], description: One-time refresh command for an unscheduled chain.}
            estimated_seconds:
              type: [integer, 'null']
              minimum: 0
              description: The typical compute time of the nodes it holds, whole seconds; the sum of
                their typical step durations. Null when none has a sample.
    RollupFile:
      type: object
      additionalProperties: false
      description: One source file's nodes in scope, summed, in whichever group each sits.
      required: [file, nodes, assets, running, health, asset_health, worst, causes, fresh, kinds]
      properties:
        file:
          type: string
          description: The source file, as node ids name it.
        nodes:
          type: integer
          minimum: 0
        assets:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
          description: Its nodes a run is working on now.
        health:
          type: object
          additionalProperties: false
          required: [failing, blocked, suspect, behind, undecided, never_run, ok]
          properties:
            failing: {type: integer, minimum: 0}
            blocked: {type: integer, minimum: 0}
            suspect: {type: integer, minimum: 0}
            behind: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
            never_run: {type: integer, minimum: 0}
            ok: {type: integer, minimum: 0}
        asset_health:
          type: object
          additionalProperties: false
          required: [failing, blocked, suspect, behind, undecided, never_run, ok]
          properties:
            failing: {type: integer, minimum: 0}
            blocked: {type: integer, minimum: 0}
            suspect: {type: integer, minimum: 0}
            behind: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
            never_run: {type: integer, minimum: 0}
            ok: {type: integer, minimum: 0}
        worst:
          type: string
          enum: [failing, blocked, suspect, behind, undecided, never_run, ok]
          description: The most severe health among its nodes.
        causes:
          description: Its nodes that are not fresh, by cause. The first with a node, in the served
            order of the causes, is the word a line about the file shows.
          type: object
          additionalProperties: false
          required: [catching_up, queued, no_refresh_path, overdue, failing, undecided]
          properties:
            catching_up: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            no_refresh_path: {type: integer, minimum: 0}
            overdue: {type: integer, minimum: 0}
            failing: {type: integer, minimum: 0}
            undecided: {type: integer, minimum: 0}
        fresh:
          type: integer
          minimum: 0
          description: Its nodes that are fresh (no cause). With causes they add up to nodes.
        kinds:
          $ref: '#/components/schemas/RollupKinds'
    RollupKinds:
      type: object
      additionalProperties: false
      description: A scope's nodes by kind; how many of each kind are fresh and how many have each
        cause. What a list of one kind counts its filters with.
      required: [asset, task, sensor]
      properties:
        asset: &id_kind_counts
          type: object
          additionalProperties: false
          required: [nodes, fresh, causes]
          properties:
            nodes:
              type: integer
              minimum: 0
              description: Nodes of the kind.
            fresh:
              type: integer
              minimum: 0
              description: Of them, fresh (no cause). With causes they add up to nodes.
            causes:
              description: Of them, not fresh, by cause.
              type: object
              additionalProperties: false
              required: [catching_up, queued, no_refresh_path, overdue, failing, undecided]
              properties:
                catching_up: {type: integer, minimum: 0}
                queued: {type: integer, minimum: 0}
                no_refresh_path: {type: integer, minimum: 0}
                overdue: {type: integer, minimum: 0}
                failing: {type: integer, minimum: 0}
                undecided: {type: integer, minimum: 0}
        task: *id_kind_counts
        sensor: *id_kind_counts
    Rollup:
      type: object
      additionalProperties: false
      description: GET /state/rollup and barca status --rollup --json. Experimental.
      required: [as_of, entries, roots, data_coverage, files, kinds]
      properties:
        as_of:
          type: string
          format: date-time
          description: When the rows were classified, RFC 3339 UTC. The server answers the start
            of the current minute, so an unchanged poll within a minute is a 304.
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RollupEntry'
          description: Every entry, the root first, then depth first in children order.
        roots:
          type: array
          items:
            $ref: '#/components/schemas/RollupRoot'
          description: What holds the nodes that are not fresh, actionable roots first; the most weight
            held first, a failure first among equals, then nodes, gap_seconds and id.
        data_coverage:
          $ref: '#/components/schemas/RollupCoverage'
        files:
          type: array
          items:
            $ref: '#/components/schemas/RollupFile'
          description: Each source file in scope with its nodes summed, by file path. The tree has
            a file entry only for the nodes of a file that are in no group.
        kinds:
          $ref: '#/components/schemas/RollupKinds'
    NodeGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - members
      - output
      properties:
        id: *id003
        name: *id003
        description: *id003
        members:
          type: array
          items: *id003
        output: *id003
    Asset:
      type: object
      additionalProperties: false
      description: One node as barca list --json shows it.
      required:
      - id
      - kind
      - freshness
      - inputs
      - env
      - file
      - line
      properties:
        id: *id005
        file:
          type: string
          description: Source file of the definition, as in the id.
        line:
          type: integer
          description: 1-based line of the definition's first decorator.
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        freshness:
          type: string
          enum:
          - always
          - manual
          - schedule
        schedule:
          type: string
          description: The cron expression of a scheduled node.
        next_fire:
          type: string
          description: A scheduled node's next fire time in the server machine's local time.
        inputs:
          type: array
          items: *id005
        env:
          type: array
          items: *id005
    PlanWarning:
      type: object
      additionalProperties: false
      required:
      - kind
      - node
      - param
      - message
      properties:
        kind: *id003
        node: *id003
        param: *id003
        message: *id003
    PlanReason:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: initial
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        properties:
          type:
            const: fan_in
          node_id: *id003
    PlanStream:
      type: object
      additionalProperties: false
      required:
      - stream_id
      - steps
      properties:
        stream_id: *id003
        steps:
          type: array
          items: *id003
    PlanPhase:
      type: object
      additionalProperties: false
      required:
      - reason
      - streams
      properties:
        reason:
          $ref: '#/components/schemas/PlanReason'
        streams:
          type: array
          items:
            $ref: '#/components/schemas/PlanStream'
    Plan:
      type: object
      additionalProperties: false
      required:
      - plan_version
      - total_steps
      - phases
      - warnings
      properties:
        plan_version:
          type: integer
          const: 1
          description: Plan document format version, independent of the package, database and worker protocol
            versions.
        total_steps: &id044
          type: integer
          minimum: 0
        pool_size:
          type: integer
          minimum: 0
          description: Worker processes a run starts at most (BARCA_POOL_SIZE, [execution] pool_size, else
            the cores bounded by the capacity). Experimental.
        pool_source:
          type: string
          description: Where pool_size came from, BARCA_POOL_SIZE, [execution] pool_size, cores, or the
            capacity setting that bounded the cores. Experimental.
        capacity:
          type: integer
          minimum: 0
          description: The most the weight= of the steps running at once may add up to (#436). Experimental.
        capacity_source:
          type: string
          description: Where capacity came from, BARCA_CAPACITY, [execution] capacity or pool size. Experimental.
        weights:
          type: object
          additionalProperties:
            type: integer
            minimum: 2
          description: Each planned node whose weight= is above 1, by node id. Experimental.
        phases:
          type: array
          items:
            $ref: '#/components/schemas/PlanPhase'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanWarning'
    PartitionSummary:
      type: object
      additionalProperties: false
      required:
      - total
      - cached
      - will_run
      - will_run_keys
      properties:
        total: *id044
        cached: *id044
        will_run: *id044
        will_run_keys:
          type: array
          items: *id003
          maxItems: 20
    StepReport:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      properties:
        skip_reason:
          type: string
          description: Explicit task Skip reason; absent on ordinary blocked downstream steps.
        batch:
          $ref: '#/components/schemas/BatchPlan'
        batch_execution:
          $ref: '#/components/schemas/BatchExecution'
        id: *id003
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        action: *id003
        status: *id003
        reason:
          description: Why the step ran or was skipped (barca docs contract, steps[]). A skipped
            step has reason upstream_failed (a node it reads in full failed), upstream_key_failed
            (the same key of a node it reads key for key failed; detail names the key),
            partition_selection, or under a scheduled tick blocked (it reads a Manual node that has
            never been computed) or paused (it, or a never-computed node it reads, is paused).
          type: string
        detail: *id003
        changed:
          description: Dry run, a step with no cached result that succeeded before; what changed in its run hash since then (0.29.0).
          type: array
          items: *id003
        run_hash: *id003
        artifact: *id003
        warning: *id003
        artifact_mismatch: *id043
        bytes_changed:
          type: boolean
          const: true
        elapsed_seconds:
          type: number
          minimum: 0
        attempts:
          type: integer
          minimum: 1
        import_seconds:
          type: number
          exclusiveMinimum: 1
        sink_seconds:
          type: number
          minimum: 0
          description: Seconds spent writing the step's sinks, summed over its executed keys (0.45.0). Not
            part of elapsed_seconds. Absent for a step without sinks, a cache hit and a dry run.
        partitions:
          $ref: '#/components/schemas/PartitionSummary'
        env:
          type: object
          additionalProperties:
            anyOf:
            - *id003
            - type: 'null'
        weight:
          type: integer
          minimum: 2
          description: Dry run only, the node's weight= when above 1 (#436). Experimental.
    ArtifactReference:
      type: object
      additionalProperties: false
      required:
      - path
      - format
      - size_bytes
      properties:
        path: *id003
        format: *id003
        size_bytes: *id044
        elapsed_seconds: &id045
          type: number
    Result:
      type: object
      additionalProperties: false
      required:
      - run_id
      - elapsed_seconds
      - steps_executed
      - phases
      - final_output
      - steps
      - warnings
      properties:
        run_id: *id003
        elapsed_seconds: *id045
        steps_executed: *id044
        phases: *id044
        final_output:
          anyOf:
          - $ref: '#/components/schemas/ArtifactReference'
          - type: 'null'
          description: Null or an artifact reference, not the CLI inline JSON rendering.
            For a partitioned target it is the first returned key's reference, in key order;
            the CLI returns every key. This endpoint does not define a partition retrieval
            API.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepReport'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanWarning'
        cache:
          $ref: '#/components/schemas/CacheReport'
        uploads:
          $ref: '#/components/schemas/Uploads'
        partition_selection:
          $ref: '#/components/schemas/PartitionSelection'
    PartitionSelection:
      type: object
      additionalProperties: false
      description: --partition (RunRequest.partition) on a run, a dry run or barca plan. The
        selection, each narrowed node (a planned partitioned node with a selected dimension) with
        the keys kept and left out (null while its keys are not known, before its partitions_from
        source ran), and the nodes the selection does not run (each also a step with status, or in
        a dry run action, skipped and reason partition_selection).
      required:
      - selection
      - nodes
      - skipped_nodes
      properties:
        exact_keys:
          type: array
          description: When present, only these key combinations are selected; selection summarizes their dimension values.
          items:
            type: object
            additionalProperties:
              type: string
        selection:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - selected
            - skipped
            properties:
              id:
                type: string
              selected:
                type:
                - integer
                - 'null'
                minimum: 0
              skipped:
                type:
                - integer
                - 'null'
                minimum: 0
        skipped_nodes:
          type: array
          items:
            type: string
    CacheReport:
      type: object
      additionalProperties: false
      description: Present on a run result when the check after the run found .barca/ over
        its size limit (RFC-0012).
      required:
      - size_bytes
      - limit_bytes
      - evicted_files
      - evicted_bytes
      properties:
        size_bytes: &cache_bytes
          type: integer
          minimum: 0
        limit_bytes: *cache_bytes
        evicted_files: *cache_bytes
        evicted_bytes: *cache_bytes
    CacheSize:
      type: object
      additionalProperties: false
      description: .barca/ size and limit as last measured by this server (after a run or on
        its minute checkpoint).
      required:
      - size_bytes
      - limit_bytes
      properties:
        size_bytes: *cache_bytes
        limit_bytes: *cache_bytes
    Uploads:
      type: object
      additionalProperties: false
      description: Results computed by this run's machine and not yet in the artifact store,
        present only when something is pending or failed to publish. Every step succeeded;
        the next run that opens the store uploads them first.
      required:
      - pending
      - error
      - nodes
      properties:
        pending:
          type: integer
          minimum: 0
        error:
          anyOf:
          - type: string
          - type: 'null'
        nodes:
          type: array
          items:
            type: string
    RunState:
      type: object
      additionalProperties: false
      required:
      - handle
      - status
      - result
      - error
      - started_at
      - finished_at
      properties:
        handle: *id003
        status:
          $ref: '#/components/schemas/RunStatus'
        result:
          anyOf:
          - $ref: '#/components/schemas/Result'
          - type: 'null'
        error:
          anyOf:
          - *id003
          - type: 'null'
        started_at: *id045
        finished_at:
          anyOf:
          - *id045
          - type: 'null'
    Cache:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      - detail
      properties:
        state:
          type: string
          enum:
          - cached
          - unsynced
          - stale
          - never_run
          - partial
          - blocked
          - unknown
          - always_runs
        reason:
          description: barca docs status lists what each reason means; not_planned is a node the dry
            run status is computed from has no step for (state unknown).
          type: string
          enum:
          - materialized
          - local_only
          - store_only
          - mismatch
          - not_in_ledger
          - changed
          - upstream_stale
          - upstream_failed
          - failed
          - artifact_missing
          - evicted
          - no_record
          - partitions_missing
          - partitions_unknown
          - sensor_output_unknown
          - cutoff_pending
          - not_planned
          - task
          - sensor
        detail: *id003
        run_hash: *id003
        artifact: *id003
        changed:
          description: What changed in a stale or failed node's run hash since its last successful materialization (0.29.0).
          type: array
          items: *id003
        change_causes:
          description: The same evidence by cause; absent when none is recorded.
          type: array
          items:
            type: string
            enum:
            - code_changed
            - inputs_changed
            - env_changed
            - upstream_stale
    PartitionState:
      type: object
      additionalProperties: false
      required:
      - total
      - cached
      - missing
      - missing_keys
      properties:
        total: *id044
        cached: *id044
        missing: *id044
        missing_keys:
          type: array
          items: *id003
          maxItems: 20
        failed:
          type: integer
          minimum: 1
          description: How many of missing last failed. Absent when none did.
        failed_keys:
          type: array
          items: *id003
          maxItems: 20
          description: The first of them in key order. Absent when none did.
        changed:
          type: object
          additionalProperties:
            type: array
            items: *id003
          description: For each missing key with an earlier result, what changed in its run hash.
        empty:
          type: integer
          minimum: 1
          description: Keys whose latest successful result wrote no rows (a recorded count of 0). Absent
            when none did.
        blocked:
          type: integer
          minimum: 1
          description: How many of missing wait on the same keys of an input, which failed; a run
            skips them. Absent when none does.
        blocked_on:
          type: string
          description: The node whose failed keys they wait on, by id. Absent when no key is blocked.
        behind:
          type: integer
          minimum: 0
          description: How many of missing neither failed nor are blocked (stale, or never run); a
            run computes them. failed, blocked and behind add up to missing.
    PartitionKeys:
      type: object
      additionalProperties: false
      required: [keys, total, recorded, failed, errors]
      description: One page of a node's keys that have a recorded attempt, in key order. A key
        that never ran has none and is listed by NodeStatus.partitions.missing_keys.
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, status, created_at, elapsed_seconds, error, run_id, artifact_path, size_bytes, rows]
            properties:
              key: *id003
              status: *id003
              created_at: *id003
              elapsed_seconds:
                type: [number, "null"]
              error:
                type: [string, "null"]
              run_id:
                type: [string, "null"]
              artifact_path:
                type: [string, "null"]
              size_bytes:
                type: [integer, "null"]
              rows:
                type: [integer, "null"]
                description: Rows the result holds, as its worker counted them (a frame's length or a parquet footer); null when not counted.
        total:
          type: integer
          minimum: 0
          description: Keys matching status and q.
        recorded:
          type: integer
          minimum: 0
          description: Every key with a recorded attempt, whatever the filters.
        failed:
          type: integer
          minimum: 0
          description: Those whose latest attempt failed.
        errors:
          type: array
          maxItems: 20
          description: The failed keys' first error lines, each of the key's values replaced by its
            dimension's name in angle brackets (<region>), most common first.
          items:
            type: object
            additionalProperties: false
            required: [error, keys]
            properties:
              error: *id003
              keys:
                type: integer
                minimum: 1
    PartitionGrid:
      type: object
      additionalProperties: false
      description: Every key of a partitioned node. Keys are the cells of the dimensions' product
        in row-major order, the last dimension varying fastest; each per-key array has one entry
        per cell.
      required: [id, chain, known, dimensions, states, counts, attempted_base, attempted_at, elapsed_ms, size_bytes, rows, run, error, errors, runs]
      properties:
        id: *id003
        chain:
          type: array
          description: The partitioned nodes sharing this node's keys (the same dimensions, linked
            through their inputs), upstream first, this node among them.
          items: *id003
        known:
          type: boolean
          description: False while the keys are not known (a partitions_from source that has not run).
        dimensions:
          type: array
          description: In key-suffix order (by name), each with its values in order.
          items:
            type: object
            additionalProperties: false
            required: [name, values]
            properties:
              name: *id003
              values:
                type: array
                items: *id003
        states:
          type: string
          pattern: '^[cpsnfb-]*$'
          description: One character per cell. c fresh, p pinned, s stale, n never run, f failed (its latest
            attempt failed), b blocked (the same key of an input failed or is blocked), - not a key.
        counts:
          type: object
          additionalProperties: false
          required: [fresh, pinned, stale, never_run, failed, blocked, empty]
          properties:
            fresh: {type: integer, minimum: 0}
            pinned: {type: integer, minimum: 0}
            stale: {type: integer, minimum: 0}
            never_run: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            blocked: {type: integer, minimum: 0}
            empty:
              type: integer
              minimum: 0
              description: Keys whose latest attempt succeeded and wrote no rows, whatever their state.
        attempted_base:
          type: integer
          description: Unix seconds that attempted_at counts from.
        attempted_at:
          type: array
          description: When each cell's latest attempt was recorded, in seconds after attempted_base.
          items:
            type: [integer, "null"]
        elapsed_ms:
          type: array
          description: How long each cell's latest attempt took, in milliseconds.
          items:
            type: [integer, "null"]
            minimum: 0
        size_bytes:
          type: array
          description: The size of each cell's latest artifact.
          items:
            type: [integer, "null"]
        rows:
          type: array
          description: The rows each cell's latest successful attempt wrote; null where not counted or failed.
          items:
            type: [integer, "null"]
        run:
          type: array
          description: Each cell's latest attempt's run, an index into runs.
          items:
            type: [integer, "null"]
            minimum: 0
        error:
          type: object
          description: Each failed cell's error, an index into errors, by cell index.
          additionalProperties:
            type: integer
            minimum: 0
        errors:
          type: array
          description: The failed keys' errors, most common first. The first line, each of the
            key's values replaced by its dimension's name in angle brackets (<region>).
          items:
            type: object
            additionalProperties: false
            required: [error, keys]
            properties:
              error: *id003
              keys:
                type: integer
                minimum: 1
        runs:
          type: array
          items: *id003
    KeyCounts: &id_keycounts
      type: object
      additionalProperties: false
      description: How many keys are in each state.
      required: [fresh, pinned, stale, never_run, failed, blocked, empty]
      properties:
        fresh: {type: integer, minimum: 0}
        pinned: {type: integer, minimum: 0}
        stale: {type: integer, minimum: 0}
        never_run: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        blocked: {type: integer, minimum: 0}
        empty:
          type: integer
          minimum: 0
          description: Keys whose latest attempt succeeded and wrote no rows, whatever their state.
    KeyErrorGroups: &id_keyerrors
      type: array
      description: The failed keys' errors, most common first. The first line, each of the
        key's values replaced by its dimension's name in angle brackets (<region>).
      items:
        type: object
        additionalProperties: false
        required: [error, keys]
        properties:
          error: *id003
          keys:
            type: integer
            minimum: 1
    KeysPage:
      type: object
      additionalProperties: false
      description: One page of the keys of a partitioned node that match a query, as barca status NODE
        --keys --json prints it.
      required: [id, known, dimensions, counts, errors, keys, total, truncated, offset, needs_run, selection]
      properties:
        id: *id003
        known:
          type: boolean
          description: False while the keys are not known (a partitions_from source that has not run).
        dimensions:
          type: array
          description: The dimensions' names, in key order.
          items: *id003
        counts: *id_keycounts
        errors: *id_keyerrors
        keys:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [key, values, state, attempted_at, elapsed_seconds, size_bytes, rows, run_id, error]
            properties:
              key: *id003
              values:
                type: array
                description: The key's value of each dimension, in the order of dimensions.
                items: *id003
              state:
                type: string
                enum: [failed, blocked, stale, never_run, pinned, fresh]
              attempted_at:
                type: [string, "null"]
                description: The key's latest attempt (RFC 3339).
              elapsed_seconds:
                type: [number, "null"]
              size_bytes:
                type: [integer, "null"]
              rows:
                type: [integer, "null"]
                description: Rows the latest successful attempt wrote, where its worker counted them.
              run_id:
                type: [string, "null"]
              error:
                type: [string, "null"]
                description: A failed key's error as errors groups it.
        total:
          type: integer
          minimum: 0
          description: Keys the query matches; keys is a page of them.
        truncated:
          type: boolean
          description: True when keys the query matches come after this page.
        offset:
          type: integer
          minimum: 0
        needs_run:
          type: integer
          minimum: 0
          description: Of the keys the query matches, those a run computes (failed, blocked, stale, never run).
        selection:
          type: [string, "null"]
          description: The keys the query matches as --partition and POST /runs take them. A JSON object
            of each dimension's values when they form a rectangle, a JSON list of keys otherwise. Past
            5,000 scattered keys, a query for the keys a run computes that filters by dimension alone
            (needs_run, value, range) gets its filters' rectangle, whose run computes the same keys;
            any other gets null. Null when nothing matches.
        hint:
          type: string
          description: Present when truncated. What to pass the CLI for more.
    KeysOverview:
      type: object
      additionalProperties: false
      description: The keys of a partitioned node in one picture, as barca status NODE --overview --json
        prints it.
      required: [id, chain, known, dimensions, counts, needs_run, errors, issues, along, rows, rows_total, truncated, last_attempt_at]
      properties:
        id: *id003
        chain:
          type: array
          description: The partitioned nodes sharing this node's keys, upstream first, this node among them.
          items: *id003
        known:
          type: boolean
        dimensions:
          type: array
          description: In key order, each with its values in order.
          items:
            type: object
            additionalProperties: false
            required: [name, values]
            properties:
              name: *id003
              values:
                type: array
                items: *id003
        counts: *id_keycounts
        needs_run:
          type: integer
          minimum: 0
          description: Keys a run computes (failed, blocked, stale, never run).
        errors: *id_keyerrors
        issues:
          type: array
          description: What is wrong and where, the most keys first. Each error of the failed keys, then the
            blocked, stale and never-run keys.
          items:
            type: object
            additionalProperties: false
            required: [state, error, title, keys, places, selection]
            properties:
              state:
                type: string
                enum: [failed, blocked, stale, never_run]
              error:
                type: [integer, "null"]
                minimum: 0
                description: For failed keys with a grouped error, its index into errors.
              title:
                type: string
                description: The error's first line, or what the state means.
              keys:
                type: integer
                minimum: 1
              places:
                type: array
                description: Per dimension the keys do not span whole, where they are.
                items:
                  type: object
                  additionalProperties: false
                  required: [dimension, words]
                  properties:
                    dimension: *id003
                    words:
                      type: string
              selection:
                type: [string, "null"]
                description: Its keys as --partition and POST /runs take them; null past 5,000 scattered keys.
        along:
          type: [string, "null"]
          description: The dimension the rows run along, the one with the most values. Null with no keys.
        rows:
          type: array
          description: One row per combination of the other dimensions' values that has a key.
          items:
            type: object
            additionalProperties: false
            required: [label, values, states]
            properties:
              label:
                type: string
                description: region=apac; empty for a one-dimension node.
              values:
                type: array
                items: *id003
              states:
                type: string
                pattern: '^[cpsnfb-]*$'
                description: One character per value of along, in its order, as PartitionGrid.states.
        rows_total:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True when rows holds fewer rows than the node has.
        last_attempt_at:
          type: [string, "null"]
          description: The newest attempt of any key (RFC 3339).
        hint:
          type: string
          description: Present when truncated. What to pass the CLI for more.
    KeyArtifact:
      type: object
      additionalProperties: false
      required: [id, step, artifact_path, format, size_bytes, shape]
      description: A node's latest successful result for one key (or, for an input that is not
        partitioned, its latest result), and that result's shape.
      properties:
        id: *id003
        step:
          type: string
          description: node[key] for a partitioned node, the node for one that is not.
        artifact_path:
          type: [string, "null"]
        format:
          type: [string, "null"]
        size_bytes:
          type: [integer, "null"]
        shape:
          type: [object, "null"]
          description: Its type, columns or fields and first rows, as barca status --sample reads
            them; null without a successful result.
    PartitionKeyDetail:
      type: object
      additionalProperties: false
      required: [id, key, state, needs_run, chain, attempts, output, inputs]
      properties:
        id: *id003
        key: *id003
        state:
          type: string
          enum: [c, p, s, n, f, b]
          description: As PartitionGrid.states.
        needs_run:
          type: boolean
          description: A run computes this key. It is failed, blocked, stale or never ran.
        chain:
          type: array
          description: The same key in each node of the chain, upstream first.
          items:
            type: object
            additionalProperties: false
            required: [id, state]
            properties:
              id: *id003
              state:
                type: string
                enum: [c, p, s, n, f, b, '-']
        attempts:
          type: array
          maxItems: 20
          description: The key's latest attempts, newest first.
          items:
            type: object
            additionalProperties: false
            required: [status, created_at, elapsed_seconds, error, run_id, artifact_path, format, size_bytes, rows]
            properties:
              status: *id003
              created_at: *id003
              elapsed_seconds:
                type: [number, "null"]
              error:
                type: [string, "null"]
              run_id:
                type: [string, "null"]
              artifact_path:
                type: [string, "null"]
              format:
                type: [string, "null"]
              size_bytes:
                type: [integer, "null"]
              rows:
                type: [integer, "null"]
                description: Rows the result holds, as its worker counted them (a frame's length or a parquet footer); null when not counted.
        output:
          oneOf:
          - $ref: '#/components/schemas/KeyArtifact'
          - type: 'null'
        inputs:
          type: array
          description: The same key of each input that shares the node's dimensions, and the latest
            result of each other input.
          items:
            $ref: '#/components/schemas/KeyArtifact'
    Materialization:
      type: object
      additionalProperties: false
      required:
      - status
      - created_at
      - elapsed_seconds
      - run_hash
      - artifact
      - format
      - size_bytes
      - rows
      properties:
        skip_reason:
          type: string
          description: Explicit task reason for a skipped attempt, with no result or artifact.
        status: *id003
        created_at: *id003
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        rows:
          type: [integer, "null"]
          description: Rows the result holds, as its worker counted them (a frame's length or a parquet footer); null when not counted.
        run_hash: &id046
          anyOf:
          - *id003
          - type: 'null'
        artifact: *id046
        format: *id046
        size_bytes:
          anyOf:
          - &id054
            type: integer
          - type: 'null'
        partition: *id003
        error: *id003
        content_hash: *id003
    BytesChange:
      type: object
      additionalProperties: false
      required:
      - node_id
      - run_hash
      - content_hash
      - created_at
      properties:
        node_id: *id003
        run_hash: *id003
        content_hash: *id003
        created_at: *id003
    NodeStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - inputs
      - partitioned
      - cache
      - health
      - health_reason
      - signals
      - measured
      - cause
      - root
      - gap_seconds
      - last_check
      - refresh_path
      - stale_since
      - expected_fresh_at
      - recheck_at
      - no_estimate
      - last_attempt
      - typical_run_seconds
      - last_materialization
      - shape
      - env
      properties:
        id: *id003
        name:
          type: string
          description: The declared name, or function name when no explicit name is set.
        health: &id_health
          type: string
          enum: [failing, blocked, suspect, behind, undecided, never_run, ok]
          description: Whether something needs doing about the node, in one word, most severe first
            (specs/behavior/health.md). Beside cache.state, never in place of it. Classified per
            response, so a late schedule shows without a change to the database. Experimental.
        health_reason: &id_health_reason
          type: string
          enum: [last_attempt_failed, keys_failed, upstream_failing, cache_blocked, empty,
            rows_changed, behind_input, schedule_late, stale, partial, unsynced,
            checked_up_to_date, unknown, never_run, no_successful_run, last_run_succeeded, on_demand, cached]
          description: The rule that decided health. checked_up_to_date is ok for a node whose
            cache.state is unknown and whose last_check found it up to date or rebuilt it, while
            that check stands (specs/behavior/health.md, "What estimates change"). Experimental.
        signals: &id_signals
          type: array
          items:
            $ref: '#/components/schemas/DataSignal'
          description: What the node's recorded results say about its data, from recorded facts only
            (row counts its workers counted, when each result was written); empty when nothing does,
            which for an asset that is not measured says nothing. Only assets have signals.
            Experimental.
        measured: &id_measured
          type: [boolean, 'null']
          description: Whether the asset's latest successful result has a recorded row count (for a
            partitioned asset, any key's); null for a task or sensor. false is "not measured",
            never ok for data. Experimental.
        cause: &id_cause
          type: [string, 'null']
          enum: [catching_up, queued, no_refresh_path, overdue, failing, undecided, null]
          description: Why the node is not fresh (specs/behavior/health.md, "Cause"); null exactly
            when it is fresh (health ok or suspect). Whether a tick will come is read from this
            server's scheduler or, on a server that runs none, from the tick record. Experimental.
        root: &id_root
          anyOf:
          - $ref: '#/components/schemas/NodeRoot'
          - type: 'null'
          description: The upstream fact that explains why the node is not fresh
            (specs/behavior/health.md, "Root"); null exactly when it is fresh. Nodes with the same
            id are held by the same thing (GET /state/rollup, roots). Experimental.
        gap_seconds: &id_gap_seconds
          type: integer
          minimum: 0
          description: The node's freshness gap, seconds; stale_since to now plus now to
            expected_fresh_at, read at the start of the current minute. 0 for a fresh or undecided
            node; a term whose time is null counts 0. Experimental.
        last_check: &id_last_check
          type: [object, 'null']
          additionalProperties: false
          required: [at, outcome, schedule]
          description: What the newest finished tick that had the node as a target did with it
            (the tick record, schedule_ticks); null when no retained tick did. A record, whatever
            its age. A --read-only server reads the ticks the scheduling server recorded.
            Experimental.
          properties:
            at:
              type: string
              format: date-time
              description: When that tick's run ended (RFC 3339, UTC).
            outcome:
              type: string
              enum: [rebuilt, up_to_date, failed, not_reached]
              description: rebuilt (its step executed and succeeded; a sensor was polled, whatever
                it returned; a task fired), up_to_date (a cache hit), failed, or not_reached (the
                run ended before it decided the node).
            schedule:
              type: string
              description: The scheduled node whose tick it was.
        refresh_path: &id_refresh_path
          type: [object, 'null']
          additionalProperties: false
          required: [schedule, next_tick, paused, live, state, missed_ticks]
          description: The schedule whose tick brings the node up to date (specs/behavior/health.md,
            "Refresh path"); null when no tick has the node as a target (a Manual asset or task,
            an Always node no scheduled node or polled sensor is above, a sensor only polled as an
            input) and for a paused node or a pinned asset. Membership is the scheduler's own
            target list. Experimental.
          properties:
            schedule:
              type: string
              description: The scheduled node's id. Of several schedules that reach the node, the
                one that fires earliest next (one with no next tick last, ties by id).
            next_tick:
              type: [string, 'null']
              format: date-time
              description: The schedule's next slot (RFC 3339, UTC), in the server's --timezone;
                the first slot after a timed pause ends; null for a pause until resumed and when
                live is false.
            paused:
              type: boolean
              description: The schedule is paused (POST /schedule/{id}/pause).
            live:
              type: boolean
              description: A scheduler fires this schedule, as observed locally or from its recorded decisions. A failure hold suppresses its next tick.
            state: &schedule_state
              type: string
              enum: [paused, held, late, overrunning, on_time]
            missed_ticks:
              type: integer
              minimum: 0
              description: How many finished ticks of the path's schedules had the node as a
                target and did not leave it fresh (outcome failed or not_reached), counted back
                from the newest to the last one that found it up to date or rebuilt it, and only
                those that ended after its newest successful result. 0 for a fresh node. Bounded
                by the tick record (the newest 20 fired ticks of each schedule keep their targets).
        stale_since: &id_stale_since
          type: [string, 'null']
          format: date-time
          description: Since when the node has been out of date (RFC 3339, UTC), the earliest
            recorded time from which it has been continuously not fresh (specs/behavior/health.md,
            "Times"); null for a fresh or undecided node and where no record holds the time (a
            changed environment variable, a new partition key, a missing copy). Experimental.
        expected_fresh_at: &id_expected_fresh_at
          type: [string, 'null']
          format: date-time
          description: When the node is expected to be fresh (RFC 3339, UTC), an estimate rounded up
            to 5 seconds; the start of the run that computes it (a running run's latest progress, a
            waiting run's estimated start, else the next tick of its refresh path plus the
            schedule's typical queue wait) plus the typical durations of the steps before it. null
            for a fresh node and where no run is known to leave it fresh (failing, blocked,
            undecided, below a node no tick refreshes, missed by a tick, no refresh path, no
            scheduler here). Experimental.
        recheck_at: &id_recheck_at
          type: [string, 'null']
          format: date-time
          description: When a tick next looks at the node (RFC 3339, UTC), the next tick of its
            refresh path; a node with this and no expected_fresh_at will be rechecked, not
            necessarily fresh. null when it has no refresh path or the path has no next tick.
            Experimental.
        no_estimate: &id_no_estimate
          type: [string, 'null']
          enum: [failing, paused, scheduler_off, no_path, undecided, missed, queue_stopped,
            no_scheduler_here, not_promised, null]
          description: Why a node that is not fresh has no expected_fresh_at, in one word; null
            for a fresh node and one that has an estimate. Experimental.
        last_attempt: &id_last_attempt
          type: string
          enum: [never_run, success, failed, skipped]
          description: How its newest attempt went, in one word. failed when its last
            materialization failed or any of its keys last failed (partitions.failed); never_run
            when no execution is recorded; else success. A fact beside cache.state and health,
            read off the row alone; a blocked or stale node whose last run went well reads
            success, and a cache hit is not an attempt. Experimental.
        typical_run_seconds: &id_typical_run_seconds
          type: [number, 'null']
          description: How long one run of the node typically takes, seconds; the median of its
            recent successful executions (at most 20), times its number of keys for a
            partitioned node (durations are recorded per key). An estimate of a run over every
            key, not of the next run, which computes only the keys that need it. Rounded to a
            millisecond. null when it has no successful execution on record. Experimental.
        kind: &id047
          type: string
          enum:
          - asset
          - task
          - sensor
        inputs: &id048
          type: array
          items: *id003
        partitioned: *id043
        cache: &id049
          $ref: '#/components/schemas/Cache'
        partitions: &id050
          $ref: '#/components/schemas/PartitionState'
        last_bytes_change:
          $ref: '#/components/schemas/BytesChange'
        last_materialization: &id051
          anyOf:
          - $ref: '#/components/schemas/Materialization'
          - type: 'null'
        shape: &id052
          description: Null or the artifact inspector shape; user JSON types and keys remain unconstrained.
        env: &id053
          type: array
          items: *id003
        undeclared_env:
          type: array
          items: *id003
        schedule:
          $ref: '#/components/schemas/NodeSchedule'
    NodeSchedule:
      type: object
      additionalProperties: false
      description: barca status --json nodes[].schedule. Times are RFC 3339 UTC.
      required:
      - state
      - state_detail
      - cron
      - next_fire
      - last_fired
      - last_status
      - last_run_id
      - late
      - late_since
      - failures
      - max_failures
      - failing
      - paused
      - paused_until
      - skip_reason
      - live
      - typical_queue_wait_seconds
      - typical_run_seconds
      - queue_bound
      properties:
        state: *schedule_state
        state_detail:
          type: [string, 'null']
        cron:
          type: string
        next_fire:
          type:
          - string
          - 'null'
        last_fired:
          type:
          - string
          - 'null'
        last_status:
          type:
          - string
          - 'null'
          description: Status of the run the newest tick started, in the words of GET /runs (pending
            while it waits in the run queue).
        last_run_id:
          type:
          - string
          - 'null'
          description: The run the newest tick (last_fired) started.
        late:
          type: boolean
          description: late_since is further back than the schedule's grace (60 seconds, or half the
            interval of a schedule more frequent than every two minutes) plus its queue wait. Never
            while paused. The same value as late of GET /schedule.
        late_since:
          type:
          - string
          - 'null'
          description: The first slot after the newest scheduler decision that has passed; null while on time, while
            paused and when no tick is recorded.
        failures:
          type: integer
          minimum: 0
        max_failures:
          type: integer
          minimum: 0
        failing:
          type: boolean
        paused:
          type: boolean
        paused_until:
          type:
          - string
          - 'null'
        skip_reason:
          type:
          - string
          - 'null'
        live:
          type: boolean
          description: true when a running scheduler reported it; false when read from the metadata DB.
        typical_queue_wait_seconds: &id_typical_wait
          type: integer
          minimum: 0
          description: How long its ticks' runs typically wait for a run slot, whole seconds; the
            median queue wait of its newest 20 fired ticks (the tick record), 0 with none.
            Experimental.
        typical_run_seconds: &id_typical_run
          type: [integer, 'null']
          minimum: 0
          description: How long its ticks' runs typically take from start to end, whole seconds; the
            median of its newest 20 fired ticks whose run succeeded, null with none. Experimental.
        queue_bound: &id_queue_bound
          type: boolean
          description: Its typical queue wait exceeds its interval, so its ticks wait for a run slot
            longer than they are apart. Experimental.
    Durations:
      type: object
      additionalProperties: false
      required:
      - median_seconds
      - p95_seconds
      - samples
      properties:
        median_seconds: *id045
        p95_seconds: *id045
        samples: *id044
    NodeState:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - inputs
      - partitioned
      - cache
      - health
      - health_reason
      - measured
      - cause
      - root
      - gap_seconds
      - last_check
      - refresh_path
      - stale_since
      - expected_fresh_at
      - recheck_at
      - no_estimate
      - last_attempt
      - typical_run_seconds
      - last_materialization
      - shape
      - env
      - durations
      - last_success_at
      - failing_since
      - consecutive_failures
      - next_run
      - prev_run
      - late_since
      - signals
      - running
      properties:
        id: *id003
        name:
          type: string
          description: The declared name, or function name when no explicit name is set.
        kind: *id047
        inputs: *id048
        partitioned: *id043
        cache: *id049
        health: *id_health
        health_reason: *id_health_reason
        measured: *id_measured
        cause: *id_cause
        root: *id_root
        gap_seconds: *id_gap_seconds
        last_check: *id_last_check
        refresh_path: *id_refresh_path
        stale_since: *id_stale_since
        expected_fresh_at: *id_expected_fresh_at
        recheck_at: *id_recheck_at
        no_estimate: *id_no_estimate
        last_attempt: *id_last_attempt
        typical_run_seconds: *id_typical_run_seconds
        partitions: *id050
        last_materialization: *id051
        shape: *id052
        env: *id053
        durations:
          anyOf:
          - $ref: '#/components/schemas/Durations'
          - type: 'null'
        next_run:
          anyOf:
          - *id054
          - type: 'null'
        prev_run:
          anyOf:
          - *id054
          - type: 'null'
          description: For a scheduled node, the cron's most recent fire time at or before now (unix
            seconds, in the server's --timezone); null otherwise.
        late_since:
          anyOf:
          - *id054
          - type: 'null'
          description: For a scheduled node that missed a slot, the first slot (unix seconds) after
            its schedule's newest tick (the slot of the newest run it started or queued), when that
            slot is at or before now; null while on time, while paused, when no tick is recorded, and
            for a node without a schedule. schedule.late says whether the schedule is late.
            Experimental.
        signals: *id_signals
        last_success_at:
          anyOf:
          - *id003
          - type: 'null'
          description: When the node's newest successful result was written (UTC, as
            last_materialization.created_at; keys of a partitioned node count toward it); null if
            it never succeeded.
        failing_since:
          anyOf:
          - *id003
          - type: 'null'
          description: The first failed attempt after the node's last clean run (a run in which it
            did not fail); null unless its latest attempts failed.
        consecutive_failures:
          type: integer
          minimum: 0
          description: How many runs in a row failed the node, up to now; a run counts once however
            many keys failed. 0 when its latest attempt did not fail.
        running: &id_running
          anyOf:
          - $ref: '#/components/schemas/NodeRunning'
          - type: 'null'
          description: The run working on this node now, whoever started it (the scheduler, an
            HTTP request, a `barca get --server`, or a CLI run on the same `.barca/` whose owner is
            alive); null when none is.
        last_run:
          $ref: '#/components/schemas/LastRun'
          description: The node's newest run as a whole (the run last_materialization is from);
            absent until a run recorded a row for it.
    DataSignal:
      description: One data-health signal of a node (barca status --json, GET /nodes, GET /state), tagged by kind.
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind, empty_keys, keys, previous_empty_keys]
        description: The latest successful result wrote no rows; for a partitioned node, empty_keys of
          the keys whose latest result recorded a row count (1 of 1 for a node without keys).
        properties:
          kind: {const: empty}
          empty_keys: {type: integer, minimum: 1}
          keys: {type: integer, minimum: 1}
          previous_empty_keys:
            type: [integer, "null"]
            minimum: 0
            description: How many were empty as of before the node's newest run; null when no key had
              a counted result before it.
      - type: object
        additionalProperties: false
        required: [kind, changed_keys, key, rows, previous_rows]
        description: A latest successful result's row count differs from the one before it (same node,
          same key) by more than half of it, or rows came after an empty result. rows and
          previous_rows are of key, the key that moved the most relative to before (null without
          keys); changed_keys counts every key that moved.
        properties:
          kind: {const: rows_changed}
          changed_keys: {type: integer, minimum: 1}
          key: {type: [string, "null"]}
          rows: {type: integer, minimum: 0}
          previous_rows: {type: integer, minimum: 0}
      - type: object
        additionalProperties: false
        required: [kind, input, input_success_at, last_success_at]
        description: The node's cache state is unknown and its latest successful result is older than
          the newest successful result (from another run) of input, an asset it reads; times are UTC
          YYYY-MM-DD HH:MM:SS.
        properties:
          kind: {const: behind_input}
          input: {type: string}
          input_success_at: {type: string}
          last_success_at: {type: string}
    LastRun:
      type: object
      additionalProperties: false
      required:
      - run_id
      - elapsed_seconds
      - keys
      - calls
      - failed
      properties:
        run_id: *id003
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
          description: Wall time summed over the rows of the run that recorded one (a key's
            last_materialization.elapsed_seconds is that key's share alone); null when none did,
            every key having failed before finishing.
        keys:
          type: integer
          minimum: 0
          description: Rows the run recorded for the node; its keys, or 1.
        calls:
          type: integer
          minimum: 0
          description: Batched calls those keys ran in; 0 when each ran on its own.
        failed:
          type: integer
          minimum: 0
          description: Keys that failed.
    NodeRunning:
      type: object
      additionalProperties: false
      required:
      - control
      - run_id
      - triggered_by
      - started_at
      - step
      - partitions
      - label
      properties:
        control:
          $ref: '#/components/schemas/RunControl'
        label: {type: string}
        run_id:
          type: string
          description: The run (GET /runs/{run_id}).
        triggered_by:
          anyOf:
          - $ref: '#/components/schemas/TriggeredBy'
          - type: 'null'
          description: Null for a CLI run recorded by a barca that did not record it.
        started_at:
          type: string
          description: RFC 3339, UTC.
        step:
          $ref: '#/components/schemas/RunningStep'
        partitions:
          anyOf:
          - $ref: '#/components/schemas/PartitionProgress'
          - type: 'null'
          description: For a partitioned node, how many of its keys are done; null otherwise.
    RunningStep:
      type: string
      enum:
      - queued
      - running
      - waiting
      description: Queued for a run slot, waiting within a run, or executing on a worker.
    PartitionProgress:
      type: object
      additionalProperties: false
      required:
      - running
      - done
      - total
      properties:
        running:
          type: integer
          minimum: 0
          description: Keys not done yet while the step runs; 0 while it is queued.
        done:
          type: integer
          minimum: 0
          description: Keys with a result, cached or finished by this run.
        total:
          type: integer
          minimum: 0
          description: Every key of the node.
    ActiveStep:
      type: object
      additionalProperties: false
      required:
      - node_id
      - step
      - partitions
      properties:
        node_id: *id003
        step:
          $ref: '#/components/schemas/RunningStep'
        partitions:
          anyOf:
          - $ref: '#/components/schemas/PartitionProgress'
          - type: 'null'
    AssetRun:
      type: object
      additionalProperties: false
      required:
      - elapsed_seconds
      - status
      - created_at
      - error_message
      - attempts
      - run_id
      - cpu_seconds
      - max_rss_bytes
      - rows
      properties:
        rows:
          type: [integer, "null"]
          description: Rows the result holds, as its worker counted them; a partitioned node's entry adds
            up its successful keys' rows, null unless every one was counted.
        empty_keys:
          type: integer
          minimum: 0
          description: A partitioned node's entry, how many of its keys wrote no rows.
        keys:
          type: integer
          minimum: 0
          description: A partitioned node's entry is one run, its keys recorded in it.
        failed_keys:
          type: integer
          minimum: 0
          description: How many of them failed.
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        status: *id003
        created_at: *id003
        error_message:
          anyOf:
          - *id003
          - type: 'null'
        attempts: *id054
        run_id:
          anyOf:
          - *id003
          - type: 'null'
          description: The run that recorded this execution; null on rows from before barca recorded it.
        cpu_seconds:
          anyOf:
          - *id045
          - type: 'null'
        max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The worker process's peak RSS while the step ran, in bytes; null when not recorded.
    Stats:
      type: object
      additionalProperties: false
      required:
      - id
      - total_runs
      - avg_elapsed_seconds
      - median_elapsed_seconds
      - max_elapsed_seconds
      - p95_elapsed_seconds
      - cache_hit_rate
      - max_rss_bytes
      - median_max_rss_bytes
      - recent_runs
      properties:
        id: *id003
        total_runs: *id054
        avg_elapsed_seconds: &id055
          anyOf:
          - *id045
          - type: 'null'
        median_elapsed_seconds: *id055
        max_elapsed_seconds: *id055
        p95_elapsed_seconds: *id055
        cache_hit_rate: *id045
        max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The largest peak RSS a recorded execution reached, in bytes.
        median_max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The median of the recorded executions' peak RSS, in bytes.
        recent_runs:
          type: array
          items:
            $ref: '#/components/schemas/AssetRun'
      description: barca stats --json.
    AssetDetail:
      type: object
      additionalProperties: false
      required:
      - asset
      - stats
      - running
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        stats:
          $ref: '#/components/schemas/Stats'
        running: *id_running
        failure:
          description: Present (not null) when the node's latest execution failed. raised_at is the
            last traceback frame inside the project; run_hash is the failed attempt's; last_success
            is null when the node never succeeded. Unpartitioned nodes only (a key's row is not the
            node's).
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FailureFacts'
    FailureFacts:
      type: object
      additionalProperties: false
      required:
      - raised_at
      - run_hash
      - run_id
      - created_at
      - last_success
      properties:
        raised_at:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [file, line, function]
            properties:
              file:
                type: string
                description: Relative to the project root
              line:
                type: integer
              function:
                type: [string, 'null']
        run_hash:
          type: [string, 'null']
        run_id:
          type: [string, 'null']
        created_at:
          type: string
        last_success:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [run_hash, created_at, run_id]
            properties:
              run_hash:
                type: [string, 'null']
              created_at:
                type: string
              run_id:
                type: [string, 'null']
    Job:
      type: object
      additionalProperties: false
      required:
      - state
      - state_detail
      - id
      - cron
      - kind
      - next_fire
      - last_fired
      - last_run_id
      - last_run
      - last_status
      - late
      - late_since
      - last_skipped
      - skipped_for
      - skip_reason
      - paused
      - paused_until
      - failures
      - max_failures
      - failing
      - typical_queue_wait_seconds
      - typical_run_seconds
      - queue_bound
      properties:
        state: *schedule_state
        state_detail:
          type: [string, 'null']
        id: *id003
        cron: *id003
        typical_queue_wait_seconds: *id_typical_wait
        typical_run_seconds: *id_typical_run
        queue_bound: *id_queue_bound
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        next_fire:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        last_fired:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: The schedule's newest tick, the slot of the newest run it started or queued
            (RFC 3339 UTC); null when none is recorded.
        last_run_id:
          anyOf:
          - *id003
          - type: 'null'
          description: The run that tick started.
        last_run:
          anyOf:
          - *id003
          - type: 'null'
          description: last_run_id under its older name.
        last_task_skip_reason:
          type: string
          description: Explicit task skip reason from the newest fired run when its status is skipped; omitted after a success, failure or newer scheduler-only decision. Separate from scheduler skip_reason.
        last_status:
          anyOf:
          - type: string
            enum:
            - pending
            - running
            - success
            - skipped
            - failed
            - cancelled
            - interrupted
          - type: 'null'
          description: That run's status, in the words of GET /runs; pending while it waits in the
            run queue.
        late:
          type: boolean
          description: late_since is further back than the schedule's grace (60 seconds, or half the
            interval of a schedule more frequent than every two minutes) plus its queue wait (the
            median wait of its newest 20 runs or, when longer, the wait of its newest tick's run).
            Never while paused. GET /state and barca status report the same value.
        late_since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: The first slot after the newest scheduler decision that has passed (RFC 3339 UTC); null
            while on time, while paused and when no tick is recorded.
        last_skipped:
          description: Last time a due tick was skipped (RFC 3339 UTC), because a run of the node
            was in flight or the job is paused; in memory only, null after a restart
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        skipped_for:
          description: The in-flight run that caused last_skipped; null for a paused job
          anyOf:
          - *id003
          - type: 'null'
        skip_reason:
          anyOf:
          - type: string
            enum:
            - in_flight
            - paused
          - type: 'null'
        paused:
          type: boolean
          description: Held back by POST /schedule/{id}/pause; kept across a restart.
        paused_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: When the pause ends (RFC 3339 UTC); null when paused until resumed, or not
            paused.
        failures:
          description: Consecutive failed ticks (RFC-0008); persisted across restarts
          type: integer
          minimum: 0
        max_failures:
          description: Schedule(..., max_failures=N), default 5
          type: integer
          minimum: 1
        failing:
          description: failures >= max_failures; ticks are skipped until an explicit request
            or an input change
          type: boolean
    LogStream:
      description: Which of a step's streams a recorded line came from. stderr holds Python logging, warnings,
        writes to sys.stderr and the traceback of each failed attempt
      type: string
      enum:
      - stdout
      - stderr
    Log:
      description: A recorded entry. Multiline stderr writes and failed-attempt tracebacks retain embedded newlines in line; stdout remains line-oriented.
      type: object
      additionalProperties: false
      required:
      - node_id
      - seq
      - line
      - stream
      - ts
      properties:
        node_id: *id003
        seq: *id054
        line: *id003
        stream:
          $ref: '#/components/schemas/LogStream'
        ts:
          description: When the line was written (RFC 3339, UTC, milliseconds); null on lines recorded
            before barca stamped them
          type:
          - string
          - 'null'
    RunLogs:
      type: object
      additionalProperties: false
      required:
      - run_id
      - status
      - logs
      properties:
        run_id: *id003
        status:
          description: The run's status as GET /runs/{run_id} reports it (running while it runs)
          type: string
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
    Logs:
      type: object
      additionalProperties: false
      required:
      - logs
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
    FirstFailure:
      type: object
      additionalProperties: false
      description: A run's first failed step.
      required:
      - node_id
      - error
      properties:
        node_id:
          type: string
          description: The step's node id, with its partition key when it has one.
        error:
          type: string
          description: ErrorType and message, the message's first line only.
    RunSummary:
      type: object
      additionalProperties: false
      required:
      - control
      - id
      - handle
      - run_id
      - command
      - files
      - target
      - status
      - started_at
      - finished_at
      - elapsed_seconds
      - steps_total
      - steps_executed
      - steps_cached
      - error
      - first_failure
      - triggered_by
      - scheduled_at
      - schedule_id
      - principal
      - trigger_reason
      - cancellation
      - line
      properties:
        control:
          $ref: '#/components/schemas/RunControl'
        id: *id003
        handle:
          anyOf:
          - *id003
          - type: 'null'
        run_id:
          anyOf:
          - *id003
          - type: 'null'
        command: *id003
        files:
          type: array
          items: *id003
        target:
          anyOf:
          - *id003
          - type: 'null'
        status:
          type: string
          description: pending, running, success, failed, cancelled, error or interrupted.
        started_at: *id003
        finished_at:
          anyOf:
          - *id003
          - type: 'null'
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        steps_total:
          anyOf:
          - *id054
          - type: 'null'
        steps_executed: *id054
        steps_cached: *id054
        steps_skipped:
          type: [integer, 'null']
          description: Executed task attempts that explicitly skipped, counted across every page.
        steps_failed:
          anyOf:
          - *id054
          - type: 'null'
          description: Recorded steps that failed, a partitioned node's keys each counted; absent
            for a run not yet recorded. Experimental.
        error:
          anyOf:
          - *id003
          - type: 'null'
        first_failure:
          anyOf:
          - $ref: '#/components/schemas/FirstFailure'
          - type: 'null'
        triggered_by: &id057
          anyOf:
          - $ref: '#/components/schemas/TriggeredBy'
          - type: 'null'
          description: Null for runs recorded before barca recorded it.
        scheduled_at: *id042
        schedule_id: *id042
        principal: &id_principal
          anyOf:
          - type: string
          - type: 'null'
          description: Who asked for the run, the project token its request was authenticated with
            (token:NAME); null without authentication. Experimental.
        trigger_reason: &id_trigger_reason
          anyOf:
          - type: string
          - type: 'null'
          description: The reason its request gave (RunRequest.reason). Experimental.
        cancellation: &id_cancellation
          anyOf:
          - $ref: '#/components/schemas/RunCancellation'
          - type: 'null'
          description: For a cancelled run, why. Experimental.
        active_steps:
          type: array
          items:
            $ref: '#/components/schemas/ActiveStep'
          description: With status=running only, the nodes the run is working on now.
        now:
          $ref: '#/components/schemas/RunNow'
        line:
          $ref: '#/components/schemas/RunLine'
    RunLine:
      type: object
      additionalProperties: false
      description: A run in the words of a list row, the line of barca history --json. Experimental.
      required: [steps, steps_detail, failure, failure_detail, target, target_count]
      properties:
        target: {type: string}
        target_count: {type: integer, minimum: 0}
        steps:
          type: string
          description: The run's steps by outcome, "7 ok · 1 failed · 0 cached", or "3 started · 0
            cached" for a run that did not finish. Steps are keys.
        steps_detail:
          type: string
          description: What steps counts, with the nodes planned and the step the run stopped at.
        failure:
          type: [string, 'null']
          description: What went wrong in one line, "stopped at orders · KeyError", or for a
            partitioned node "forecast, 7 keys failed" with the error. Null with nothing to say.
        failure_detail:
          type: [string, 'null']
          description: The same in full, the run's own error or the first failed step's node id
            and error.
    RunNow:
      type: object
      additionalProperties: false
      description: With status=running only, active_steps as a run's panel lists them. Experimental.
      required: [running, queued, keys, groups, line]
      properties:
        line:
          type: string
          description: The same in one line, as barca history --status running prints it under the
            run, "executing 3, orders, clean, report", then how many wait and the keys done. The
            first five executing nodes are named.
        running:
          type: array
          description: The nodes executing, the one furthest from done first.
          items:
            type: object
            additionalProperties: false
            required: [node_id, keys, share]
            properties:
              node_id:
                type: string
              keys:
                type: [string, 'null']
                description: '"3,120 of 5,000 keys"; null for an unpartitioned node.'
              share:
                type: [number, 'null']
                description: 0 to 1 of its keys done; null for an unpartitioned node.
        queued:
          type: integer
          minimum: 0
          description: Nodes that wait for a run slot or for their upstream steps.
        keys:
          description: Keys with a result of the partitioned nodes in flight; null when none is
            partitioned.
          anyOf:
          - type: object
            additionalProperties: false
            required: [done, total]
            properties:
              done: {type: integer, minimum: 0}
              total: {type: integer, minimum: 0}
          - type: 'null'
        groups:
          type: array
          description: The groups of the nodes in flight, busiest first. A node is counted under
            the group the rollup places it in.
          items:
            type: object
            additionalProperties: false
            required: [id, group, running, queued]
            properties:
              id:
                type: string
              group:
                type: string
                description: The group's name.
              running: {type: integer, minimum: 0}
              queued: {type: integer, minimum: 0}
    Runs:
      type: object
      additionalProperties: false
      required:
      - runs
      - total
      - truncated
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total: *id044
        truncated: *id043
        activity:
          $ref: '#/components/schemas/RunActivity'
    RunActivity:
      type: object
      additionalProperties: false
      description: The runs started in the last 24 hours that the request's filters keep, hour by
        hour, counted by the database over every recorded run of the window, the activity of barca
        history --activity --json. Experimental.
      required: [since, until, triggered_by, not_triggered_by, statuses, search, hours, total, excluded,
        summary]
      properties:
        since:
          type: string
          description: The window's start, the start of the hour 23 hours before the current one
            (RFC 3339, UTC).
        until:
          type: string
          description: The window's end, the end of the current hour, which is still filling.
        triggered_by:
          type: array
          description: The triggers counted; empty for every run, also the ones that recorded none.
          items:
            $ref: '#/components/schemas/TriggeredBy'
        not_triggered_by:
          type: array
          description: The triggers left out; a run that recorded no trigger is counted.
          items:
            $ref: '#/components/schemas/TriggeredBy'
        statuses:
          type: array
          description: The statuses counted; empty for every status.
          items:
            type: string
        search:
          type: [string, 'null']
          description: The text the runs counted hold in their run id, target or job.
        hours:
          type: array
          description: One entry per hour of UTC, oldest first, the hours without runs included.
          minItems: 24
          maxItems: 24
          items:
            $ref: '#/components/schemas/ActivityHour'
        total:
          $ref: '#/components/schemas/ActivityHour'
          description: The window as a whole; its at is since.
        excluded:
          oneOf:
          - $ref: '#/components/schemas/ActivityHour'
          - type: 'null'
          description: With not_triggered_by, the window's runs it left out and the other filters
            keep, as one entry for the window; null without it.
        summary:
          type: string
          description: The window in one line, "1,440 runs in the last 24 hours" followed by the
            not successful, the in progress, the median time and the counts by trigger that are not
            zero.
    ActivityHour:
      type: object
      additionalProperties: false
      description: The runs started in one hour.
      required: [at, until, runs, ok, not_successful, in_progress, by_status, by_trigger, median_seconds,
        failure]
      properties:
        at:
          type: string
          description: The hour's start, RFC 3339 in UTC. A reader shows it in its own zone.
        until:
          type: string
          description: The hour's end, the next one's start. since=at and until=until list its runs.
        runs: {type: integer, minimum: 0}
        ok:
          type: integer
          minimum: 0
          description: Of runs, the ones that succeeded.
        not_successful:
          type: integer
          minimum: 0
          description: Of runs, the ones that failed, errored, were cancelled or interrupted.
        in_progress:
          type: integer
          minimum: 0
          description: Of runs, the ones still running.
        by_status:
          type: object
          additionalProperties: false
          required: [pending, success, failed, cancelled, interrupted, running]
          properties:
            skipped: {type: integer, minimum: 0}
            success: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
            cancelled: {type: integer, minimum: 0}
            interrupted: {type: integer, minimum: 0}
            running: {type: integer, minimum: 0}
        by_trigger:
          type: object
          additionalProperties: false
          description: By what started the runs; unknown counts runs recorded by a barca that did
            not record it.
          required: [schedule, api, manual, client, unknown]
          properties:
            schedule: {type: integer, minimum: 0}
            api: {type: integer, minimum: 0}
            manual: {type: integer, minimum: 0}
            client: {type: integer, minimum: 0}
            unknown: {type: integer, minimum: 0}
        median_seconds:
          type: [number, 'null']
          minimum: 0
          description: The median time its finished runs took, in seconds; null when none finished.
        failure:
          oneOf:
          - type: object
            additionalProperties: false
            required: [text, runs]
            properties:
              text:
                type: string
                description: 'The first failed step and its error, as in orders, KeyError, region joined
                  by colons, with a partitioned node''s keys under its name; or how the runs ended when
                  no step failed, such as cancelled.'
              runs:
                type: integer
                minimum: 1
                description: How many of the hour's runs it is said of.
          - type: 'null'
          description: What most of its unsuccessful runs say went wrong, the latest on a tie; null
            when none ended that way.
    RunStep:
      type: object
      additionalProperties: false
      description: A step the run recorded (one it executed, or one that failed); a live run also lists
        the steps it has streamed and not recorded yet, cached ones included. Cached steps of a finished
        run recorded no row and are not listed.
      required:
      - node_id
      - status
      - elapsed_seconds
      - error
      - partition_key
      - attempts
      - run_hash
      - artifact_path
      - artifact_format
      - artifact_size_bytes
      - error_type
      - error_message
      - error_traceback
      - worker_exit
      - cpu_seconds
      - max_rss_bytes
      - rows
      - sink_seconds
      - output_tail
      properties:
        skip_reason:
          type: string
          description: Explicit task Skip reason; absent on ordinary blocked downstream steps.
        batch:
          type: [string, "null"]
          description: Run-local call id linking this key to the other keys of its batched call; null for unbatched steps.
        trace_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Experimental (0.41.0). The Datadog trace the step was sent as, 128 bits in 32 hex digits
            (what {telemetry.datadog_url}/apm/trace/{trace_id} opens). Present only for a step that ran or
            failed in a run traced with BARCA_TELEMETRY=datadog.
        span_id:
          type: string
          pattern: ^[0-9]+$
          description: Experimental (0.41.0). The step's root barca.step span id, decimal. Present with trace_id.
        node_id: *id003
        status:
          type: string
          description: success or failed; cached for a step a live run has reported.
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        error:
          anyOf:
          - *id003
          - type: 'null'
          description: 'A failed step''s error as recorded: for a Python exception, Type: message and
            the traceback''s frames.'
        partition_key:
          anyOf:
          - type: string
          - type: 'null'
          description: The partition key (k=v pairs joined by a comma) of one key of a partitioned step.
        attempts:
          anyOf:
          - type: integer
          - type: 'null'
          description: Attempts made, retries included.
        run_hash:
          anyOf:
          - type: string
          - type: 'null'
        artifact_path:
          anyOf:
          - type: string
          - type: 'null'
          description: The recorded result's path, or its artifact-store location when it was uploaded.
        artifact_format:
          anyOf:
          - type: string
          - type: 'null'
        artifact_size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          description: A failed step's exception type; WorkerError when its worker died, UploadError when
            its result could not be stored.
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: A failed step's error message alone, without its type and traceback.
        error_traceback:
          anyOf:
          - type: string
          - type: 'null'
          description: A failed step's Python traceback; barca's frames left out of a failure in the step's
            code (error_phase user_code), every frame kept for a failure in barca's own code.
        error_phase:
          anyOf:
          - type: string
            enum:
            - load_inputs
            - user_code
            - split_output
            - write_output
            - sink
          - type: 'null'
          description: Where a failed step failed, as its worker reported it. user_code is the step's own
            code; the others are barca's own work around it. null for a step that did not fail, a worker
            that died, or a row recorded before this field existed.
        worker_exit:
          anyOf:
          - type: string
          - type: 'null'
          description: How a dead worker ended (SIGKILL (possibly the OOM killer), another signal, code N,
            disconnected); null for a step that raised.
        cpu_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: CPU seconds the step used (the worker process's user and system time).
        max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The worker process's peak RSS while the step ran, in bytes; null for a failed step,
            a row from an older barca or a platform that cannot tell.
        rows:
          type: [integer, "null"]
          description: Rows the result holds, as its worker counted them (a frame's length or a parquet footer); null when not counted.
        sink_seconds:
          type: [number, "null"]
          minimum: 0
          description: Seconds the step spent writing its sinks after its own work (0.45.0); not part of
            elapsed_seconds. null for a step without sinks, a failed step or a row from an older barca.
        output_tail:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: A failed step's last lines of output (at most 20, stdout and stderr in order, without
            the traceback); null for a step that did not fail.
    RunFailure:
      type: object
      additionalProperties: false
      description: A run's first failed step and the first line of its error.
      required:
      - node
      - error
      properties:
        node:
          type: string
          description: The step's node id, with its partition key when it has one.
        error:
          type: string
          description: 'ErrorType: message, the first line of the message only.'
    RunEvent:
      oneOf:
      - type: object
        additionalProperties: false
        required: [type, node_id, skip_reason, elapsed_seconds]
        properties:
          type: {const: step_skipped}
          node_id: {type: string}
          skip_reason: {type: string}
          elapsed_seconds: {type: number}
      - type: object
        additionalProperties: false
        required:
        - type
        - run_id
        properties:
          type:
            const: run_started
          run_id: *id003
      - type: object
        additionalProperties: false
        required:
        - type
        - line
        - when
        properties:
          type:
            const: line
          line: *id005
          when:
            type: string
            enum:
            - agent
            - always
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        - line
        properties:
          type:
            const: log
          node_id: *id003
          line: *id003
          stream:
            $ref: '#/components/schemas/LogStream'
          ts:
            description: When the worker wrote the line (RFC 3339, UTC, milliseconds). Absent only
              from events recorded by an older server
            type: string
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        - ok
        properties:
          type:
            const: step_finished
          node_id: *id003
          ok: *id043
          elapsed_seconds: *id045
          import_seconds:
            type: number
            exclusiveMinimum: 1
          error: *id003
          cached:
            const: true
            description: Served from cache; absent otherwise.
      - type: object
        additionalProperties: false
        required:
        - type
        - run_id
        - ok
        properties:
          type:
            const: run_finished
          run_id: *id003
          ok: *id043
          outcome:
            $ref: '#/components/schemas/Outcome'
    GcRequest:
      description: barca gc's flags
      type: object
      additionalProperties: false
      properties:
        max_size:
          description: 'A limit for this pass in place of the configured one, as --max-size: 20GB, 500MB,
            20GiB, bytes, 10% (of the filesystem) or off (only leftovers and superseded results)'
          anyOf:
          - type: string
          - type: 'null'
        dry_run:
          description: Report what would be evicted and delete nothing
          type: boolean
          default: false
        env:
          description: 'Evict only this environment''s results (leftovers are shared), as --env. It must be
            the environment the server serves. Without it every environment of the project is considered.'
          anyOf:
          - type: string
          - type: 'null'
    GcResult:
      description: The result of barca gc (barca gc --json)
      type: object
      additionalProperties: false
      required: [dry_run, size_bytes, budget_before_bytes, budget_after_bytes, backup_bytes, limit_bytes,
        target_bytes, after_bytes, evicted_files, evicted_bytes, tiers, restricted, evicted, failed, held]
      properties:
        dry_run: {type: boolean}
        size_bytes: {type: integer, minimum: 0, description: Bytes under .barca/ before}
        budget_before_bytes: {type: integer, minimum: 0, description: Bytes subject to the cache limit before (metadata backups excluded)}
        budget_after_bytes: {type: integer, minimum: 0}
        backup_bytes: {type: integer, minimum: 0, description: Metadata backups, outside the limit}
        limit_bytes:
          description: The limit; null when it is off
          anyOf: [{type: integer, minimum: 0}, {type: 'null'}]
        target_bytes:
          description: What eviction aims for, 80% of the limit; null when it is off
          anyOf: [{type: integer, minimum: 0}, {type: 'null'}]
        after_bytes: {type: integer, minimum: 0, description: Bytes under .barca/ after}
        evicted_files: {type: integer, minimum: 0}
        evicted_bytes: {type: integer, minimum: 0}
        tiers:
          description: Files and bytes per tier evicted, in eviction order
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tier, files, bytes]
            properties:
              tier: {type: string, enum: [leftovers, superseded, store_held, current]}
              files: {type: integer, minimum: 0}
              bytes: {type: integer, minimum: 0}
        restricted:
          description: Why only leftovers and superseded results were considered (a run in progress); null otherwise
          anyOf: [{type: string}, {type: 'null'}]
        evicted:
          description: Every entry, in eviction order, with paths relative to the project root
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tier, path, bytes]
            properties:
              tier: {type: string, enum: [leftovers, superseded, store_held, current]}
              path: {type: string}
              bytes: {type: integer, minimum: 0}
              node: {type: string, description: The node a result belongs to; absent for a leftover}
        failed:
          description: Entries that could not be deleted
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, error]
            properties:
              path: {type: string}
              error: {type: string}
        held:
          description: What holds the space left, largest first
          type: array
          items:
            type: object
            additionalProperties: false
            required: [what, bytes, evictable]
            properties:
              what: {type: string, enum: [results, unreferenced, metadata, db_copies, backups, other]}
              bytes: {type: integer, minimum: 0}
              evictable: {type: boolean}
    ResetResult:
      type: object
      additionalProperties: false
      required:
      - database
      - moved_to
      - moved
      - undo
      properties:
        database:
          description: The metadata database, now a new empty one
          type: string
        moved_to:
          description: Where the database it replaced was moved (<db>.reset-<UTC>); null when there was
            none
          anyOf:
          - type: string
          - type: 'null'
        moved:
          description: Every file moved, the database first, then its -wal and -shm when they were there
          type: array
          items:
            type: string
        undo:
          description: The command that puts the moved database back, with barca serve stopped; null when
            nothing was moved
          anyOf:
          - type: string
          - type: 'null'
    PauseResult:
      description: The job's GET /schedule entry, or, when the scheduler has not published it (scheduling
        is off or starting), what the pause is.
      anyOf:
      - $ref: '#/components/schemas/Job'
      - type: object
        additionalProperties: false
        required:
        - id
        - paused
        - paused_until
        properties:
          id: *id005
          paused: &id059
            type: boolean
          paused_until:
            anyOf:
            - type: string
              format: date-time
            - type: 'null'
    TriggeredBy:
      type: string
      enum:
      - schedule
      - api
      - client
      - manual
      description: 'What started a run: a cron tick, an HTTP request, a laptop posting to the ledger,
        or a command typed on a machine.'
    BatchExecution:
      type: object
      additionalProperties: false
      description: A real run of a node whose keys ran in batched calls, summed over the calls that
        wrote at least one key. The phases of parallel calls overlap. Experimental.
      required: [calls, keys, import_seconds, load_seconds, compute_seconds, split_seconds, write_seconds]
      properties:
        calls:
          type: integer
          minimum: 0
        keys:
          type: integer
          minimum: 0
        import_seconds:
          type: number
        load_seconds:
          type: number
        compute_seconds:
          type: number
        split_seconds:
          type: number
        write_seconds:
          type: number
    BatchPlan:
      type: object
      additionalProperties: false
      required: [grouping, keys, calls]
      properties:
        grouping:
          type: string
        keys:
          type: integer
          minimum: 0
        calls:
          type: [integer, "null"]
          minimum: 0
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - command
      description: The flags of barca get / barca run.
      properties:
        command:
          type: string
          enum:
          - get
          - run
        targets:
          type: array
          items: *id005
          description: As given on the command line; [] means every asset and sensor (get only).
        files:
          type: array
          items: *id005
          description: Deployed files, as typed relative to the root; the run reads only these, as `barca get <target> <files>` does. [] means the deployed set.
        refresh:
          type: array
          items: *id005
          description: "--refresh; asset names or keyed selectors such as source[account=A]. Array entries select a set without narrowing the target domain."
        include_manual:
          type: boolean
          default: false
          description: Bring Manual assets up to date and run Manual upstream tasks too, retaining current cached results. Paused inputs stay held.
        refresh_all:
          type: boolean
          description: --refresh-all; recompute the whole cone regardless of the cache, including Manual nodes. Paused inputs and pinned assets stay held.
        cascade:
          type: boolean
          default: true
          description: false is --no-cascade
        dry_run:
          type: boolean
          description: Answer at once with the --dry-run JSON; nothing starts.
        agent:
          type: boolean
          description: Which stderr lines the client prints. Every line is streamed, tagged with when.
        values:
          type: boolean
          description: get -o value. The outcome's final_output holds the values, read on the server as
            barca get -o value --json prints them, instead of the artifact pointers.
        batch:
          type: array
          items:
            type: string
          description: Repeatable --batch overrides (all, none, N or NODE=VALUE). Only nodes declaring batch= are affected.
        partition:
          type: string
          description: --partition of get or run, as the flag takes it (region=emea,amer, or a JSON object
            for compound keys, or a JSON array of exact key objects). It narrows every partitioned node of the run with a named dimension;
            400 when it does not parse.
        allow_paused:
          type: boolean
          description: --allow-paused. Run a target that is paused (POST /pauses); without it a request
            naming a paused node is 400. Experimental.
        queue:
          $ref: '#/components/schemas/QueuePlace'
          description: --queue. Where the run joins the run queue; next when absent. last puts it
            behind every waiting run, scheduled ones included, and orders it with scheduled work.
            Any other value is 400. Experimental.
        reason:
          type: string
          maxLength: 500
          description: Why the caller asks for the run, in one line of at most 500 characters (trimmed;
            a control character is 400). Recorded with the run as its trigger_reason. Experimental.
    RunPlanReasons:
      type: object
      additionalProperties: false
      required: [nodes, steps, reasons, omitted]
      description: Why a run executed what it did instead of serving it from cache, by reason, recorded as
        each phase of the run was decided (a run in progress has the phases decided so far). Experimental.
      properties:
        nodes:
          type: integer
          minimum: 0
          description: The nodes the run decided to execute.
        steps:
          type: integer
          minimum: 0
          description: The steps it decided to execute, a partitioned node's keys each counted.
        reasons:
          type: array
          maxItems: 64
          description: By (category, subject), most steps first. A step with several changed components
            counts under each.
          items:
            $ref: '#/components/schemas/RunPlanReason'
        omitted:
          type: integer
          minimum: 0
          description: How many (category, subject) entries were left out of reasons.
    RunPlanReason:
      type: object
      additionalProperties: false
      required: [category, subject, nodes, steps, example]
      properties:
        category:
          type: string
          enum: [never_run, new_keys, failed, code_changed, inputs_changed, env_changed, changed, refresh,
            refresh_cascade, refresh_all, artifact_missing, evicted, task, sensor, not_examined]
          description: 'never_run: no success ever recorded; new_keys: keys of a partitioned node that never
            succeeded while others did; failed: the last attempt at this run hash failed; code_changed,
            inputs_changed, env_changed: what changed since the last success (subject: the component, as
            barca status words it); changed: the run hash differs and the last success recorded no
            components; refresh, refresh_cascade (subject: the refreshed node), refresh_all; artifact_missing
            and evicted: a valid result whose artifact is gone; task and sensor always run; not_examined: no
            cache hit and not looked up (a server ledger answered, or more than 10,000 keys of one node in a
            phase).'
        subject:
          anyOf:
          - type: string
          - type: 'null'
        nodes:
          type: integer
          minimum: 0
        steps:
          type: integer
          minimum: 0
        example:
          type: string
          description: The first node executed for this reason.
    RunCancellation:
      type: object
      additionalProperties: false
      required: [by, principal, started, waiting_behind, same_as]
      description: Why a cancelled run was cancelled. Experimental.
      properties:
        by:
          type: string
          enum: [request, shutdown]
          description: 'request: DELETE /runs/{run_id} (the UI''s Cancel, a --server client''s first stop
            signal); shutdown: the server stopped.'
        principal:
          anyOf:
          - type: string
          - type: 'null'
          description: The token the cancel request was authenticated with (token:NAME).
        started:
          type: boolean
          description: False for a run cancelled while it waited in the queue; it executed nothing.
        waiting_behind:
          type: array
          maxItems: 10
          items:
            type: string
          description: For a run cancelled before it started, the runs executing then.
        same_as:
          anyOf:
          - type: string
          - type: 'null'
          description: Of those, one with the same command, targets and files.
    Explain:
      type: object
      required:
      - steps
      - summary
      description: The barca get --dry-run --json / barca run --dry-run --json body.
      properties:
        partition_selection:
          $ref: '#/components/schemas/PartitionSelection'
        capacity:
          type: integer
          minimum: 0
          description: The most the weight= of the steps running at once may add up to (#436). Experimental.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepReport'
        summary:
          type: object
    Outcome:
      description: 'A finished run, tagged by status. success: the exact barca get --json / barca run
        --json body. failed: the failed-run stdout body plus envelope. cancelled and failures before execution: envelope only.'
      oneOf:
      - type: object
        required:
        - status
        - run_id
        - elapsed_seconds
        - steps_executed
        - phases
        - steps
        - warnings
        properties:
          status:
            enum: [success, skipped]
          run_id: *id005
          elapsed_seconds:
            type: number
          steps_executed: &id056
            type: integer
          phases: *id056
          metadata_seconds:
            type: number
            description: Coordinator seconds spent recording results, when the run made a batched
              call. Experimental.
          final_output:
            description: 'Single target: the value, or an artifact pointer for binary formats. A
              partitioned target: an object keyed by partition key; past 1000 keys with no partition
              selection, {"_barca_partitions": {keys, computed, cached, outputs, truncated, hint}},
              where outputs holds only the keys the run computed (at most 1000).'
          partition_selection:
            $ref: '#/components/schemas/PartitionSelection'
          targets:
            type: object
            description: 'Several targets: each target by name, in the order given.'
          steps:
            type: array
            items:
              $ref: '#/components/schemas/StepReport'
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/PlanWarning'
        not:
          required:
          - envelope
      - type: object
        required:
        - status
        - envelope
        properties:
          status:
            const: failed
          run_id: *id005
          failed_node: *id005
          error: *id005
          steps:
            type: array
            items:
              $ref: '#/components/schemas/StepReport'
          envelope:
            $ref: '#/components/schemas/Error'
      - type: object
        additionalProperties: false
        required:
        - status
        - envelope
        properties:
          status:
            enum:
            - cancelled
          envelope:
            $ref: '#/components/schemas/Error'
    RunExplanation:
      type: object
      additionalProperties: false
      required: [targets, target_line, counts, outputs, requested_by, attempts, steps, target_outcomes, cancellation, why, progress, slowest]
      description: The run in words, derived from what it recorded (plan_reasons, cancellation, its
        counters and steps_page.nodes) by the code that prints barca history RUN_ID, whose --json has
        the same object. The wording may change; parse the recorded fields. Experimental.
      properties:
        worker_failures:
          type: array
          description: Original worker-fatal errors and their retry outcome, at most 64 affected steps and 8 KiB per error. Shortened errors carry a diagnostic truncated marker. Not exhaustive at the limit; independent failures remain in ordinary step outcomes. Absent when none were recorded.
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [node_id, first_error, retry_error, recovered]
            properties:
              node_id: {type: string}
              first_error: {type: string}
              retry_error: {type: [string, 'null']}
              recovered: {type: boolean}

        target_line: {type: string}
        counts:
          type: object
          additionalProperties: false
          required: [steps, ran, ok, failed, cached, not_reached, nodes, not_reached_nodes, attempts, retries, outcome, planned, units, not_reached_line, attempts_line]
          properties:
            steps: {type: integer}
            ran: {type: integer}
            ok: {type: integer}
            failed: {type: integer}
            skipped: {type: integer}
            cached: {type: integer}
            not_reached: {type: integer}
            nodes: {type: [integer, 'null']}
            not_reached_nodes: {type: [integer, 'null']}
            attempts: {type: [integer, 'null']}
            retries: {type: [integer, 'null']}
            outcome: {type: string}
            planned: {type: string}
            units: {type: string}
            not_reached_line: {type: [string, 'null']}
            attempts_line: {type: [string, 'null']}
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [node_id, line, format, path, rows, size_bytes, keys]
            properties:
              node_id: {type: string}
              line: {type: string}
              format: {type: [string, 'null']}
              path: {type: [string, 'null']}
              rows: {type: [integer, 'null']}
              size_bytes: {type: [integer, 'null']}
              keys: {type: [integer, 'null']}
        targets:
          type: array
          description: The run's targets, one each; its job's node ids, else the targets as given. Empty
            for a run of every asset.
          items:
            type: string
        requested_by:
          type: string
          description: What started the run and, when the server knows, who (api · token:ci-bot).
        attempts:
          type: [string, 'null']
          description: Steps tried, with retries counted apart from each step's first attempt (29 steps,
            no retries); null before the run recorded an attempt.
        steps:
          type: string
          description: The run's steps by outcome (7 ok · 1 failed · 2 skipped · 0 cached), or what a run
            that did not finish started.
        target_outcomes:
          type: array
          description: What became of each target, one line each; empty for a run of every asset or when
            the run's plan could not be rebuilt.
          items:
            type: string
        cancellation:
          anyOf:
          - type: object
            additionalProperties: false
            required: [headline, detail, run]
            properties:
              headline:
                type: string
              detail:
                type: [string, 'null']
              run:
                type: [string, 'null']
                description: A run to open; the one doing the same work, else the first it waited behind.
          - type: 'null'
          description: For a cancelled run, why, in words.
        why:
          type: object
          additionalProperties: false
          required: [headline, groups, omitted, partial]
          description: Why the run executed what it did; its steps grouped by the reason they ran.
          properties:
            headline:
              type: string
              description: The run's steps and its largest three reasons; with no groups, what there is to
                say instead (Every step was served from cache.).
            groups:
              type: array
              description: By reason category, most steps first.
              items:
                type: object
                additionalProperties: false
                required: [category, label, steps, rows]
                properties:
                  category:
                    type: string
                    description: A category of plan_reasons.
                  label:
                    type: string
                  steps:
                    type: integer
                    minimum: 0
                    description: The steps executed for it, at most the run's; a step with several changed
                      components counts under each, so groups can add up to more.
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [subject, counts, nodes, steps, share, example, example_text, line]
                      properties:
                        subject:
                          type: [string, 'null']
                          description: What changed, without the word the category says; null when the
                            category says it all.
                        counts:
                          type: string
                          description: What was counted; nodes when each ran one step (27 nodes), else steps
                            of nodes (5,000 steps of 1 node).
                        nodes:
                          type: integer
                          minimum: 0
                        steps:
                          type: integer
                          minimum: 0
                        share:
                          type: number
                          minimum: 0
                          maximum: 1
                          description: Its share of the steps the run decided to execute.
                        example:
                          type: string
                          description: The first node executed for it, a full node id.
                        example_text:
                          type: string
                          description: That node's name, after e.g. when it is one of several.
                        line:
                          type: string
                          description: The row in one line, as barca history RUN_ID prints it.
            omitted:
              type: integer
              minimum: 0
            partial:
              type: boolean
              description: The run is still deciding phases; these are the reasons so far.
        progress:
          anyOf:
          - type: object
            additionalProperties: false
            required: [done, total, percent, executed, cached, eta_seconds, eta]
            properties:
              done:
                type: integer
                minimum: 0
              total:
                type: [integer, 'null']
                minimum: 0
              percent:
                type: [integer, 'null']
                minimum: 0
                maximum: 100
              executed:
                type: integer
                minimum: 0
              cached:
                type: integer
                minimum: 0
              eta_seconds:
                type: [number, 'null']
                description: Seconds left at the rate the run has executed steps so far; null when it
                  cannot be told yet.
              eta:
                type: [string, 'null']
                description: eta_seconds in words (about 4m left).
          - type: 'null'
          description: For a run in progress, how far it is; null otherwise. Cached decisions count
            immediately after each phase is decided; totals count expanded steps/keys, not nodes.
            Artifact recovery can lower cached counts before recomputation; restart starts a new count.
        slowest:
          type: array
          maxItems: 5
          description: The nodes that took longest, slowest first.
          items:
            type: object
            additionalProperties: false
            required: [node_id, seconds, keys]
            properties:
              node_id:
                type: string
              seconds:
                type: number
                description: Summed over its keys, which may have overlapped.
              keys:
                type: integer
                minimum: 0
    RunControl:
      type: object
      additionalProperties: false
      required: [cancellable, owner, reason]
      description: Cancellation authority of the answering server, independent of write permissions.
      properties:
        cancellable:
          type: boolean
          description: True only for a pending or running run held by this server. Recorded PIDs never grant authority.
        owner:
          type: string
          description: Human-readable owner, this server, a recorded process and host, or unknown. Descriptive only.
        reason:
          type: [string, 'null']
          description: Why cancellation is unavailable, including where to stop or reconcile an unowned run; null when cancellable.
    ReplayRequest:
      type: object
      additionalProperties: false
      properties:
        cache: {type: string, enum: [original, cached, refresh_all], default: original}
        step: {type: [string, 'null'], default: null}
    RunScope:
      type: object
      additionalProperties: false
      required: [command, targets, files, refresh, refresh_all, cascade, partition, batch,
        pin_manual, hold_paused, allow_paused_targets, tick, values, timeout, queue]
      properties:
        command: {type: string, enum: [get, run]}
        targets: {type: array, items: {type: string}}
        files: {type: array, items: {type: string}}
        refresh: {type: array, items: {type: string}}
        refresh_all: {type: boolean}
        cascade: {type: boolean}
        partition: {type: [string, 'null'], description: Canonical JSON partition selection}
        batch: {type: array, items: {type: string}}
        pin_manual: {type: boolean}
        hold_paused: {type: boolean}
        allow_paused_targets: {type: boolean}
        tick: {type: [string, 'null']}
        values: {type: boolean}
        timeout: {type: [integer, 'null'], minimum: 0}
        queue: {type: string, enum: [next, last]}
    RunView:
      type: object
      additionalProperties: false
      description: One run. A finished run is read from the metadata DB, so the answer is the same after
        a restart.
      required:
      - scope
      - control
      - run_id
      - status
      - command
      - target
      - files
      - triggered_by
      - scheduled_at
      - schedule_id
      - started_at
      - finished_at
      - elapsed_seconds
      - steps_total
      - steps_executed
      - steps_cached
      - job
      - attempts
      - client_run_id
      - failure
      - principal
      - trigger_reason
      - retries
      - plan_reasons
      - cancellation
      - waiting_for
      - explanation
      - outcome
      - error
      - steps
      - steps_page
      - logs
      properties:
        scope:
          description: Original execution scope; null for older history or an unstarted run.
          anyOf:
          - {$ref: '#/components/schemas/RunScope'}
          - {type: 'null'}
        control:
          $ref: '#/components/schemas/RunControl'
        skip_reason:
          type: string
          description: The common explicit reason of an all-skipped run; absent when reasons differ.
        previous_attempts:
          type: array
          description: Stopped executions of this accepted request, oldest first; absent when none.
          items:
            type: object
            additionalProperties: false
            required: [run_id, attempt, stop_reason]
            properties:
              run_id:
                type: string
              attempt:
                type: integer
                minimum: 1
              stop_reason:
                type: string
        parent_run_id:
          type: string
          description: Original request id, present only on an archived execution.
        run_attempt:
          type: integer
          minimum: 1
        stop_reason:
          type: string
        run_id: *id005
        status:
          type: string
          enum:
          - pending
          - running
          - success
          - skipped
          - failed
          - cancelled
          - interrupted
        command: *id005
        target: *id042
        files:
          type: array
          items: *id005
        triggered_by: *id057
        scheduled_at:
          anyOf:
          - *id005
          - type: 'null'
          description: 'For a scheduled run: the tick, RFC 3339 UTC.'
        schedule_id:
          anyOf:
          - *id005
          - type: 'null'
          description: 'For a scheduled run: the scheduled node.'
        started_at: *id005
        finished_at: *id042
        elapsed_seconds: &id060
          anyOf:
          - type: number
          - type: 'null'
        steps_total: &id058
          anyOf:
          - type: integer
          - type: 'null'
        steps_executed: *id056
        steps_cached: *id056
        job:
          anyOf:
          - type: string
          - type: 'null'
          description: The run's job (all, or its resolved node ids sorted and comma-separated); null while
            a live run has not recorded it.
        attempts:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total recorded attempts, as barca history counts them.
        client_run_id:
          anyOf:
          - type: string
          - type: 'null'
          description: For a run a laptop posted to the ledger, its run id on that laptop.
        failure:
          anyOf:
          - $ref: '#/components/schemas/RunFailure'
          - type: 'null'
          description: The first failed step and its error; null for a run with no failed step.
        principal: *id_principal
        trigger_reason: *id_trigger_reason
        retries:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Of attempts, those that retried a step (each attempt after a step's first); null
            while the run has recorded none. Experimental.
        plan_reasons:
          anyOf:
          - $ref: '#/components/schemas/RunPlanReasons'
          - type: 'null'
          description: Why the run executed what it did; null before it decided to execute anything.
        cancellation: *id_cancellation
        waiting_for: *id_waiting_for
        queue: *id_queue_place
        explanation:
          $ref: '#/components/schemas/RunExplanation'
        outcome:
          anyOf:
          - $ref: '#/components/schemas/Outcome'
          - type: 'null'
          description: Null while the run runs, and for runs not started by barca serve.
        error: *id042
        steps:
          type: array
          description: At most ?limit=N steps (default 1000) from ?offset=M, in the page order (failed
            recorded steps first, then as recorded), every one with ?all=true. Page through the rest
            with steps_page.next_offset.
          items:
            $ref: '#/components/schemas/RunStep'
        steps_page:
          type: object
          additionalProperties: false
          required:
          - total
          - truncated
          description: How many steps the run has, and whether steps lists fewer.
          properties:
            total: *id056
            truncated: *id059
            offset:
              type: integer
              minimum: 1
              description: The position of the first step listed (?offset=); absent when 0.
            next_offset:
              type: integer
              minimum: 1
              description: Where the next page starts (?offset=); absent on the last page.
            nodes:
              type: array
              description: Per node over every recorded step, listed or not. For a finished run
                whose plan the server can rebuild from today's sources, every planned node in plan
                order, each with a status, the cached and skipped ones with no steps included;
                otherwise the nodes with recorded steps, failed nodes first, and absent when no
                node has more than one step. Experimental.
              items:
                type: object
                additionalProperties: false
                required: [node_id, keys, failed, elapsed_seconds, calls]
                properties:
                  node_id: *id003
                  keys: *id056
                  failed: *id056
                  skipped: *id056
                  elapsed_seconds:
                    type: number
                  calls: *id056
                  status:
                    type: string
                    enum: [ran, cached, skipped]
                    description: What became of the node in this run; present when the server
                      rebuilt the run's plan. A skipped node never ran because a node upstream of
                      it failed (blocked_by) or because the run stopped before its phase.
                  blocked_by:
                    type: string
                    description: For a skipped node, the failed node upstream of it; absent when
                      the run stopped before reaching it.
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
    ListBody:
      type: object
      additionalProperties: false
      required:
      - nodes
      - total
      - truncated
      description: barca list --json --all.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        total: *id056
        truncated: *id059
        hint: *id005
        root: *id005
    StatusBody:
      type: object
      required:
      - nodes
      - total
      - truncated
      - disk_usage
      - data_coverage
      - as_of
      - rollup
      description: barca status --json --all for the server ledger.
      properties:
        as_of:
          type: string
          format: date-time
          description: The instant the nodes were classified at (RFC 3339, UTC); what every derived
            time and gap_seconds are as of. Experimental.
        rollup:
          $ref: '#/components/schemas/RollupEntry'
          description: The scope summed; the root entry of GET /state/rollup for the same scope,
            over every node in scope (a filter does not change it), with children empty.
            Experimental.
        data_coverage:
          type: object
          additionalProperties: false
          description: How much of the scope's data was measured, over every node in scope (a filter
            does not change it). An asset that is not measured raised no signal because nothing was
            counted. Experimental.
          required: [assets, measured, suspect]
          properties:
            assets:
              type: integer
              minimum: 0
              description: Assets in scope; tasks and sensors are not counted.
            measured:
              type: integer
              minimum: 0
              description: Assets whose latest successful result has a recorded row count.
            suspect:
              type: integer
              minimum: 0
              description: Measured assets with an empty or rows_changed signal.
        disk_usage:
          type: object
          additionalProperties: false
          description: Experimental project-wide maintained cache accounting plus bounded backup-directory measurements; no artifact walk. Byte counts are null when unmeasured. size_bytes is the physical estimate; budget_bytes excludes recognized local metadata backups. The scope includes all environments even when nodes are filtered.
          required: [size_bytes, budget_bytes, backup_bytes, limit_bytes]
          properties:
            size_bytes:
              type: [integer, 'null']
              minimum: 0
            budget_bytes:
              type: [integer, 'null']
              minimum: 0
            backup_bytes:
              type: [integer, 'null']
              minimum: 0
            limit_bytes:
              type: [integer, 'null']
              minimum: 0
            metadata_trim:
              type: array
              description: The last trim pass of each metadata database that went over its share of the cache limit. Omitted until one did. reason is busy (the pass could not get the metadata lock in 250 ms), needs_gc (an older database lacks an index the online pass needs, or the pass failed), live_run (the data is over its share and a run is running or queued, so no history was removed), nothing_eligible (the data is over its share and the pass cleared nothing), vacuum_deferred (the data fits but the file is longer, until barca gc runs VACUUM) or null (the file is within its share, or the data is over it and the pass cleared records and ran out of time, so a later pass goes on). Experimental.
              items:
                type: object
                additionalProperties: false
                required: [env, at, allowance_bytes, before_bytes, after_bytes, used_after_bytes, components, outcomes, rows, runs, longest_hold_ms, reason, run_id, detail, zero_progress_passes, next_attempt]
                properties:
                  env:
                    type: string
                  at:
                    type: string
                    format: date-time
                  allowance_bytes:
                    type: integer
                    minimum: 0
                  before_bytes:
                    type: integer
                    minimum: 0
                  after_bytes:
                    type: integer
                    minimum: 0
                  used_after_bytes:
                    type: integer
                    minimum: 0
                    description: The bytes the pages that hold data take after the pass (the file less its free pages); what a pass with a time budget measures against allowance_bytes.
                  components:
                    type: integer
                    minimum: 0
                    description: Component records cleared.
                  outcomes:
                    type: integer
                    minimum: 0
                    description: Run reports cleared.
                  rows:
                    type: integer
                    minimum: 0
                    description: Old results removed.
                  runs:
                    type: integer
                    minimum: 0
                    description: Old runs removed.
                  longest_hold_ms:
                    type: integer
                    minimum: 0
                    description: The longest hold of the metadata lock in the pass.
                  reason:
                    type: [string, 'null']
                    enum: [busy, needs_gc, live_run, nothing_eligible, vacuum_deferred, null]
                  run_id:
                    type: [string, 'null']
                    description: The run that kept history from being removed, for live_run.
                  detail:
                    type: [string, 'null']
                  zero_progress_passes:
                    type: integer
                    minimum: 0
                  next_attempt:
                    type: [string, 'null']
                    format: date-time
                    description: When the next pass may start after one that freed nothing, unless the file grows by a tenth, enough runs finish (nothing_eligible) or barca gc runs.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeStatus'
        total: *id056
        truncated: *id059
        root: *id005
        filter:
          type: object
          additionalProperties: false
          description: Present when state or problems was given.
          properties:
            states:
              type: array
              items:
                type: string
            problems:
              type: boolean
    LedgerKey:
      type: object
      additionalProperties: false
      required:
      - node_id
      - run_hash
      properties:
        node_id:
          type: string
          description: A node id, with a partition suffix for one key.
        run_hash:
          type: string
    LedgerLookup:
      type: object
      additionalProperties: false
      required:
      - hashes
      properties:
        hashes:
          type: array
          items:
            $ref: '#/components/schemas/LedgerKey'
    LedgerEntry:
      type: object
      additionalProperties: false
      required:
      - node_id
      - run_hash
      - exists
      properties:
        node_id:
          type: string
        run_hash:
          type: string
        exists:
          type: boolean
        path:
          type: string
          description: The artifact's location in the store; only when exists.
        format:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        digest:
          type: string
          description: SHA-256 of the artifact's bytes; absent for a row recorded before digests were.
    LedgerLookupResult:
      type: object
      additionalProperties: false
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
    LedgerRun:
      type: object
      required:
      - run_id
      - command
      - status
      - started_at
      properties:
        run_id:
          type: string
          description: The run id on the posting machine; recorded as client_run_id.
        command:
          type: string
        files:
          type: array
          items:
            type: string
        target:
          type:
          - string
          - 'null'
        status:
          type: string
        steps_total:
          type:
          - integer
          - 'null'
        steps_executed:
          type: integer
        steps_cached:
          type: integer
        started_at:
          type: string
        finished_at:
          type:
          - string
          - 'null'
        elapsed_seconds:
          type:
          - number
          - 'null'
        host:
          type:
          - string
          - 'null'
    LedgerStep:
      type: object
      required:
      - node_id
      - run_hash
      - status
      properties:
        node_id:
          type: string
        run_hash:
          type: string
        status:
          type: string
        path:
          type:
          - string
          - 'null'
          description: The artifact's location in the store; required for a successful step.
        format:
          type:
          - string
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        digest:
          type:
          - string
          - 'null'
          description: SHA-256 of the artifact's bytes; required for a successful step.
        observation_hash:
          type:
          - string
          - 'null'
          description: Sensor freshness revision, independent of its artifact digest.
        elapsed_seconds:
          type:
          - number
          - 'null'
        attempts:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
    LedgerPost:
      type: object
      required:
      - run
      - steps
      description: One finished run on the posting machine and its step rows.
      properties:
        run:
          $ref: '#/components/schemas/LedgerRun'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/LedgerStep'
    LedgerAccepted:
      type: object
      additionalProperties: false
      required:
      - run_id
      - bytes_changed
      properties:
        run_id:
          type: string
          description: The run id this server recorded the run under.
        bytes_changed:
          type: array
          items:
            type: string
          description: Steps whose run hash the ledger already held with another digest; it kept its row.
    HistoryRun:
      type: object
      additionalProperties: false
      required:
      - run_id
      - command
      - files
      - target
      - job
      - status
      - steps_total
      - steps_executed
      - steps_cached
      - attempts
      - started_at
      - finished_at
      - elapsed_seconds
      - triggered_by
      - scheduled_at
      - schedule_id
      - client_run_id
      - failure
      - failed_node
      - error
      - principal
      - trigger_reason
      - cancellation
      properties:
        skip_reason:
          type: string
          description: Common explicit reason of an all-skipped run; absent when reasons differ.
        previous_attempts:
          type: array
          description: Stopped executions of this accepted request, oldest first; absent when none.
          items:
            type: object
            additionalProperties: false
            required: [run_id, attempt, stop_reason]
            properties:
              run_id:
                type: string
              attempt:
                type: integer
                minimum: 1
              stop_reason:
                type: string
        parent_run_id:
          type: string
          description: Original request id, present only on an archived execution.
        run_attempt:
          type: integer
          minimum: 1
        stop_reason:
          type: string
        run_id: *id005
        command: *id005
        files:
          type: array
          items: *id005
        target: *id042
        job:
          type:
          - string
          - 'null'
          description: The run's job, all for a run without targets, otherwise its resolved node ids
            sorted and comma-separated; null for runs recorded before barca stored it.
        status: *id005
        steps_total: *id058
        steps_executed: *id056
        steps_cached: *id056
        attempts: *id058
        started_at: *id005
        finished_at: *id042
        elapsed_seconds: *id060
        triggered_by: *id057
        scheduled_at: *id042
        schedule_id: *id042
        client_run_id:
          type:
          - string
          - 'null'
          description: For a run a laptop posted to the ledger (triggered_by client), its run id on that
            laptop; null otherwise.
        failure:
          anyOf:
          - $ref: '#/components/schemas/RunFailure'
          - type: 'null'
          description: The first failed step and its error; null for a run with no failed step.
        failed_node:
          type:
          - string
          - 'null'
          description: failure.node, flat for --fields.
        error:
          type:
          - string
          - 'null'
          description: failure.error, flat for --fields.
        principal: *id_principal
        trigger_reason: *id_trigger_reason
        cancellation: *id_cancellation
        line:
          $ref: '#/components/schemas/RunLine'
          description: In a list, the run in the words of a list row. Experimental.
        now:
          $ref: '#/components/schemas/RunNow'
          description: With status=running in the filter, on a run in flight, what it is working on
            now, the now of GET /runs?status=running. Absent otherwise. Experimental.
        retries:
          type: integer
          minimum: 0
          description: For one run (barca history RUN_ID), its retries; absent in a list. Experimental.
        plan_reasons:
          $ref: '#/components/schemas/RunPlanReasons'
          description: For one run (barca history RUN_ID) that executed something, why; absent in a
            list. Experimental.
    SqlQuery:
      type: object
      additionalProperties: false
      required:
      - query
      description: The body of POST /sql/query.
      properties:
        query:
          type: string
          description: One SELECT over barca's tables (barca.runs, barca.materializations, barca.nodes, barca.schedules, barca.ticks, barca.queue; DuckDB dialect).
        limit:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Rows to answer; default 1000, at most 10000 (a larger value is lowered to it).
    SqlAnswer:
      type: object
      additionalProperties: false
      required:
      - columns
      - rows
      - total
      - truncated
      description: The answer of POST /sql/query, the document barca sql --json prints.
      properties:
        columns:
          type: array
          description: Column names, in order.
          items:
            type: string
        rows:
          type: array
          description: The first limit rows, one object per row, keyed by column.
          items:
            type: object
        total:
          type: integer
          description: How many rows the query returns in all.
        truncated:
          type: boolean
          description: True when rows holds fewer than total.
        hint:
          type: string
          description: What to send to see more; only when truncated.
        notes:
          type: array
          description: What the rows leave out (a table holding more than the 100000 rows the server
            loads of it); absent when nothing.
          items:
            type: string
    SqlCatalog:
      type: object
      additionalProperties: false
      required:
      - views
      - missing
      - duplicates
      description: Which result each barca sql view reads (GET /sql/views).
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/SqlView'
        missing:
          type: array
          description: Nodes with no queryable result, so no view.
          items:
            $ref: '#/components/schemas/SqlMissing'
        duplicates:
          type: array
          description: Names several nodes share; their views are named by node id.
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - ids
            properties:
              name:
                type: string
              ids:
                type: array
                items:
                  type: string
    SqlView:
      type: object
      additionalProperties: false
      required:
      - name
      - node
      - kind
      - partitioned
      - format
      - files
      - stale
      properties:
        name:
          type: string
          description: The view's name in SQL.
        node:
          type: string
        kind:
          enum:
          - asset
          - task
          - sensor
        partitioned:
          type: boolean
        format:
          type: string
          description: parquet, csv, json or pickle (a pickle view cannot be queried).
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - partition
            properties:
              path:
                type: string
                description: Where the result is stored (a store path).
              partition:
                type:
                - string
                - 'null'
                description: The partition key; null for an unpartitioned node.
              content_hash:
                type: string
                description: SHA-256 of the result's bytes, when recorded.
        stale:
          type: boolean
          description: The code or inputs changed since the result was computed; the view shows it.
        run_hash:
          type: string
          description: The run hash the node's code and inputs give now, when known.
    SqlMissing:
      type: object
      additionalProperties: false
      required:
      - name
      - node
      - kind
      - partitioned
      - command
      properties:
        name:
          type: string
        node:
          type: string
        kind:
          enum:
          - asset
          - task
          - sensor
        partitioned:
          type: boolean
        command:
          type: string
          description: The command that produces it (barca get NAME).
        keys_unknown:
          type: string
          description: A partitioned node whose current keys are not known until a source materializes.
        run_hash:
          type: string
    MaterializationsBody:
      type: object
      additionalProperties: false
      required:
      - materializations
      - total
      - limit
      - offset
      properties:
        materializations:
          type: array
          items:
            $ref: '#/components/schemas/StepRow'
        total:
          type: integer
          minimum: 0
          description: Rows recorded in all.
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
    StepRow:
      type: object
      additionalProperties: false
      required:
      - node_id
      - partition
      - run_id
      - run_hash
      - status
      - created_at
      - elapsed_seconds
      - cpu_seconds
      - max_rss_bytes
      - attempts
      - format
      - size_bytes
      - artifact
      - content_hash
      - error_type
      - error_message
      - rows
      description: One recorded step result (barca sql's barca.materializations).
      properties:
        node_id:
          type: string
          description: Node id, with the partition suffix for a partitioned step.
        partition:
          type:
          - string
          - 'null'
        run_id:
          type:
          - string
          - 'null'
        run_hash:
          type:
          - string
          - 'null'
        status:
          enum:
          - success
          - skipped
          - failed
        created_at:
          type: string
          description: UTC, YYYY-MM-DD HH:MM:SS.
        elapsed_seconds:
          type:
          - number
          - 'null'
        cpu_seconds:
          type:
          - number
          - 'null'
        max_rss_bytes:
          type:
          - integer
          - 'null'
        attempts:
          type:
          - integer
          - 'null'
        format:
          type:
          - string
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
        artifact:
          type:
          - string
          - 'null'
        content_hash:
          type:
          - string
          - 'null'
        error_type:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        rows:
          type:
          - integer
          - 'null'
          description: Rows the result holds, as its worker counted them; null when not counted.
    HistoryBody:
      type: object
      additionalProperties: false
      required:
      - runs
      - total
      - truncated
      description: barca history --json.
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/HistoryRun'
        total: *id056
        truncated: *id059
        hint: *id005
    Project:
      type: object
      additionalProperties: false
      required:
      - api_version
      - root
      - env
      - deployed_at
      - commit
      - files
      - telemetry
      properties:
        api_version:
          const: 1
        root: *id042
        env: *id005
        deployed_at:
          type: string
          description: When this server started, RFC 3339 UTC.
        commit:
          anyOf:
          - *id005
          - type: 'null'
          description: The commit checked out at the root; null outside a git checkout.
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - sha256
            properties:
              path: *id005
              sha256:
                type: string
                pattern: ^[0-9a-f]{64}$
        telemetry:
          type: object
          additionalProperties: false
          required:
          - datadog_url
          description: Experimental (0.41.0). What the UI links to.
          properties:
            datadog_url:
              anyOf:
              - type: string
              - type: 'null'
              description: The Datadog web app a step's trace_id opens in ({datadog_url}/apm/trace/{trace_id})
                from DD_SITE, else [telemetry] datadog_site, else https://app.datadoghq.com when BARCA_TELEMETRY=datadog;
                null otherwise.
