    post:
      summary: Start the metadata database over (the old one is moved aside, never deleted)
      operationId: post_state_reset
      description: 'Moves the metadata database and its -wal and -shm aside to <db>.reset-<UTC> in
        the same directory and creates an empty database in its place, as barca state reset does.
        Run history, cache records, partition keys and schedule pauses start over; artifacts are
        left alone. Works on a database that cannot be opened or migrated (it is moved as it is).
        Undo with barca state restore --from <moved_to> while the server is stopped. No request body.'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: What was moved and how to undo it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResult'
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A run is pending or running (this server's, or a local run's on this machine); the
            error names it and nothing was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database could not be moved aside or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The server is draining before it stops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: string
                pattern: ^[1-9][0-9]*$
              description: Seconds to wait before retrying, the server's drain timeout
                (at least 1)
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
  /gc:
    post:
      summary: Evict cached results now, as barca gc does, in the server
      operationId: post_gc
      description: 'barca gc run by the server: evict to 80% of the cache size limit ([cache] max_size, or
        max_size of the request), or with the limit off every leftover and superseded result. The eviction
        takes its turn with the server''s own writes to the metadata database, so it does not wait on the
        database lock from outside as a second process does; a barca gc typed in the server''s project is
        sent here over the project socket. What this server''s runs in flight hold is left alone, result by result; restricted is set only when another process has a run in progress on this project.
        The body is optional: without one the configured limit applies and files are deleted. An unknown
        field is refused. The answer is barca gc --json.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GcRequest'
