        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id006
        '400':
          description: Invalid request
  /nodes:
    get:
      summary: barca status --json for the ledger
      operationId: get_nodes
      responses:
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusBody'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '404':
          description: Unknown target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
