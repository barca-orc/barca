        median_max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The median of the recorded executions' peak RSS, in bytes.
        recent_runs:
          type: array
          items:
            $ref: '#/components/schemas/AssetRun'
      description: barca stats --json.
    AssetDetail:
      type: object
      additionalProperties: false
      required:
      - asset
      - stats
      - running
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        stats:
          $ref: '#/components/schemas/Stats'
        running: *id_running
    Job:
      type: object
      additionalProperties: false
      required:
      - id
      - cron
      - kind
      - next_fire
      - last_fired
      - last_run
      - last_status
      - last_skipped
      - skipped_for
      - skip_reason
      - paused
      - paused_until
      - failures
      - max_failures
      - failing
      properties:
        id: *id003
        cron: *id003
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        next_fire:
          anyOf:
          - *id054
          - type: 'null'
        last_fired:
          anyOf:
          - *id054
          - type: 'null'
        last_run:
          anyOf:
          - *id003
          - type: 'null'
        last_status:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: 'null'
        last_skipped:
          description: Last time a due tick was skipped (unix epoch seconds), because a run of the node
            was in flight or the job is paused; in memory only, null after a restart
          anyOf:
          - *id054
          - type: 'null'
        skipped_for:
          description: The in-flight run that caused last_skipped; null for a paused job
          anyOf:
          - *id003
          - type: 'null'
        skip_reason:
          anyOf:
          - type: string
            enum:
            - in_flight
            - paused
          - type: 'null'
        paused:
