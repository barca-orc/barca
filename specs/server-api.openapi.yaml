                type: string
              description: Methods accepted by this route
        '400':
          description: A step that selects no recorded execution or output, or two definitions; a
            stream that is not stdout or stderr
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
      description: 'What `barca logs` reads: the lines a run''s steps wrote to stdout and stderr, in the
        order they arrived. A run in progress answers with its lines so far (GET /runs/{run_id}/events
        streams them as they arrive). A run records at most 16 MiB of line text; past that a marker line
        says so. Accepts a durable run id or a retained live handle.'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
