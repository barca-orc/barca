          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandle'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id003
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target or terminal run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema: *id003
              description: Methods accepted by this route
      description: 'Bodyless trigger. Target may be a bare function name or full node ID. This catch-all
        path accepts embedded slashes (encoded or unencoded). Deprecated alias of POST /runs {"command":
        "run"} and DELETE /runs/{run_id}, kept for one minor release; run_id is the database run id.'
