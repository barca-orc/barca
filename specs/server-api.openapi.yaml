        run_hash: *id003
        artifact: *id003
        warning: *id003
        artifact_mismatch: *id043
        bytes_changed:
          type: boolean
          const: true
        elapsed_seconds:
          type: number
          minimum: 0
        attempts:
          type: integer
          minimum: 1
        import_seconds:
          type: number
          exclusiveMinimum: 1
        partitions:
          $ref: '#/components/schemas/PartitionSummary'
        env:
          type: object
          additionalProperties:
            anyOf:
            - *id003
            - type: 'null'
        weight:
          type: integer
          minimum: 2
          description: Dry run only, the node's weight= when above 1 (#436). Experimental.
    ArtifactReference:
      type: object
      additionalProperties: false
      required:
      - path
      - format
      - size_bytes
      properties:
        path: *id003
        format: *id003
        size_bytes: *id044
        elapsed_seconds: &id045
          type: number
    Result:
      type: object
      additionalProperties: false
      required:
      - run_id
      - elapsed_seconds
      - steps_executed
      - phases
      - final_output
      - steps
      - warnings
      properties:
        run_id: *id003
        elapsed_seconds: *id045
        steps_executed: *id044
        phases: *id044
        final_output:
          anyOf:
          - $ref: '#/components/schemas/ArtifactReference'
