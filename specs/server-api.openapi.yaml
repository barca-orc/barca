        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: *id001
    head:
      summary: List organizational groups (headers only)
      operationId: head_groups
      responses:
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id001
