# Normative shipped HTTP boundary; update this document and conformance in the same PR.
openapi: 3.1.0
info:
  title: Barca current HTTP API
  version: '1'
  description: 'Normative current wire contract; specification version 1 is independent
    of package versions. Scope: registered barca-server routes and fallback responses.
    No authentication is implemented (security is empty); read-only is an operating
    mode. No proposed RFC command routes, authorization, freshness eligibility or
    partition retrieval API are advertised. Conformance: crates/barca-server/tests/openapi.rs
    and python/tests/test_http_openapi_client.py.'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://127.0.0.1:8274
  description: Default local listener; configurable host/port, reverse proxies may
    add a prefix.
security: []
paths:
  /health:
    get:
      summary: Server liveness and operating modes
      operationId: get_health
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id001
            Allow:
              schema: &id002
                type: string
              description: Methods accepted by this route
      description: Liveness, not readiness or authentication. The API has no authentication.
        Read-only mode refuses mutating routes; it does not restrict inspection access.
        load_errors reports unloaded sources and excluded dependent definitions from
        the selected served graph. Healthy loads return an empty array; healthy
        definitions remain inspectable beside those diagnostics.
    head:
      summary: Server liveness and operating modes (headers only)
      operationId: head_health
      responses:
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id001
  /plan:
    get:
      summary: Static plan of the served DAG
      operationId: get_plan
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id003
            Allow:
              schema: *id002
              description: Methods accepted by this route
    head:
      summary: Static plan of the served DAG (headers only)
      operationId: head_plan
      responses:
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id003
  /assets:
    get:
      summary: List assets, tasks and sensors
      operationId: get_assets
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id004
            Allow:
              schema: *id002
              description: Methods accepted by this route
    head:
      summary: List assets, tasks and sensors (headers only)
      operationId: head_assets
      responses:
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id004
  /assets/{name}:
    get:
      summary: Node summary and materialization statistics
      operationId: get_assets_name
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target or terminal run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id005
            Allow:
              schema: *id002
              description: Methods accepted by this route
      parameters: &id006
      - name: name
        in: path
        required: true
        schema: *id002
    head:
      summary: Node summary and materialization statistics (headers only)
      operationId: head_assets_name
      responses:
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '404':
          description: Resource not found
        '409':
          description: Ambiguous target or terminal run
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id005
      parameters: *id006
  /assets/{name}/schema:
    get:
      summary: Inspect selected node and direct input artifacts
      operationId: get_assets_name_schema
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeStatus'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target or terminal run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id007
            Allow:
              schema: *id002
              description: Methods accepted by this route
      parameters: &id008
      - name: name
        in: path
        required: true
        schema: *id002
    head:
      summary: Inspect selected node and direct input artifacts (headers only)
      operationId: head_assets_name_schema
      responses:
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '404':
          description: Resource not found
        '409':
          description: Ambiguous target or terminal run
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id007
      parameters: *id008
  /state:
    get:
      summary: Node cache state, durations and next scheduled execution
      operationId: get_state
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeState'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id009
            Allow:
              schema: *id002
              description: Methods accepted by this route
    head:
      summary: Node cache state, durations and next scheduled execution (headers only)
      operationId: head_state
      responses:
        '200':
          description: Response
        '400':
          description: Invalid source/target or wrong node kind
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id009
  /schedule:
    get:
      summary: Scheduler job registry
      operationId: get_schedule
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id010
            Allow:
              schema: *id002
              description: Methods accepted by this route
    head:
      summary: Scheduler job registry (headers only)
      operationId: head_schedule
      responses:
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id010
  /run:
    post:
      summary: Materialize every asset and sensor
      operationId: post_run
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandle'
        '400':
          description: No loaded assets or sensors, or source files changed during loading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Source-loading infrastructure error before run admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema: *id002
              description: Methods accepted by this route
      description: Bodyless trigger; tasks are skipped. Returns HTTP 200 immediately
        with a volatile polling handle for the healthy selected graph. An entirely
        unloaded graph or a graph containing only tasks returns 400; inspect /health
        load_errors for source diagnostics. There is no POST /runs command endpoint.
  /run/{target}:
    post:
      summary: Run one task and refresh its upstream assets
      operationId: post_run_target
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandle'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target or terminal run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema: *id002
              description: Methods accepted by this route
      description: Bodyless trigger. Target may be a bare function name or full node
        ID. This catch-all path accepts embedded slashes (encoded or unencoded).
      parameters:
      - name: target
        in: path
        required: true
        schema: *id002
    delete:
      summary: Cancel an in-flight run by polling handle
      operationId: delete_run_target
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target or terminal run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema: *id002
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
      description: Here target is the polling handle, not a node name. Returns cancelling
        immediately; poll /status for cancelled. A terminal run returns 409; a durable
        ID without a retained handle cannot be cancelled.
      parameters:
      - name: target
        in: path
        required: true
        schema: *id002
  /get/{target}:
    post:
      summary: Materialize one asset or sensor
      operationId: post_get_target
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandle'
        '400':
          description: Invalid source/target or wrong node kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target or terminal run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema: *id002
              description: Methods accepted by this route
      description: Bodyless trigger. Same catch-all target encoding as POST /run/{target};
        tasks are rejected.
      parameters:
      - name: target
        in: path
        required: true
        schema: *id002
  /status/{run_id}:
    get:
      summary: Poll a retained live run handle
      operationId: get_status_run_id
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunState'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id011
            Allow:
              schema: *id002
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
      description: Pending/running/complete/failed/cancelled. Run handles expire and
        do not survive restart. No fallback to durable history; use /runs/{id} for
        durable inspection.
      parameters: &id012
      - name: run_id
        in: path
        required: true
        schema: *id002
    head:
      summary: Poll a retained live run handle (headers only)
      operationId: head_status_run_id
      responses:
        '200':
          description: Response
        '404':
          description: Resource not found
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id011
        '400':
          description: Invalid request
      parameters: *id012
  /runs:
    get:
      summary: List durable history joined with retained live runs
      operationId: get_runs
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runs'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id013
            Allow:
              schema: *id002
              description: Methods accepted by this route
        '400':
          description: Axum query extractor rejects malformed/non-unsigned limits
          content:
            text/plain:
              schema: *id002
      description: Newest first, all pipelines in this local environment. No source
        filter. Snapshot inspection does not create/migrate the database. Limit defaults
        to 100 and is clamped to 1–1000.
      parameters: &id014
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Unsigned integer; zero and values above 1000 are accepted and
          clamped.
    head:
      summary: List durable history joined with retained live runs (headers only)
      operationId: head_runs
      responses:
        '200':
          description: Response
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id013
        '400':
          description: Malformed limit
      parameters: *id014
  /runs/{id}:
    get:
      summary: Inspect durable ID or retained live handle
      operationId: get_runs_id
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id015
            Allow:
              schema: *id002
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
      description: Durable steps and logs survive restart. Engine result/final output
        and cached per-step reports are available only while the live handle is retained,
        then result is null. Inspection uses a private DB snapshot.
      parameters: &id016
      - name: id
        in: path
        required: true
        schema: *id002
    head:
      summary: Inspect durable ID or retained live handle (headers only)
      operationId: head_runs_id
      responses:
        '200':
          description: Response
        '404':
          description: Resource not found
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id015
        '400':
          description: Invalid request
      parameters: *id016
  /logs/{run_id}:
    get:
      summary: Read persisted output lines
      operationId: get_logs_run_id
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logs'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id017
            Allow:
              schema: *id002
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
      description: Accepts a retained live handle or a durable DB ID. Unknown IDs
        return an empty logs array with HTTP 200. Live lines not yet persisted are
        available through events or run details.
      parameters: &id018
      - name: run_id
        in: path
        required: true
        schema: *id002
    head:
      summary: Read persisted output lines (headers only)
      operationId: head_logs_run_id
      responses:
        '200':
          description: Response
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id017
        '400':
          description: Invalid request
      parameters: *id018
  /events/{run_id}:
    get:
      summary: Stream lifecycle and log events for a retained handle
      operationId: get_events_run_id
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            X-Accel-Buffering:
              schema:
                const: 'no'
            Cache-Control:
              schema: *id002
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id019
            Allow:
              schema: *id002
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id002
      description: SSE data frames contain RunEvent JSON (x-event-schema). Backlog
        then live delivery; no event names/IDs. Keepalive comments every 15 seconds.
        Handle-only, no durable replay after restart.
      parameters: &id020
      - name: run_id
        in: path
        required: true
        schema: *id002
      x-event-schema:
        $ref: '#/components/schemas/RunEvent'
    head:
      summary: Stream lifecycle and log events for a retained handle (headers only)
      operationId: head_events_run_id
      responses:
        '200':
          description: Response
        '404':
          description: Resource not found
        '405':
          description: Registered path with unsupported method; Allow header identifies
            supported methods
          headers: *id019
        '400':
          description: Invalid request
      parameters: *id020
  /:
    get:
      summary: Redirect to UI
      operationId: get_root_redirect
      responses:
        '303':
          description: Redirect
          headers: &id021
            Location:
              schema:
                const: ui/
        '405':
          description: Unsupported method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Relative Location preserves reverse proxy prefixes.
    head:
      summary: Redirect to UI (headers only)
      operationId: head_root_redirect
      responses:
        '303':
          description: Redirect
          headers: *id021
        '405':
          description: Unsupported method
  /ui:
    get:
      summary: Redirect to UI
      operationId: get_ui_redirect
      responses:
        '303':
          description: Redirect
          headers: &id022
            Location:
              schema:
                const: ui/
        '405':
          description: Unsupported method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Relative Location preserves reverse proxy prefixes.
    head:
      summary: Redirect to UI (headers only)
      operationId: head_ui_redirect
      responses:
        '303':
          description: Redirect
          headers: *id022
        '405':
          description: Unsupported method
  /ui/:
    get:
      summary: Embedded UI document or static asset
      operationId: get_ui_index
      responses:
        '200':
          description: Embedded UI content
          headers:
            Cache-Control:
              schema: *id002
          content:
            text/html:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
            text/css:
