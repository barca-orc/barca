# Normative shipped HTTP boundary; update this document and conformance in the same PR.
openapi: 3.1.0
info:
  title: Barca current HTTP API
  version: '12'
  description: 'Normative current wire contract; specification version 12 is independent of package versions.
    Scope: registered barca-server routes and fallback responses. No authentication is implemented (security
    is empty); read-only is an operating mode. The run contract and inspection routes of RFC-0007 section
    3.4 are shipped (POST /runs, GET /runs/{run_id}, its events, output, logs and cancel; /list, /nodes, /history,
    /stats/{name}, /project), the barca sql reads (GET /sql/views, GET /materializations; the server runs no SQL), and so are its ledger routes (POST /ledger/lookup, POST /ledger/runs) and POST /state/reset, and the durable run queue (GET /queue, POST /queue/pause, POST /queue/resume: every accepted run is recorded before it is answered and resumed in order after a restart). GET /state, GET /assets/{name} and GET /runs?status=running report the runs working on each node now. Every error body is the CLI error
    envelope. Every GET of an inspection route answers with an ETag (a digest of its body) and Cache-Control: no-cache; a request whose If-None-Match names it gets 304 Not Modified and no body. Routes marked deprecated are aliases kept for one minor release. Conformance: crates/barca-server/tests/openapi.rs
    and python/tests/test_http_openapi_client.py.'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://127.0.0.1:8274
  description: Default local listener; configurable host/port, reverse proxies may add a prefix.
security: []
paths:
  /health:
    get:
      summary: Server liveness and operating modes
      operationId: get_health
      responses:
        '200':
          description: Response
          headers: &id_etag
            ETag:
              description: A digest of the body. Send it back as If-None-Match to get 304 Not Modified, and no body, while the body is unchanged.
              schema:
                type: string
                pattern: ^"[0-9a-f]{24}"$
            Cache-Control:
              description: A client may keep the body, and asks again each time (with If-None-Match).
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id001
            Allow:
              schema: &id003
                type: string
              description: Methods accepted by this route
      description: Liveness, not readiness or authentication. The API has no authentication.
        status is draining from the first SIGTERM or SIGINT until the server exits; the
        response stays 200. started_at changes when the server restarts (a client following a run
        tells a restart by it); queue counts the runs waiting and running. Read-only mode refuses mutating routes; it does not restrict inspection access.
        load_errors reports unloaded sources and excluded dependent definitions from
        the selected served graph. Healthy loads return an empty array; healthy
        definitions remain inspectable beside those diagnostics. scheduler_enabled is
        false when the scheduler does not run or stopped on an error; metadata_error says why
        the metadata DB cannot be used, while it cannot.
    head:
      summary: Server liveness and operating modes (headers only)
      operationId: head_health
      responses:
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id001
