              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id005
      description: Newest first. Without limit, every run, as barca history --json prints without -l.
        The filters combine with AND; total and truncated count the runs they keep, and limit applies
        after them. An unknown filter value is a 400.
      parameters: &id010
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: all
        in: query
        required: false
        schema: *id005
        description: 'Any value but 0 or false: every run.'
      - name: status
        in: query
        required: false
        schema: *id005
        description: 'barca history --status: comma-separated, any of success, failed, cancelled, error,
          running, interrupted.'
      - name: target
        in: query
        required: false
        schema: *id005
        description: 'barca history --target: runs whose target or job names this node (a function name
          or node id).'
      - name: triggered_by
