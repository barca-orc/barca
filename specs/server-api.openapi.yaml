        '200':
          description: Embedded UI content
          headers:
            Cache-Control:
              schema: *id003
          content:
            text/html:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
            application/json:
              schema: {}
            font/woff2:
              schema:
                type: string
                format: binary
            font/woff:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id040
            Allow:
              schema: *id003
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id003
        '404':
          description: 'Missing index: plain text explanation; missing other asset: empty body'
          content:
            text/plain:
              schema: *id003
      description: 'No UI build in the binary: /ui/ returns explanatory text with 404. Missing static
        assets return empty 404. Fingerprinted assets use immutable one-year caching; other resources
        use no-cache.'
      parameters: &id041
      - name: path
        in: path
        required: true
        schema: *id003
    head:
      summary: Embedded UI document or static asset (headers only)
      operationId: head_ui_path
      responses:
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id040
        '400':
          description: Invalid request
        '404':
          description: UI not embedded or asset missing
      parameters: *id041
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      description: 'The CLI stderr error envelope (barca docs contract). HTTP status follows kind: usage
        400 (404 not found, 409 ambiguous or conflicting with a run, 403 read-only), infra 500.'
      required:
      - error
      - code
      - kind
      - remediation
      properties:
        error: *id005
        code:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 130
        kind:
          type: string
          enum:
          - step_failed
          - usage
          - infra
          - cancelled
        remediation: &id042
          anyOf:
          - type: string
          - type: 'null'
        node: *id042
        traceback: *id042
        artifact_dir: *id042
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - version
      - read_only
      - scheduler
      - load_errors
      - api_version
      - env
      - store_uri
      properties:
        status:
          const: ok
        version: *id003
        read_only: &id043
          type: boolean
        scheduler: *id043
        load_errors:
          type: array
          items:
            $ref: '#/components/schemas/LoadError'
        api_version:
          const: 1
          description: Major version of this API; a client refuses another.
        env: *id005
        store_uri:
          anyOf:
          - *id005
          - type: 'null'
          description: The artifact store this server writes to; null when artifacts stay on its machine.
    LoadError:
      type: object
      additionalProperties: false
      required:
      - file
      - error
      - affected_nodes
      properties:
        file: *id003
        error: *id003
        affected_nodes:
          type: array
          items: *id003
    RunHandle:
      type: object
      additionalProperties: false
      required:
      - run_id
      properties:
        run_id: *id003
      description: run_id is the database run id, the one barca history shows.
    Cancellation:
      type: object
      additionalProperties: false
      required:
      - run_id
      - status
      properties:
        run_id: *id003
        status:
          const: cancelling
    RunStatus:
      type: string
      enum:
      - pending
      - running
      - complete
      - failed
      - cancelled
    NodeGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - members
      - output
      properties:
        id: *id003
        name: *id003
        description: *id003
        members:
          type: array
          items: *id003
        output: *id003
    Asset:
      type: object
      additionalProperties: false
      description: One node as barca list --json shows it.
      required:
      - id
      - kind
      - freshness
      - inputs
      - env
      properties:
        id: *id005
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        freshness:
          type: string
          enum:
          - always
          - manual
          - schedule
        schedule:
          type: string
          description: The cron expression of a scheduled node.
        next_fire:
          type: string
          description: A scheduled node's next fire time in the server machine's local time.
        inputs:
          type: array
          items: *id005
        env:
          type: array
          items: *id005
    PlanWarning:
      type: object
      additionalProperties: false
      required:
      - kind
      - node
      - param
      - message
      properties:
        kind: *id003
        node: *id003
        param: *id003
        message: *id003
    PlanReason:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: initial
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        properties:
          type:
            const: fan_in
          node_id: *id003
    PlanStream:
      type: object
      additionalProperties: false
      required:
      - stream_id
      - steps
      properties:
        stream_id: *id003
        steps:
          type: array
          items: *id003
    PlanPhase:
      type: object
      additionalProperties: false
      required:
      - reason
      - streams
      properties:
        reason:
          $ref: '#/components/schemas/PlanReason'
        streams:
          type: array
          items:
            $ref: '#/components/schemas/PlanStream'
    Plan:
      type: object
      additionalProperties: false
      required:
      - plan_version
      - total_steps
      - phases
      - warnings
      properties:
        plan_version:
          type: integer
          const: 1
          description: Plan document format version, independent of the package, database and worker protocol
            versions.
        total_steps: &id044
          type: integer
          minimum: 0
        phases:
          type: array
          items:
            $ref: '#/components/schemas/PlanPhase'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanWarning'
    PartitionSummary:
      type: object
      additionalProperties: false
      required:
      - total
      - cached
      - will_run
      - will_run_keys
      properties:
        total: *id044
        cached: *id044
        will_run: *id044
        will_run_keys:
          type: array
          items: *id003
          maxItems: 20
    StepReport:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      properties:
        id: *id003
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        action: *id003
        status: *id003
        reason: *id003
        detail: *id003
        run_hash: *id003
        artifact: *id003
        warning: *id003
        artifact_mismatch: *id043
        bytes_changed:
          type: boolean
          const: true
        elapsed_seconds:
          type: number
          minimum: 0
        attempts:
          type: integer
          minimum: 1
        import_seconds:
          type: number
          exclusiveMinimum: 1
        partitions:
          $ref: '#/components/schemas/PartitionSummary'
        env:
          type: object
          additionalProperties:
            anyOf:
            - *id003
            - type: 'null'
    ArtifactReference:
      type: object
      additionalProperties: false
      required:
      - path
      - format
      - size_bytes
      properties:
        path: *id003
        format: *id003
        size_bytes: *id044
        elapsed_seconds: &id045
          type: number
    Result:
      type: object
      additionalProperties: false
      required:
      - run_id
      - elapsed_seconds
      - steps_executed
      - phases
      - final_output
      - steps
      - warnings
      properties:
        run_id: *id003
        elapsed_seconds: *id045
        steps_executed: *id044
        phases: *id044
        final_output:
          anyOf:
          - $ref: '#/components/schemas/ArtifactReference'
          - type: 'null'
          description: Null or an artifact reference, not the CLI inline JSON rendering. This endpoint
            does not define a partition retrieval API.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepReport'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanWarning'
    RunState:
      type: object
      additionalProperties: false
      required:
      - handle
      - status
      - result
      - error
      - started_at
      - finished_at
      properties:
        handle: *id003
        status:
          $ref: '#/components/schemas/RunStatus'
        result:
          anyOf:
          - $ref: '#/components/schemas/Result'
          - type: 'null'
        error:
          anyOf:
          - *id003
          - type: 'null'
        started_at: *id045
        finished_at:
          anyOf:
          - *id045
          - type: 'null'
    Cache:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      - detail
      properties:
        state:
          type: string
          enum:
          - cached
          - stale
          - never_run
          - partial
          - unknown
          - always_runs
        reason:
          type: string
          enum:
          - materialized
          - changed
          - upstream_stale
          - failed
          - artifact_missing
          - no_record
          - partitions_missing
          - partitions_unknown
          - sensor_output_unknown
          - task
          - sensor
        detail: *id003
        run_hash: *id003
        artifact: *id003
    PartitionState:
      type: object
      additionalProperties: false
      required:
      - total
      - cached
      - missing
      - missing_keys
      properties:
        total: *id044
        cached: *id044
        missing: *id044
        missing_keys:
          type: array
          items: *id003
          maxItems: 20
    Materialization:
      type: object
      additionalProperties: false
      required:
      - status
      - created_at
      - elapsed_seconds
      - run_hash
      - artifact
      - format
      - size_bytes
      properties:
        status: *id003
        created_at: *id003
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        run_hash: &id046
          anyOf:
          - *id003
          - type: 'null'
        artifact: *id046
        format: *id046
        size_bytes:
          anyOf:
          - &id054
            type: integer
          - type: 'null'
        partition: *id003
        error: *id003
        content_hash: *id003
    BytesChange:
      type: object
      additionalProperties: false
      required:
      - node_id
      - run_hash
      - content_hash
      - created_at
      properties:
        node_id: *id003
        run_hash: *id003
        content_hash: *id003
        created_at: *id003
    NodeStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - inputs
      - partitioned
      - cache
      - last_materialization
      - shape
      - env
      properties:
        id: *id003
        name:
          type: string
          description: The declared name, or function name when no explicit name is set.
        kind: &id047
          type: string
          enum:
          - asset
          - task
          - sensor
        inputs: &id048
          type: array
          items: *id003
        partitioned: *id043
        cache: &id049
          $ref: '#/components/schemas/Cache'
        partitions: &id050
          $ref: '#/components/schemas/PartitionState'
        last_bytes_change:
          $ref: '#/components/schemas/BytesChange'
        last_materialization: &id051
          anyOf:
          - $ref: '#/components/schemas/Materialization'
          - type: 'null'
        shape: &id052
          description: Null or the artifact inspector shape; user JSON types and keys remain unconstrained.
        env: &id053
          type: array
          items: *id003
    Durations:
      type: object
      additionalProperties: false
      required:
      - median_seconds
      - p95_seconds
      - samples
      properties:
        median_seconds: *id045
        p95_seconds: *id045
        samples: *id044
    NodeState:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - inputs
      - partitioned
      - cache
      - last_materialization
      - shape
      - env
      - durations
      - next_run
      properties:
        id: *id003
        name:
          type: string
          description: The declared name, or function name when no explicit name is set.
        kind: *id047
        inputs: *id048
        partitioned: *id043
        cache: *id049
        partitions: *id050
        last_materialization: *id051
        shape: *id052
        env: *id053
        durations:
          anyOf:
          - $ref: '#/components/schemas/Durations'
          - type: 'null'
        next_run:
          anyOf:
          - *id054
          - type: 'null'
    AssetRun:
      type: object
      additionalProperties: false
      required:
      - elapsed_seconds
      - status
      - created_at
      - error_message
      - attempts
      properties:
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        status: *id003
        created_at: *id003
        error_message:
          anyOf:
          - *id003
          - type: 'null'
        attempts: *id054
    Stats:
      type: object
      additionalProperties: false
      required:
      - id
      - total_runs
      - avg_elapsed_seconds
      - median_elapsed_seconds
      - max_elapsed_seconds
      - p95_elapsed_seconds
      - cache_hit_rate
      - recent_runs
      properties:
        id: *id003
        total_runs: *id054
        avg_elapsed_seconds: &id055
          anyOf:
          - *id045
          - type: 'null'
        median_elapsed_seconds: *id055
        max_elapsed_seconds: *id055
        p95_elapsed_seconds: *id055
        cache_hit_rate: *id045
        recent_runs:
          type: array
          items:
            $ref: '#/components/schemas/AssetRun'
      description: barca stats --json.
    AssetDetail:
      type: object
      additionalProperties: false
      required:
      - asset
      - stats
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        stats:
          $ref: '#/components/schemas/Stats'
    Job:
      type: object
      additionalProperties: false
      required:
      - id
      - cron
      - kind
      - next_fire
      - last_fired
      - last_run
      - last_status
      - last_skipped
      - skipped_for
      - skip_reason
      - paused
      - paused_until
      properties:
        id: *id003
        cron: *id003
        kind:
          type: string
          enum:
          - asset
          - task
          - sensor
        next_fire:
          anyOf:
          - *id054
          - type: 'null'
        last_fired:
          anyOf:
          - *id054
          - type: 'null'
        last_run:
          anyOf:
          - *id003
          - type: 'null'
        last_status:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: 'null'
        last_skipped:
          description: Last time a due tick was skipped (unix epoch seconds), because a run of the node
            was in flight or the job is paused; in memory only, null after a restart
          anyOf:
          - *id054
          - type: 'null'
        skipped_for:
          description: The in-flight run that caused last_skipped; null for a paused job
          anyOf:
          - *id003
          - type: 'null'
        skip_reason:
          anyOf:
          - type: string
            enum:
            - in_flight
            - paused
          - type: 'null'
        paused:
          type: boolean
          description: Held back by POST /schedule/{id}/pause; kept across a restart.
        paused_until:
          anyOf:
          - &id056
            type: integer
          - type: 'null'
          description: When the pause ends (unix epoch seconds); null when paused until resumed, or not
            paused.
    Log:
      type: object
      additionalProperties: false
      required:
      - node_id
      - seq
      - line
      properties:
        node_id: *id003
        seq: *id054
        line: *id003
    Logs:
      type: object
      additionalProperties: false
      required:
      - logs
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
    RunSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - handle
      - run_id
      - command
      - files
      - target
      - status
      - started_at
      - finished_at
      - elapsed_seconds
      - steps_total
      - steps_executed
      - steps_cached
      - error
      - triggered_by
      - scheduled_at
      - schedule_id
      properties:
        id: *id003
        handle:
          anyOf:
          - *id003
          - type: 'null'
        run_id:
          anyOf:
          - *id003
          - type: 'null'
        command: *id003
        files:
          type: array
          items: *id003
        target:
          anyOf:
          - *id003
          - type: 'null'
        status:
          type: string
          description: pending, running, success, failed, cancelled, error or interrupted.
        started_at: *id003
        finished_at:
          anyOf:
          - *id003
          - type: 'null'
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        steps_total:
          anyOf:
          - *id054
          - type: 'null'
        steps_executed: *id054
        steps_cached: *id054
        error:
          anyOf:
          - *id003
          - type: 'null'
        triggered_by: &id057
          anyOf:
          - $ref: '#/components/schemas/TriggeredBy'
          - type: 'null'
          description: Null for runs recorded before barca recorded it.
        scheduled_at: *id042
        schedule_id: *id042
    Runs:
      type: object
      additionalProperties: false
      required:
      - runs
      - total
      - truncated
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total: *id044
        truncated: *id043
    RunStep:
      type: object
      additionalProperties: false
      required:
      - node_id
      - status
      - elapsed_seconds
      - error
      properties:
        node_id: *id003
        status: *id003
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        error:
          anyOf:
          - *id003
          - type: 'null'
    RunEvent:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - run_id
        properties:
          type:
            const: run_started
          run_id: *id003
      - type: object
        additionalProperties: false
        required:
        - type
        - line
        - when
        properties:
          type:
            const: line
          line: *id005
          when:
            type: string
            enum:
            - agent
            - always
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        - line
        properties:
          type:
            const: log
          node_id: *id003
          line: *id003
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        - ok
        properties:
          type:
            const: step_finished
          node_id: *id003
          ok: *id043
          elapsed_seconds: *id045
          import_seconds:
            type: number
            exclusiveMinimum: 1
          error: *id003
          cached:
            const: true
            description: Served from cache; absent otherwise.
      - type: object
        additionalProperties: false
        required:
        - type
        - run_id
        - ok
        properties:
          type:
            const: run_finished
          run_id: *id003
          ok: *id043
          outcome:
            $ref: '#/components/schemas/Outcome'
    PauseResult:
      description: The job's GET /schedule entry, or, when the scheduler has not published it (scheduling
        is off or starting), what the pause is.
      anyOf:
      - $ref: '#/components/schemas/Job'
      - type: object
        additionalProperties: false
        required:
        - id
        - paused
        - paused_until
        properties:
          id: *id005
          paused: &id059
            type: boolean
          paused_until: &id058
            anyOf:
            - type: integer
            - type: 'null'
    TriggeredBy:
      type: string
      enum:
      - schedule
      - api
      - client
      - manual
      description: 'What started a run: a cron tick, an HTTP request, a laptop posting to the ledger,
        or a command typed on a machine.'
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - command
      description: The flags of barca get / barca run.
      properties:
        command:
          type: string
          enum:
          - get
          - run
        targets:
          type: array
          items: *id005
          description: As given on the command line; [] means every asset and sensor (get only).
        files:
          type: array
          items: *id005
          description: Deployed files, as typed relative to the root; [] means the deployed set.
        refresh:
          type: array
          items: *id005
          description: --refresh
        refresh_all:
          type: boolean
          description: --refresh-all
        cascade:
          type: boolean
          default: true
          description: false is --no-cascade
        dry_run:
          type: boolean
          description: Answer at once with the --dry-run JSON; nothing starts.
        agent:
          type: boolean
          description: Which stderr lines the client prints. Every line is streamed, tagged with when.
    Explain:
      type: object
      required:
      - steps
      - summary
      description: The barca get --dry-run --json / barca run --dry-run --json body.
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepReport'
        summary:
          type: object
    Outcome:
      description: 'A finished run, tagged by status. success: the exact barca get --json / barca run
        --json body. failed: the failed-run stdout body plus envelope. cancelled and error: envelope only.'
      oneOf:
      - type: object
        required:
        - status
        - run_id
        - elapsed_seconds
        - steps_executed
        - phases
        - steps
        - warnings
        properties:
          status:
            const: success
          run_id: *id005
          elapsed_seconds:
            type: number
          steps_executed: *id056
          phases: *id056
          final_output:
            description: 'Single target: the value, or an artifact pointer for binary formats.'
          targets:
            type: object
            description: 'Several targets: each target by name, in the order given.'
          steps:
            type: array
            items:
              $ref: '#/components/schemas/StepReport'
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/PlanWarning'
        not:
          required:
          - envelope
      - type: object
        required:
        - status
        - envelope
        properties:
          status:
            const: failed
          run_id: *id005
          failed_node: *id005
          error: *id005
          steps:
            type: array
            items:
              $ref: '#/components/schemas/StepReport'
          envelope:
            $ref: '#/components/schemas/Error'
      - type: object
        additionalProperties: false
        required:
        - status
        - envelope
        properties:
          status:
            enum:
            - cancelled
            - error
          envelope:
            $ref: '#/components/schemas/Error'
    RunView:
      type: object
      additionalProperties: false
      description: One run. A finished run is read from the metadata DB, so the answer is the same after
        a restart.
      required:
      - run_id
      - status
      - command
      - target
      - files
      - triggered_by
      - scheduled_at
      - schedule_id
      - started_at
      - finished_at
      - elapsed_seconds
      - steps_total
      - steps_executed
