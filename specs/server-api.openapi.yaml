                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Source-loading infrastructure error before the run starts, or the run
            could not be recorded in the run queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
      description: 'The command runs here with the deployed code, as barca get / barca run would. Targets
        are checked first: no run starts for a request the CLI would refuse. A failed step is not an HTTP
        error: it is a run whose outcome is failed. The run joins the run queue (GET /queue), recorded in
        the metadata DB before the answer: it starts in order when fewer than max_runs run, the queue
        is not paused and the server is not draining. A draining server accepts it too (status pending):
        the next server resumes it under the same run id.'
  /runs/{run_id}:
    get:
      summary: One run, with its outcome once finished
      operationId: get_runs_run_id
      responses:
        '200':
          description: Response
          headers: *id_etag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '304':
          description: Not modified; the body is the one whose ETag the request's If-None-Match names. No body.
          headers: *id_etag
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution/inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id025
            Allow:
              schema: *id003
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id003
      description: Answers from the metadata DB once the run has finished, so a restart does not lose
        it; a live run is pending or running until it has recorded its outcome. Inspection uses a private
        DB snapshot. barca history RUN_ID --server reads it.
      parameters: &id026
      - name: run_id
        in: path
        required: true
        schema:
          type: string
        description: The database run id.
    head:
      summary: One run, with its outcome once finished (headers only)
      operationId: head_runs_run_id
      responses:
        '200':
          description: Response
        '404':
          description: Resource not found
        '500':
          description: Execution/inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id025
        '400':
          description: Invalid request
      parameters: *id026
    delete:
      summary: Cancel a pending or running run
      operationId: delete_runs_run_id
      responses:
        '200':
          description: Cancelling; the stream ends with a cancelled outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The run already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
  /runs/{run_id}/events:
    get:
      summary: Stream a run's events
      operationId: get_runs_run_id_events
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
          headers: &id028
            X-Accel-Buffering:
              schema:
                const: 'no'
            Cache-Control:
              schema: &id027
                type: string
        '404':
          description: The run is not live on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id029
            Allow:
              schema: *id027
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id027
      description: 'Server-sent events; each data frame is RunEvent JSON (x-event-schema) and each has
        an id: its number in the run, from 0. A subscriber receives the run from its first event, every
        event once however slowly it reads; the stream ends after run_finished. Keepalive comments every
        15 seconds. 404 once the run is no longer live on this server (GET /runs/{run_id} answers then).
        A connection dropped mid-run is not resumed (Last-Event-ID is future work); the run goes on.'
      parameters: &id030
      - name: run_id
        in: path
        required: true
        schema: *id027
      x-event-schema:
        $ref: '#/components/schemas/RunEvent'
    head:
      summary: Stream a run's events (headers only)
      operationId: head_runs_run_id_events
      responses:
        '200':
          description: Server-Sent Events stream
          headers: *id028
        '404':
          description: The run is not live on this server
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id029
        '400':
          description: Invalid request
      parameters: *id030
  /runs/{run_id}/output:
