        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
      description: It fires again from its next tick; ticks skipped while paused are not caught up. Resuming
        a job that is not paused changes nothing.
      parameters:
      - *id020
  /run:
    post:
      summary: Materialize every asset and sensor
      operationId: post_run
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandle'
        '400':
          description: No loaded assets or sensors, or source files changed during loading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Source-loading infrastructure error before run admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema: *id003
              description: Methods accepted by this route
      description: 'Bodyless trigger; tasks are skipped. Returns HTTP 200 immediately with the run id
        for the healthy selected graph. An entirely unloaded graph or a graph containing only tasks returns
        400; inspect /health load_errors for source diagnostics. Deprecated alias of POST /runs {"command":
        "get"}, kept for one minor release.'
      deprecated: true
  /run/{target}:
    post:
      summary: Run one task and refresh its upstream assets
      operationId: post_run_target
      responses:
        '200':
