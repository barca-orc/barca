          anyOf:
          - *id045
          - type: 'null'
        max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The worker process's peak RSS while the step ran, in bytes; null when not recorded.
    Stats:
      type: object
      additionalProperties: false
      required:
      - id
      - total_runs
      - avg_elapsed_seconds
      - median_elapsed_seconds
      - max_elapsed_seconds
      - p95_elapsed_seconds
      - cache_hit_rate
      - max_rss_bytes
      - median_max_rss_bytes
      - recent_runs
      properties:
        id: *id003
        total_runs: *id054
        avg_elapsed_seconds: &id055
          anyOf:
          - *id045
          - type: 'null'
        median_elapsed_seconds: *id055
        max_elapsed_seconds: *id055
        p95_elapsed_seconds: *id055
        cache_hit_rate: *id045
        max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
