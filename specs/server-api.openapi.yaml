components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      description: 'The CLI stderr error envelope (barca docs contract). HTTP status follows kind: usage
        400 (404 not found, 409 ambiguous or conflicting with a run, 403 read-only), infra 500.'
      required:
      - error
      - code
      - kind
      - remediation
      properties:
        error: *id005
        code:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 130
        kind:
          type: string
          enum:
          - step_failed
          - usage
          - infra
          - cancelled
        remediation: &id042
          anyOf:
          - type: string
          - type: 'null'
        node: *id042
        traceback: *id042
        artifact_dir: *id042
        reason:
          description: A stable name for an error a client may handle on its own, present
            only when barca has one. metadata_unusable means the metadata DB is there but this
            barca cannot use it (empty, not SQLite, a newer format or a malformed schema); the
            error names the file and the remediation says what to do.
          type: string
          enum:
          - metadata_unusable
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - version
      - read_only
      - scheduler
      - load_errors
      - api_version
      - env
      - store_uri
      - scheduler_enabled
      - metadata_error
      - started_at
      - queue
      properties:
        started_at:
          type: string
          description: When this server process started, RFC 3339 UTC with milliseconds.
        queue:
          $ref: '#/components/schemas/QueueHealth'
        status:
          description: ok, or draining once the server was told to stop (SIGTERM or
            SIGINT); a draining server starts no queued run, queues new runs for the next
            start and finishes the runs in flight
          enum:
          - ok
          - draining
        version:
          type: string
        read_only: &id043
          type: boolean
        scheduler: *id043
        scheduler_enabled:
          type: boolean
          description: Whether the scheduler is running. scheduler (configured on, not
            --no-schedule or --read-only), and false once the scheduler stopped on an error.
        metadata_error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the metadata DB cannot be used, while it cannot; null otherwise. A
            writer whose database cannot be set up at startup exits 3 instead of serving; a
            read-only server keeps serving and reports it here until a read succeeds again.
        load_errors:
          type: array
          items:
            $ref: '#/components/schemas/LoadError'
        api_version:
          const: 1
          description: Major version of this API; a client refuses another.
        env: *id005
        store_uri:
          anyOf:
          - *id005
          - type: 'null'
          description: The artifact store this server writes to; null when artifacts stay on its machine.
        cache:
          description: Null until the server has measured .barca/, and when [cache] max_size
            is off or the server is read-only.
          anyOf:
          - $ref: '#/components/schemas/CacheSize'
          - type: 'null'
    LoadError:
      type: object
      additionalProperties: false
      required:
      - file
      - error
      - affected_nodes
      properties:
        file: *id003
        error: *id003
        affected_nodes:
          type: array
          items: *id003
    QueueHealth:
      type: object
      additionalProperties: false
      required:
      - paused
      - queued
      - running
      - max_runs
      properties:
        paused:
          type: boolean
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        max_runs:
          type: integer
          minimum: 1
    RunAccepted:
      type: object
      additionalProperties: false
      required:
      - run_id
      - status
      - position
      properties:
        run_id:
          type: string
          description: The database run id, the one barca history shows.
        status:
          description: pending when it waits in the queue, running when it started at once.
          enum:
          - pending
          - running
        position:
          description: Its place among the queued runs (1 = next); null when it is running.
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
    QueueEntry:
      type: object
      additionalProperties: false
      required:
      - run_id
      - status
      - position
      - command
      - target
      - triggered_by
      - schedule_id
      - queued_at
      properties:
        run_id:
          type: string
        status:
          enum:
          - pending
          - running
        position:
          description: Its place among the queued runs (1 = next); null for a running run.
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        command:
          enum:
          - get
          - run
        target:
          description: The targets as given, comma-separated; null for every asset and sensor.
          anyOf:
          - type: string
          - type: 'null'
        triggered_by:
          $ref: '#/components/schemas/TriggeredBy'
        schedule_id:
