                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: *id005
      description: Built by the function barca status --json uses, against a private snapshot of the metadata
        DB. A scheduled node's schedule is the running scheduler's view (GET /schedule), or with no
        scheduler what the metadata DB holds (live false). state and problems keep only the matching
        nodes, as barca status --state and --problems do; summary still counts every node, and filter
        names the filter. An unknown state is 400.
      parameters: &id008
      - name: targets
        in: query
        required: false
        schema: *id005
        description: 'Comma-separated targets; absent: every node.'
      - name: sample
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: --sample N
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated cache states (--state): cached, unsynced, stale, never_run, partial,
          unknown, always_runs.'
      - name: problems
        in: query
        required: false
        schema:
          type: string
        description: '--problems: 1 or true keeps the nodes that need attention (every state but cached
          and always_runs, a task or sensor whose last run failed, a paused or failing schedule).'
    head:
      summary: barca status --json for the ledger (headers only)
      operationId: head_nodes
      responses:
        '200':
          description: Response
        '404':
          description: Unknown target
        '409':
          description: Ambiguous target
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id007
        '400':
