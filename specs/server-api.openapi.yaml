        description: 'Any value but 0 or false: every run.'
    head:
      summary: barca history --json (headers only)
      operationId: head_history
      responses:
        '200':
          description: Response
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id009
        '400':
          description: Invalid request
      parameters: *id010
