          - *id054
          - type: 'null'
        steps_executed: *id054
        steps_cached: *id054
        error:
          anyOf:
          - *id003
          - type: 'null'
        triggered_by: &id057
          anyOf:
          - $ref: '#/components/schemas/TriggeredBy'
          - type: 'null'
          description: Null for runs recorded before barca recorded it.
        scheduled_at: *id042
        schedule_id: *id042
        active_steps:
          type: array
          items:
            $ref: '#/components/schemas/ActiveStep'
          description: With status=running only, the nodes the run is working on now.
    Runs:
      type: object
      additionalProperties: false
      required:
      - runs
      - total
      - truncated
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total: *id044
        truncated: *id043
    RunStep:
      type: object
      additionalProperties: false
      description: A step the run recorded (one it executed, or one that failed); a live run also lists
        the steps it has streamed and not recorded yet, cached ones included. Cached steps of a finished
        run recorded no row and are not listed.
      required:
      - node_id
      - status
      - elapsed_seconds
      - error
      - partition_key
      - attempts
      - run_hash
      - artifact_path
      - artifact_format
      - artifact_size_bytes
      - error_type
      - error_message
      - error_traceback
      - worker_exit
      - cpu_seconds
      - max_rss_bytes
      - output_tail
      properties:
        node_id: *id003
        status:
          type: string
          description: success or failed; cached for a step a live run has reported.
        elapsed_seconds:
          anyOf:
          - *id045
          - type: 'null'
        error:
          anyOf:
          - *id003
          - type: 'null'
          description: 'A failed step''s error as recorded: for a Python exception, Type: message and
            the traceback''s frames.'
        partition_key:
          anyOf:
          - type: string
          - type: 'null'
          description: The partition key (k=v pairs joined by a comma) of one key of a partitioned step.
        attempts:
          anyOf:
          - type: integer
          - type: 'null'
          description: Attempts made, retries included.
        run_hash:
          anyOf:
          - type: string
          - type: 'null'
        artifact_path:
          anyOf:
          - type: string
          - type: 'null'
          description: The recorded result's path, or its artifact-store location when it was uploaded.
        artifact_format:
          anyOf:
          - type: string
          - type: 'null'
        artifact_size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          description: A failed step's exception type; WorkerError when its worker died, UploadError when
            its result could not be stored.
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: A failed step's error message alone, without its type and traceback.
        error_traceback:
          anyOf:
          - type: string
          - type: 'null'
          description: A failed step's Python traceback, barca's frames left out.
        worker_exit:
          anyOf:
          - type: string
          - type: 'null'
          description: How a dead worker ended (SIGKILL (possibly the OOM killer), another signal, code N,
            disconnected); null for a step that raised.
        cpu_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: CPU seconds the step used (the worker process's user and system time).
        max_rss_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: The worker process's peak RSS while the step ran, in bytes; null for a failed step,
            a row from an older barca or a platform that cannot tell.
        output_tail:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: A failed step's last lines of output (at most 20, stdout and stderr in order, without
            the traceback); null for a step that did not fail.
    RunFailure:
      type: object
      additionalProperties: false
      description: A run's first failed step and the first line of its error.
      required:
      - node
      - error
      properties:
        node:
          type: string
          description: The step's node id, with its partition key when it has one.
        error:
          type: string
          description: 'ErrorType: message, the first line of the message only.'
    RunEvent:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - run_id
        properties:
          type:
            const: run_started
          run_id: *id003
      - type: object
        additionalProperties: false
        required:
        - type
        - line
        - when
        properties:
          type:
            const: line
          line: *id005
          when:
            type: string
            enum:
            - agent
            - always
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        - line
        properties:
          type:
            const: log
          node_id: *id003
          line: *id003
          stream:
            $ref: '#/components/schemas/LogStream'
          ts:
            description: When the worker wrote the line (RFC 3339, UTC, milliseconds). Absent only
              from events recorded by an older server
            type: string
      - type: object
        additionalProperties: false
        required:
        - type
        - node_id
        - ok
        properties:
          type:
            const: step_finished
          node_id: *id003
          ok: *id043
          elapsed_seconds: *id045
          import_seconds:
            type: number
            exclusiveMinimum: 1
          error: *id003
          cached:
            const: true
            description: Served from cache; absent otherwise.
      - type: object
        additionalProperties: false
        required:
        - type
        - run_id
        - ok
        properties:
          type:
            const: run_finished
          run_id: *id003
          ok: *id043
          outcome:
            $ref: '#/components/schemas/Outcome'
    ResetResult:
      type: object
      additionalProperties: false
      required:
      - database
      - moved_to
      - moved
      - undo
      properties:
        database:
          description: The metadata database, now a new empty one
          type: string
        moved_to:
          description: Where the database it replaced was moved (<db>.reset-<UTC>); null when there was
            none
          anyOf:
          - type: string
          - type: 'null'
        moved:
          description: Every file moved, the database first, then its -wal and -shm when they were there
          type: array
          items:
            type: string
        undo:
          description: The command that puts the moved database back, with barca serve stopped; null when
            nothing was moved
          anyOf:
          - type: string
          - type: 'null'
    PauseResult:
      description: The job's GET /schedule entry, or, when the scheduler has not published it (scheduling
        is off or starting), what the pause is.
      anyOf:
      - $ref: '#/components/schemas/Job'
      - type: object
        additionalProperties: false
        required:
        - id
        - paused
        - paused_until
        properties:
          id: *id005
          paused: &id059
            type: boolean
          paused_until: &id058
            anyOf:
            - type: integer
            - type: 'null'
    TriggeredBy:
      type: string
      enum:
      - schedule
      - api
      - client
      - manual
      description: 'What started a run: a cron tick, an HTTP request, a laptop posting to the ledger,
        or a command typed on a machine.'
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - command
      description: The flags of barca get / barca run.
      properties:
        command:
          type: string
          enum:
          - get
          - run
        targets:
          type: array
          items: *id005
          description: As given on the command line; [] means every asset and sensor (get only).
        files:
          type: array
          items: *id005
          description: Deployed files, as typed relative to the root; the run reads only these, as `barca get <target> <files>` does. [] means the deployed set.
        refresh:
          type: array
          items: *id005
          description: --refresh
        refresh_all:
          type: boolean
          description: --refresh-all
        cascade:
          type: boolean
          default: true
          description: false is --no-cascade
        dry_run:
          type: boolean
          description: Answer at once with the --dry-run JSON; nothing starts.
        agent:
          type: boolean
          description: Which stderr lines the client prints. Every line is streamed, tagged with when.
        values:
          type: boolean
          description: get -o value. The outcome's final_output holds the values, read on the server as
            barca get -o value --json prints them, instead of the artifact pointers.
        partition:
          type: string
          description: --partition of get or run, as the flag takes it (region=emea,amer, or a JSON object
            for compound keys). It narrows every partitioned node of the run with a named dimension;
            400 when it does not parse.
    Explain:
      type: object
      required:
      - steps
      - summary
      description: The barca get --dry-run --json / barca run --dry-run --json body.
      properties:
        partition_selection:
          $ref: '#/components/schemas/PartitionSelection'
        capacity:
          type: integer
          minimum: 0
          description: The most the weight= of the steps running at once may add up to (#436). Experimental.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepReport'
        summary:
          type: object
    Outcome:
      description: 'A finished run, tagged by status. success: the exact barca get --json / barca run
        --json body. failed: the failed-run stdout body plus envelope. cancelled and error: envelope only.'
      oneOf:
      - type: object
        required:
        - status
        - run_id
        - elapsed_seconds
        - steps_executed
        - phases
        - steps
        - warnings
        properties:
          status:
            const: success
          run_id: *id005
          elapsed_seconds:
            type: number
          steps_executed: *id056
          phases: *id056
          final_output:
            description: 'Single target: the value, or an artifact pointer for binary formats.'
          partition_selection:
            $ref: '#/components/schemas/PartitionSelection'
          targets:
            type: object
            description: 'Several targets: each target by name, in the order given.'
          steps:
            type: array
            items:
              $ref: '#/components/schemas/StepReport'
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/PlanWarning'
        not:
          required:
          - envelope
      - type: object
        required:
        - status
        - envelope
        properties:
          status:
            const: failed
          run_id: *id005
          failed_node: *id005
          error: *id005
          steps:
            type: array
            items:
              $ref: '#/components/schemas/StepReport'
          envelope:
            $ref: '#/components/schemas/Error'
      - type: object
        additionalProperties: false
        required:
        - status
        - envelope
        properties:
          status:
            enum:
            - cancelled
            - error
          envelope:
            $ref: '#/components/schemas/Error'
    RunView:
      type: object
      additionalProperties: false
      description: One run. A finished run is read from the metadata DB, so the answer is the same after
        a restart.
      required:
      - run_id
      - status
      - command
      - target
      - files
      - triggered_by
      - scheduled_at
      - schedule_id
      - started_at
      - finished_at
      - elapsed_seconds
      - steps_total
      - steps_executed
      - steps_cached
      - job
      - attempts
      - client_run_id
      - failure
      - outcome
      - error
      - steps
      - logs
      properties:
        run_id: *id005
        status:
          type: string
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
          - error
          - interrupted
        command: *id005
        target: *id042
        files:
          type: array
          items: *id005
        triggered_by: *id057
        scheduled_at:
          anyOf:
          - *id005
          - type: 'null'
          description: 'For a scheduled run: the tick, RFC 3339 UTC.'
        schedule_id:
          anyOf:
          - *id005
          - type: 'null'
          description: 'For a scheduled run: the scheduled node.'
        started_at: *id005
        finished_at: *id042
        elapsed_seconds: &id060
          anyOf:
          - type: number
          - type: 'null'
        steps_total: *id058
        steps_executed: *id056
        steps_cached: *id056
        job:
          anyOf:
          - type: string
          - type: 'null'
          description: The run's job (all, or its resolved node ids sorted and comma-separated); null while
            a live run has not recorded it.
        attempts:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total recorded attempts, as barca history counts them.
        client_run_id:
          anyOf:
          - type: string
          - type: 'null'
          description: For a run a laptop posted to the ledger, its run id on that laptop.
        failure:
          anyOf:
          - $ref: '#/components/schemas/RunFailure'
          - type: 'null'
          description: The first failed step and its error; null for a run with no failed step.
        outcome:
          anyOf:
          - $ref: '#/components/schemas/Outcome'
          - type: 'null'
          description: Null while the run runs, and for runs not started by barca serve.
        error: *id042
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunStep'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/Log'
    ListBody:
      type: object
      additionalProperties: false
      required:
      - nodes
      - total
      - truncated
      description: barca list --json --all.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        total: *id056
        truncated: *id059
        hint: *id005
        root: *id005
    StatusBody:
      type: object
      required:
      - nodes
      - total
      - truncated
      description: barca status --json --all for the server ledger.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeStatus'
        total: *id056
        truncated: *id059
        root: *id005
        filter:
          type: object
          additionalProperties: false
          description: Present when state or problems was given.
          properties:
            states:
              type: array
              items:
                type: string
            problems:
              type: boolean
    LedgerKey:
      type: object
      additionalProperties: false
      required:
      - node_id
      - run_hash
      properties:
        node_id:
          type: string
          description: A node id, with a partition suffix for one key.
        run_hash:
          type: string
    LedgerLookup:
      type: object
      additionalProperties: false
      required:
      - hashes
      properties:
        hashes:
          type: array
          items:
            $ref: '#/components/schemas/LedgerKey'
    LedgerEntry:
      type: object
      additionalProperties: false
      required:
      - node_id
      - run_hash
      - exists
      properties:
        node_id:
          type: string
        run_hash:
          type: string
        exists:
          type: boolean
        path:
          type: string
          description: The artifact's location in the store; only when exists.
        format:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        digest:
          type: string
          description: SHA-256 of the artifact's bytes; absent for a row recorded before digests were.
    LedgerLookupResult:
      type: object
      additionalProperties: false
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
    LedgerRun:
      type: object
      required:
      - run_id
      - command
      - status
      - started_at
      properties:
        run_id:
          type: string
          description: The run id on the posting machine; recorded as client_run_id.
        command:
          type: string
        files:
          type: array
          items:
            type: string
        target:
          type:
          - string
          - 'null'
        status:
          type: string
        steps_total:
          type:
          - integer
          - 'null'
        steps_executed:
          type: integer
        steps_cached:
          type: integer
        started_at:
          type: string
        finished_at:
          type:
          - string
          - 'null'
        elapsed_seconds:
          type:
          - number
          - 'null'
        host:
          type:
          - string
          - 'null'
    LedgerStep:
      type: object
      required:
      - node_id
      - run_hash
      - status
      properties:
        node_id:
          type: string
        run_hash:
          type: string
        status:
          type: string
        path:
          type:
          - string
          - 'null'
          description: The artifact's location in the store; required for a successful step.
        format:
          type:
          - string
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        digest:
          type:
          - string
          - 'null'
          description: SHA-256 of the artifact's bytes; required for a successful step.
        elapsed_seconds:
          type:
          - number
          - 'null'
        attempts:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
    LedgerPost:
      type: object
      required:
      - run
      - steps
      description: One finished run on the posting machine and its step rows.
      properties:
        run:
          $ref: '#/components/schemas/LedgerRun'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/LedgerStep'
    LedgerAccepted:
      type: object
      additionalProperties: false
      required:
      - run_id
      - bytes_changed
      properties:
        run_id:
          type: string
          description: The run id this server recorded the run under.
        bytes_changed:
          type: array
          items:
            type: string
          description: Steps whose run hash the ledger already held with another digest; it kept its row.
    HistoryRun:
      type: object
      additionalProperties: false
      required:
      - run_id
      - command
      - files
      - target
      - job
      - status
      - steps_total
      - steps_executed
      - steps_cached
      - attempts
      - started_at
      - finished_at
      - elapsed_seconds
      - triggered_by
      - scheduled_at
      - schedule_id
      - client_run_id
      - failure
      - failed_node
      - error
      properties:
        run_id: *id005
        command: *id005
        files:
          type: array
          items: *id005
        target: *id042
        job:
          type:
          - string
          - 'null'
          description: The run's job, all for a run without targets, otherwise its resolved node ids
            sorted and comma-separated; null for runs recorded before barca stored it.
        status: *id005
        steps_total: *id058
        steps_executed: *id056
        steps_cached: *id056
        attempts: *id058
        started_at: *id005
        finished_at: *id042
        elapsed_seconds: *id060
        triggered_by: *id057
        scheduled_at: *id042
        schedule_id: *id042
        client_run_id:
          type:
          - string
          - 'null'
          description: For a run a laptop posted to the ledger (triggered_by client), its run id on that
            laptop; null otherwise.
        failure:
          anyOf:
          - $ref: '#/components/schemas/RunFailure'
          - type: 'null'
          description: The first failed step and its error; null for a run with no failed step.
        failed_node:
          type:
          - string
          - 'null'
          description: failure.node, flat for --fields.
        error:
          type:
          - string
          - 'null'
          description: failure.error, flat for --fields.
    SqlCatalog:
      type: object
      additionalProperties: false
      required:
      - views
      - missing
      - duplicates
      description: Which result each barca sql view reads (GET /sql/views).
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/SqlView'
        missing:
          type: array
          description: Nodes with no queryable result, so no view.
          items:
            $ref: '#/components/schemas/SqlMissing'
        duplicates:
          type: array
          description: Names several nodes share; their views are named by node id.
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - ids
            properties:
              name:
                type: string
              ids:
                type: array
                items:
                  type: string
    SqlView:
      type: object
      additionalProperties: false
      required:
      - name
      - node
      - kind
      - partitioned
      - format
      - files
      - stale
      properties:
        name:
          type: string
          description: The view's name in SQL.
        node:
          type: string
        kind:
          enum:
          - asset
          - task
          - sensor
        partitioned:
          type: boolean
        format:
          type: string
          description: parquet, csv, json or pickle (a pickle view cannot be queried).
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - partition
            properties:
              path:
                type: string
                description: Where the result is stored (a store path).
              partition:
                type:
                - string
                - 'null'
                description: The partition key; null for an unpartitioned node.
              content_hash:
                type: string
                description: SHA-256 of the result's bytes, when recorded.
        stale:
          type: boolean
          description: The code or inputs changed since the result was computed; the view shows it.
        run_hash:
          type: string
          description: The run hash the node's code and inputs give now, when known.
    SqlMissing:
      type: object
      additionalProperties: false
      required:
      - name
      - node
      - kind
      - partitioned
      - command
      properties:
        name:
          type: string
        node:
          type: string
        kind:
          enum:
          - asset
          - task
          - sensor
        partitioned:
          type: boolean
        command:
          type: string
          description: The command that produces it (barca get NAME).
        keys_unknown:
          type: string
          description: A partitioned node whose current keys are not known until a source materializes.
        run_hash:
          type: string
    MaterializationsBody:
      type: object
      additionalProperties: false
      required:
      - materializations
      - total
      - limit
      - offset
      properties:
        materializations:
          type: array
          items:
            $ref: '#/components/schemas/StepRow'
        total:
          type: integer
          minimum: 0
          description: Rows recorded in all.
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
    StepRow:
      type: object
      additionalProperties: false
      required:
      - node_id
      - partition
      - run_id
      - run_hash
      - status
      - created_at
      - elapsed_seconds
      - cpu_seconds
      - max_rss_bytes
      - attempts
      - format
      - size_bytes
      - artifact
      - content_hash
      - error_type
      - error_message
      description: One recorded step result (barca sql's barca.materializations).
      properties:
        node_id:
          type: string
          description: Node id, with the partition suffix for a partitioned step.
        partition:
          type:
          - string
          - 'null'
        run_id:
          type:
          - string
          - 'null'
        run_hash:
          type:
          - string
          - 'null'
        status:
          enum:
          - success
          - failed
        created_at:
          type: string
          description: UTC, YYYY-MM-DD HH:MM:SS.
        elapsed_seconds:
          type:
          - number
          - 'null'
        cpu_seconds:
          type:
          - number
          - 'null'
        max_rss_bytes:
          type:
          - integer
          - 'null'
        attempts:
          type:
          - integer
          - 'null'
        format:
          type:
          - string
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
        artifact:
          type:
          - string
          - 'null'
        content_hash:
          type:
          - string
          - 'null'
        error_type:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
    HistoryBody:
      type: object
      additionalProperties: false
      required:
      - runs
      - total
      - truncated
      description: barca history --json.
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/HistoryRun'
        total: *id056
        truncated: *id059
        hint: *id005
    Project:
      type: object
      additionalProperties: false
      required:
      - api_version
      - root
      - env
      - deployed_at
      - commit
      - files
      properties:
        api_version:
          const: 1
        root: *id042
        env: *id005
