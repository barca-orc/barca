      - cached
      - will_run
      - will_run_keys
      properties:
        total: *id044
        cached: *id044
        will_run: *id044
        will_run_keys:
          type: array
          items: *id003
          maxItems: 20
    StepReport:
      type: object
      additionalProperties: false
