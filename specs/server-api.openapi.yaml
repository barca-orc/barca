        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id019
  /schedule/{id}/pause:
    post:
      summary: Pause one schedule
      operationId: post_schedule_id_pause
      responses:
        '200':
          description: The job's schedule entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseResult'
        '400':
          description: until is not an RFC 3339 time in the future
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Read-only server refuses mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not a scheduled node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ambiguous name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Metadata DB error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
      description: 'Its due ticks are skipped with reason paused until it is resumed or until passes.
        Kept in schedule_state: a restart does not resume it.'
      parameters:
      - &id020
        name: id
        in: path
        required: true
        schema:
          type: string
        description: 'The scheduled node: its full id (percent-encode a /) or its name.'
      - name: until
        in: query
        required: false
        schema: *id005
        description: 'RFC 3339; absent: until resumed.'
  /schedule/{id}/resume:
    post:
      summary: Resume one schedule
      operationId: post_schedule_id_resume
      responses:
        '200':
          description: The job's schedule entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseResult'
        '400':
          description: until is not an RFC 3339 time in the future
          content:
            application/json:
              schema:
