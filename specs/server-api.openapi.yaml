          type: array
          items:
            $ref: '#/components/schemas/StepReport'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanWarning'
        cache:
          $ref: '#/components/schemas/CacheReport'
        uploads:
          $ref: '#/components/schemas/Uploads'
        partition_selection:
          $ref: '#/components/schemas/PartitionSelection'
    PartitionSelection:
      type: object
      additionalProperties: false
      description: --partition (RunRequest.partition) on a run, a dry run or barca plan. The
        selection, each narrowed node (a planned partitioned node with a selected dimension) with
        the keys kept and left out (null while its keys are not known, before its partitions_from
        source ran), and the nodes the selection does not run (each also a step with status, or in
        a dry run action, skipped and reason partition_selection).
      required:
      - selection
      - nodes
      - skipped_nodes
      properties:
        selection:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - selected
            - skipped
            properties:
              id:
                type: string
              selected:
                type:
                - integer
                - 'null'
                minimum: 0
              skipped:
                type:
                - integer
                - 'null'
                minimum: 0
        skipped_nodes:
          type: array
          items:
            type: string
    CacheReport:
      type: object
      additionalProperties: false
