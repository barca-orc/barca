# Normative shipped HTTP boundary; update this document and conformance in the same PR.
openapi: 3.1.0
info:
  title: Barca current HTTP API
  version: '4'
  description: 'Normative current wire contract; specification version 4 is independent of package versions.
    Scope: registered barca-server routes and fallback responses. No authentication is implemented (security
    is empty); read-only is an operating mode. The run contract and inspection routes of RFC-0007 section
    3.4 are shipped (POST /runs, GET /runs/{run_id}, its events, output and cancel; /list, /nodes, /history,
    /stats/{name}, /project), and so are its ledger routes (POST /ledger/lookup, POST /ledger/runs). Every error body is the CLI error
    envelope. Routes marked deprecated are aliases kept for one minor release. Conformance: crates/barca-server/tests/openapi.rs
    and python/tests/test_http_openapi_client.py.'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://127.0.0.1:8274
  description: Default local listener; configurable host/port, reverse proxies may add a prefix.
security: []
paths:
  /health:
    get:
      summary: Server liveness and operating modes
      operationId: get_health
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id001
            Allow:
              schema: &id003
                type: string
              description: Methods accepted by this route
      description: Liveness, not readiness or authentication. The API has no authentication. Read-only
        mode refuses mutating routes; it does not restrict inspection access. load_errors reports unloaded
        sources and excluded dependent definitions from the selected served graph. Healthy loads return
        an empty array; healthy definitions remain inspectable beside those diagnostics.
    head:
      summary: Server liveness and operating modes (headers only)
      operationId: head_health
      responses:
        '200':
          description: Response
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id001
  /project:
    get:
      summary: The deployed tree
      operationId: get_project
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '500':
          description: Inspection infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers: &id002
            Allow:
              schema:
                type: string
              description: Methods accepted by this route
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema: &id005
                type: string
      description: The deployed files and their sha256, hashed on each request, the environment and the
        commit at the root.
    head:
      summary: The deployed tree (headers only)
      operationId: head_project
      responses:
        '200':
          description: Response
        '500':
          description: Inspection infrastructure error
        '405':
          description: Registered path with unsupported method; Allow header identifies supported methods
          headers: *id002
        '400':
          description: Invalid request
